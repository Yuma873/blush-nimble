  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <style>
    :root{
      --nav-width:240px;
      --accent:#1abc9c;
      --bg:#f5f7fa;
      --card:#ffffff;
    }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN",Meiryo,Arial; background:var(--bg); color:#222; }
    nav{ position:fixed; left:0; top:0; bottom:0; width:var(--nav-width); background:#2c3e50; color:#fff; padding:16px; box-sizing:border-box; overflow:auto; }
    nav a{ display:block; color:#fff; text-decoration:none; margin:8px 0; padding:10px; background:#34495e; border-radius:6px; text-align:center; }
    main{ margin-left:var(--nav-width); padding:18px; }
    .top-controls{ display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    .search, .filter, .export { padding:8px 10px; border-radius:6px; border:1px solid #ddd; background:var(--card); }
    .legend{ display:flex; gap:10px; margin-top:12px; font-size:14px; }
    .legend span{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:middle; }
    .fc .fc-toolbar-title{ font-weight:700; }
    /* モーダル */
    .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:2000; }
    .modal{ background:var(--card); padding:16px; border-radius:8px; width:360px; max-width:94%; box-shadow:0 6px 24px rgba(0,0,0,0.2); }
    .modal h3{ margin:0 0 8px 0; }
    .btn{ padding:8px 10px; border-radius:6px; border:none; cursor:pointer; }
    .btn.primary{ background:var(--accent); color:#fff; }
    .btn.ghost{ background:transparent; border:1px solid #ccc; }
    @media(max-width:768px){
      nav{ position:relative; width:100%; height:auto; display:flex; gap:8px; overflow-x:auto; padding:8px; }
      main{ margin-left:0; margin-top:8px; }
    }
  </style>
</head>

function convertEvents(arr){
  return arr.map(ev=>{
    let start = ev.date;
    let title = ev.name;
    // try to parse start time if present (simple heuristic)
    if(ev.time && ev.time !== 'All' && ev.time.indexOf('~')>-1){
      const t = ev.time.split('~')[0].replace(/[^\d:]/g,'');
      if(t){
        // normalize to HH:MM
        let hhmm = t;
        if(hhmm.length === 4 && hhmm.indexOf(':')===-1) hhmm = hhmm.slice(0,2)+':'+hhmm.slice(2);
        start = ev.date + 'T' + hhmm;
      }
    } else if(ev.time && ev.time !== 'All' && /^\d{1,2}:\d{2}$/.test(ev.time)){
      start = ev.date + 'T' + ev.time;
    }
    return {
      id: ev.date + '|' + ev.name + '|' + Math.random().toString(36).slice(2,8),
      title: title,
      start: start,
      extendedProps: {
        raw: ev,
        type: ev.type || 'other',
        time: ev.time || '',
        location: ev.location || ''
      },
      classNames: [ev.type || 'other']
    };
  });
}

document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  const initialEvents = convertEvents(window.INIT_EVENTS);

  const calendar = new FullCalendar.Calendar(calendarEl, {
    locale: 'ja',
    initialView: 'dayGridMonth',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: ''
    },
    height: 'auto',
    navLinks: true,
    selectable: true,
    editable: true,
    dayMaxEventRows: true,
    events: initialEvents,
    eventClick: function(info){
      const ev = info.event.extendedProps.raw;
      showModal(`<strong>${ev.name}</strong><br>${ev.time || ''}<br>場所: ${ev.location || '--'}`);
    },
    eventDrop: function(info){
      console.log('moved', info.event.id, info.event.start);
    }
  });

  calendar.render();

  /* ビュー切替 */
  document.getElementById('view-select').addEventListener('change', function(){
    calendar.changeView(this.value);
  });

  /* 検索 */
  document.getElementById('search').addEventListener('input', function(){
    const q = this.value.trim().toLowerCase();
    calendar.getEvents().forEach(ev=>{
      const raw = ev.extendedProps.raw || {};
      const text = (raw.name + ' ' + (raw.location||'')).toLowerCase();
      if(q === '' || text.indexOf(q) !== -1) ev.setProp('display','auto'); else ev.setProp('display','none');
    });
  });

  /* フィルタ */
  document.querySelectorAll('.type-filter').forEach(cb=>{
    cb.addEventListener('change', function(){
      const allowed = Array.from(document.querySelectorAll('.type-filter:checked')).map(x=>x.value);
      calendar.getEvents().forEach(ev=>{
        const t = ev.extendedProps.type || 'other';
        ev.setProp('display', allowed.includes(t) ? 'auto' : 'none');
      });
    });
  });

  /* ICS エクスポート（簡易） */
  document.getElementById('export-ics').addEventListener('click', function(){
    const events = calendar.getEvents().map(ev=>{
      const r = ev.extendedProps.raw || {};
      return {
        title: r.name || ev.title,
        start: ev.start ? ev.start.toISOString() : '',
        end: ev.end ? ev.end.toISOString() : '',
        description: (r.time||'') + ' ' + (r.location||'')
      };
    });
    const ics = buildICS(events);
    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'events.ics'; a.click();
    URL.revokeObjectURL(url);
  });

  /* コントロールを外部に移動 */
  const toolbar = calendarEl.querySelector('.fc-toolbar');
  if(toolbar) document.getElementById('calendar-controls').appendChild(toolbar);

  /* モーダル操作 */
  document.getElementById('modal-close').addEventListener('click', hideModal);
  document.getElementById('modal-backdrop').addEventListener('click', function(e){
    if(e.target === this) hideModal();
  });
});

/* モーダル表示 */
function showModal(html){
  const b = document.getElementById('modal-backdrop');
  document.getElementById('modal-body').innerHTML = html;
  b.style.display = 'flex';
  b.setAttribute('aria-hidden','false');
}
function hideModal(){
  const b = document.getElementById('modal-backdrop');
  b.style.display = 'none';
  b.setAttribute('aria-hidden','true');
}

/* 簡易 ICS ビルダー（イベント配列から） */
function buildICS(events){
  const pad = n => (n<10? '0'+n : n);
  function toICSDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
  }
  let out = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MyCalendar//EN\r\n';
  events.forEach((e,i)=>{
    out += 'BEGIN:VEVENT\r\n';
    out += 'UID:event-'+i+'@local\r\n';
    out += 'SUMMARY:'+escapeICSText(e.title)+'\r\n';
    if(e.start) out += 'DTSTART:'+toICSDate(e.start)+'\r\n';
    if(e.end) out += 'DTEND:'+toICSDate(e.end)+'\r\n';
    if(e.description) out += 'DESCRIPTION:'+escapeICSText(e.description)+'\r\n';
    out += 'END:VEVENT\r\n';
  });
  out += 'END:VCALENDAR\r\n';
  return out;
}
function escapeICSText(s){ return (s||'').replace(/\n/g,'\\n').replace(/,/g,'\\,'); }
</script>
