<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ポータルカレンダー（改良版・機能満載）</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --muted:#6b7280;
    --accent:#1abc9c; --accent-contrast:#fff;
    --nav:#2c3e50; --nav-contrast:#fff;
    --danger:#e74c3c; --shadow:0 6px 20px rgba(0,0,0,0.08);
  }
  [data-theme="dark"]{
    --bg:#0f1724; --card:#0b1220; --muted:#9aa4b2; --accent:#06b6d4; --accent-contrast:#042028; --nav:#071029; --nav-contrast:#cfeff6;
  }
  html,body{ height:100%; margin:0; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, Arial, sans-serif; background:var(--bg); color:var(--nav-contrast); }
  header{ display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--nav); color:var(--nav-contrast); box-shadow:var(--shadow); position:sticky; top:0; z-index:50; }
  header h1{ margin:0; font-size:18px; font-weight:700; }
  .controls{ margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn{ background:var(--card); color:inherit; border:0; padding:8px 10px; border-radius:8px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
  .btn.primary{ background:var(--accent); color:var(--accent-contrast); font-weight:700; }
  .btn.ghost{ background:transparent; border:1px solid rgba(0,0,0,0.06); }
  main{ display:flex; gap:16px; padding:18px; box-sizing:border-box; min-height:calc(100vh - 64px); }
  nav{ width:260px; background:linear-gradient(180deg,var(--nav),#1f2d3a); padding:14px; border-radius:12px; box-sizing:border-box; }
  nav a{ display:block; color:var(--nav-contrast); text-decoration:none; margin:8px 0; padding:8px; background:rgba(255,255,255,0.03); border-radius:8px; text-align:center; }
  .sidebar-section{ margin-top:12px; color:var(--nav-contrast); font-size:14px; }
  .legend{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .legend div{ display:flex; align-items:center; gap:6px; color:var(--nav-contrast); }
  .legend span{ width:12px; height:12px; display:inline-block; border-radius:3px; }
  .calendar-wrap{ flex:1; display:flex; flex-direction:column; gap:12px; }
  .topbar{ display:flex; align-items:center; gap:12px; }
  .month-title{ font-size:20px; font-weight:800; color:var(--nav-contrast); }
  .toolbar-left{ display:flex; gap:8px; align-items:center; }
  .toolbar-right{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  .search{ padding:8px 10px; border-radius:8px; border:1px solid rgba(0,0,0,0.06); min-width:220px; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .dow{ background:rgba(255,255,255,0.03); padding:8px; text-align:center; border-radius:8px; font-weight:700; color:var(--nav-contrast); }
  .cell{ background:var(--card); color:initial; min-height:110px; padding:8px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.04); position:relative; overflow:hidden; display:flex; flex-direction:column; gap:6px; }
  .cell .date{ font-weight:700; color:var(--muted); }
  .cell.sunday{ background: linear-gradient(180deg, rgba(255,240,240,0.6), var(--card)); }
  .cell.saturday{ background: linear-gradient(180deg, rgba(240,248,255,0.6), var(--card)); }
  .today{ outline:3px solid var(--accent); }
  .events-list{ overflow:auto; max-height:calc(100vh - 260px); padding-right:6px; }
  .event-pill{ display:block; padding:6px 8px; border-radius:8px; color:#fff; font-size:13px; margin-bottom:6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .type-practice{ background:#2b8cff; }
  .type-tournament{ background:#e74c3c; }
  .type-school{ background:#27ae60; }
  .type-other{ background:#f39c12; color:#222; }
  .modal-backdrop{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); z-index:2000; }
  .modal{ background:var(--card); color:initial; padding:16px; border-radius:10px; width:420px; max-width:94%; box-shadow:0 10px 40px rgba(0,0,0,0.3); }
  .form-row{ display:flex; gap:8px; margin-top:8px; }
  label{ font-size:13px; color:var(--muted); }
  input[type="text"], input[type="date"], input[type="time"], select, textarea{ padding:8px; border-radius:8px; border:1px solid rgba(0,0,0,0.08); width:100%; box-sizing:border-box; }
  textarea{ min-height:80px; resize:vertical; }
  .small{ font-size:13px; color:var(--muted); }
  .footer-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .import-area{ margin-top:8px; }
  .kbd{ background:rgba(0,0,0,0.06); padding:2px 6px; border-radius:6px; font-weight:700; font-size:12px; }
  @media(max-width:1000px){
    main{ flex-direction:column; padding:12px; }
    nav{ width:100%; display:flex; gap:8px; overflow-x:auto; padding:8px; border-radius:8px; }
    .grid{ gap:6px; }
    .cell{ min-height:90px; }
  }
</style>
</head>
<body data-theme="light">

<header>
  <h1>ポータルカレンダー</h1>
  <div class="controls" role="toolbar" aria-label="カレンダー操作">
    <div class="toolbar-left">
      <button id="prevBtn" class="btn" title="前月（←）">◀</button>
      <button id="todayBtn" class="btn primary" title="今日（T）">今日</button>
      <button id="nextBtn" class="btn" title="次月（→）">▶</button>

      <option value="list">リスト表示</option>
    </select>
    <button id="addEventBtn" class="btn primary" title="イベント追加（N）">＋ イベント追加</button>
    <button id="themeToggle" class="btn" title="テーマ切替">テーマ</button>
    <button id="exportJsonBtn" class="btn" title="JSONエクスポート">JSON</button>
    <button id="exportIcsBtn" class="btn" title="ICSエクスポート">ICS</button>
    <button id="importBtn" class="btn" title="JSONインポート">インポート</button>
  </div>
</header>

<main>
  <nav aria-label="サイドバー">
    <a href="https://yuma873.github.io/blush-nimble/toppage.html">トップ</a>
    <a href="https://yuma873.github.io/blush-nimble/index.html" style="background:#f44336;">ログアウト</a>

    <div class="sidebar-section" style="margin-top:12px;">

    <div class="sidebar-section">

        <div><span style="background:#27ae60"></span> 学校行事</div>
        <div><span style="background:#f39c12"></span> その他</div>
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:12px;">
      <strong>ショートカット</strong>
      <div class="small" style="margin-top:6px;">
        <div><span class="kbd">N</span> 新規イベント</div>
        <div><span class="kbd">T</span> 今日へ</div>
        <div><span class="kbd">←</span>/<span class="kbd">→</span> 月移動</div>
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:12px;">
      <strong>インポート / エクスポート</strong>
      <div class="small" style="margin-top:6px;">JSONで保存・読み込み、ICSでエクスポートできます。</div>
      <div class="import-area">
        <input id="fileInput" type="file" accept=".json,.ics" />
      </div>
    </div>
  </nav>

  <div class="calendar-wrap" role="main">
    <div class="topbar">
      <div class="month-title" id="monthTitle">--</div>
      <div class="toolbar-right">
        <div class="small" id="statusInfo">読み込み中…</div>
      </div>
    </div>

    <div id="calendarArea">
      <div id="monthView">
        <div class="grid" id="dowRow" aria-hidden="false">
          <div class="dow">日</div><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>
        </div>
        <div class="grid" id="calendarGrid" aria-live="polite"></div>
      </div>

      <div id="listView" style="display:none;">
        <div id="listContainer"></div>
      </div>
    </div>
  </div>
</main>

<!-- モーダル（イベント追加/編集） -->
<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-hidden="true">

      </div>

          <option value="tournament">大会</option>
          <option value="school">学校行事</option>
          <option value="other">その他</option>
        </select>
      </label>
      <label>場所

      </label>
      <label>メモ

      </label>
      <div class="footer-actions">

        <button id="cancelBtn" class="btn">キャンセル</button>
        <button id="saveBtn" class="btn primary">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================
   概要
   - 外部ライブラリ不使用
   - イベントは localStorage に保存
   - 時刻正規化：開始/終了を厳密に扱う。開始のみなら終了=開始。終日は allDay=true。
   - 通知：ページを開くたびに今日の予定を通知
   - ドラッグ＆ドロップで日付移動（簡易）
   - インポート/エクスポート（JSON/ICS）
   ============================ */

/* ---------- ユーティリティ ---------- */
function $(sel, ctx=document) { return ctx.querySelector(sel); }
function $all(sel, ctx=document) { return Array.from(ctx.querySelectorAll(sel)); }
function pad(n){ return String(n).padStart(2,'0'); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------- データ管理 ---------- */
const STORAGE_KEY = 'portal_calendar_events_v2';
let events = []; // 内部表現: {id, date(YYYY-MM-DD), allDay(bool), start:Date or null, end:Date or null, title, type, location, note, rawTimeStr}
function loadEvents(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      events = parsed.map(normalizeEventFromStorage);
    } else {
      // 初期データ: 添付の予定をそのまま組み込む（抜粋）
      events = normalizeEventArray(INIT_RAW_EVENTS);
      saveEvents();
    }
  }catch(e){
    console.error('loadEvents error', e);
    events = normalizeEventArray(INIT_RAW_EVENTS);
  }
}
function saveEvents(){
  const toStore = events.map(e => ({
    id: e.id, date: e.date, allDay: e.allDay,
    start: e.start ? e.start.toISOString() : null,
    end: e.end ? e.end.toISOString() : null,
    title: e.title, type: e.type, location: e.location, note: e.note, rawTimeStr: e.rawTimeStr
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
}
function normalizeEventFromStorage(s){
  return {
    id: s.id,
    date: s.date,
    allDay: !!s.allDay,
    start: s.start ? new Date(s.start) : null,
    end: s.end ? new Date(s.end) : null,
    title: s.title,
    type: s.type || 'other',
    location: s.location || '--',
    note: s.note || '',
    rawTimeStr: s.rawTimeStr || ''
  };
}

/* ---------- 時刻正規化（RAW -> 内部イベント） ---------- */
/* RAW 形式: { date:'YYYY-MM-DD', time:'...', name:'...', type:'practice', location:'...' } */
function parseTimeRange(timeStr){
  if(!timeStr) return { allDay:false };
  const s = String(timeStr).trim();
  if(/^All$/i.test(s) || /^終日$/.test(s)) return { allDay:true };
  const hhmmRegex = /(\d{1,2}:\d{2})/g;
  const matches = [...s.matchAll(hhmmRegex)].map(m=>m[1]);
  if(matches.length === 0) return { allDay:false };
  if(matches.length === 1) return { start:matches[0], end:matches[0], allDay:false };
  const start = matches[0], end = matches[1];
  if(start === '00:00' && end === '23:59') return { allDay:true };
  return { start, end, allDay:false };
}
function toLocalDateObj(dateStr, hhmm){
  const [y,m,d] = dateStr.split('-').map(Number);
  if(!hhmm) return new Date(y, m-1, d);
  const [hh,mm] = hhmm.split(':').map(Number);
  return new Date(y, m-1, d, hh, mm, 0, 0);
}
function normalizeEventArray(rawArr){
  return rawArr.map((ev, idx) => {
    const p = parseTimeRange(ev.time);
    const base = {
      id: 'ev-' + Date.now() + '-' + idx + '-' + Math.random().toString(36).slice(2,6),
      date: ev.date,
      title: ev.name || ev.title || '無題',
      type: ev.type || 'other',
      location: ev.location || '--',
      note: ev.note || '',
      rawTimeStr: ev.time || ''
    };
    if(p.allDay){
      base.allDay = true;
      base.start = null;
      base.end = null;
    } else {
      const start = toLocalDateObj(ev.date, p.start || null);
      const end = toLocalDateObj(ev.date, p.end || p.start || null);
      if(end.getTime() <= start.getTime()) end.setMinutes(end.getMinutes() + 1);
      base.allDay = false;
      base.start = start;
      base.end = end;
    }
    return base;
  });
}

/* ---------- カレンダー描画ロジック ---------- */
let current = new Date(); // 表示基準
function render(){
  const view = $('#viewSelect').value;
  document.getElementById('monthTitle').textContent = `${current.getFullYear()}年 ${current.getMonth()+1}月`;
  $('#statusInfo').textContent = `イベント ${events.length} 件`;
  if(view === 'list'){
    $('#monthView').style.display = 'none';
    $('#listView').style.display = 'block';
    renderListView();
  } else {
    $('#monthView').style.display = 'block';
    $('#listView').style.display = 'none';
    renderMonthView();
  }
  saveEvents();
}
function renderListView(){
  const container = $('#listContainer');
  container.innerHTML = '';
  const year = current.getFullYear(), month = current.getMonth()+1;
  const monthStr = `${year}-${pad(month)}`;
  const monthEvents = events.filter(e => e.date.startsWith(monthStr)).sort((a,b) => {
    const ta = a.allDay ? new Date(a.date) : a.start;
    const tb = b.allDay ? new Date(b.date) : b.start;
    return ta - tb;
  });
  if(monthEvents.length === 0){
    container.textContent = '今月の予定はありません';
    return;
  }
  monthEvents.forEach(ev => {
    const el = document.createElement('div');
    el.style.padding = '10px';
    el.style.marginBottom = '8px';
    el.style.background = 'var(--card)';
    el.style.borderRadius = '8px';
    el.style.boxShadow = '0 2px 8px rgba(0,0,0,0.04)';
    el.innerHTML = `<strong>${escapeHtml(ev.title)}</strong> <span class="small">(${escapeHtml(ev.type)})</span><br>
      <div class="small">${ev.allDay ? '終日' : (formatDateTime(ev.start) + (ev.end ? ' - ' + formatDateTime(ev.end) : ''))}</div>
      <div class="small">場所: ${escapeHtml(ev.location)}</div>`;
    el.addEventListener('click', ()=> openEditModal(ev));
    container.appendChild(el);
  });
}
function renderMonthView(){
  const grid = $('#calendarGrid');
  grid.innerHTML = '';
  const year = current.getFullYear(), month = current.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  const firstDow = first.getDay();
  const totalDays = last.getDate();

  // leading blanks
  for(let i=0;i<firstDow;i++){
    const blank = document.createElement('div');
    blank.className = 'cell';
    blank.style.opacity = '0.3';
    grid.appendChild(blank);
  }

  for(let d=1; d<=totalDays; d++){
    const dateStr = `${year}-${pad(month+1)}-${pad(d)}`;
    const cell = document.createElement('div');
    cell.className = 'cell';
    const dow = new Date(year, month, d).getDay();
    if(dow === 0) cell.classList.add('sunday');
    if(dow === 6) cell.classList.add('saturday');
    const today = new Date();
    if(d === today.getDate() && month === today.getMonth() && year === today.getFullYear()){
      cell.classList.add('today');
    }
    const dateEl = document.createElement('div');
    dateEl.className = 'date';
    dateEl.textContent = d;
    cell.appendChild(dateEl);

    const dayEvents = events.filter(ev => ev.date === dateStr);
    const q = $('#searchInput').value.trim().toLowerCase();
    const allowedTypes = $all('.type-filter:checked').map(x=>x.value);
    const eventsContainer = document.createElement('div');
    eventsContainer.className = 'events-list';
    dayEvents.forEach(ev => {
      if(!allowedTypes.includes(ev.type)) return;
      const text = (ev.title + ' ' + ev.location + ' ' + (ev.rawTimeStr||'')).toLowerCase();
      if(q && text.indexOf(q) === -1) return;
      const pill = document.createElement('span');
      pill.className = `event-pill type-${ev.type}`;
      pill.textContent = ev.allDay ? `終日 ${ev.title}` : `${formatTimeShort(ev.start)} ${ev.title}`;
      pill.title = `${ev.title}\n${ev.allDay ? '終日' : (formatDateTime(ev.start) + (ev.end ? ' - ' + formatDateTime(ev.end) : ''))}\n場所: ${ev.location}`;
      pill.draggable = true;
      pill.addEventListener('click', (e)=> { e.stopPropagation(); openEditModal(ev); });
      // dragstart: attach event id
      pill.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', ev.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      eventsContainer.appendChild(pill);
    });
    cell.appendChild(eventsContainer);

    // cell dragover/drop for moving events
    cell.addEventListener('dragover', (e)=> { e.preventDefault(); cell.style.outline = '2px dashed rgba(0,0,0,0.12)'; });
    cell.addEventListener('dragleave', ()=> { cell.style.outline = 'none'; });
    cell.addEventListener('drop', (e)=> {
      e.preventDefault();
      cell.style.outline = 'none';
      const evId = e.dataTransfer.getData('text/plain');
      const ev = events.find(x=>x.id === evId);
      if(ev){
        // move to this date; if event had times, keep times but change date
        const oldDate = ev.date;
        ev.date = dateStr;
        if(!ev.allDay && ev.start){
          // shift start/end to new date preserving time-of-day
          const s = ev.start;
          const eTime = ev.end;
          const [y,mn,dd] = dateStr.split('-').map(Number);
          ev.start = new Date(y, mn-1, dd, s.getHours(), s.getMinutes(), 0, 0);
          if(eTime) ev.end = new Date(y, mn-1, dd, eTime.getHours(), eTime.getMinutes(), 0, 0);
        }
        saveEvents();
        render();
      }
    });

    // click on cell to show day's events or create new
    cell.addEventListener('click', ()=> {
      const dayList = events.filter(ev => ev.date === dateStr);
      if(dayList.length === 0){
        openCreateModal(dateStr);
      } else {
        openDayListModal(dayList, dateStr);
      }
    });

    grid.appendChild(cell);
  }

  // trailing blanks
  const cells = grid.children.length;
  const rem = (7 - (cells % 7)) % 7;
  for(let i=0;i<rem;i++){
    const blank = document.createElement('div');
    blank.className = 'cell';
    blank.style.opacity = '0.3';
    grid.appendChild(blank);
  }
}

/* ---------- 表示補助 ---------- */
function formatDateTime(d){
  if(!d) return '';
  if(typeof d === 'string') return d;
  const dt = new Date(d);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}
function formatTimeShort(d){
  if(!d) return '';
  if(typeof d === 'string') return '';
  const dt = new Date(d);
  return `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}

/* ---------- 保存・削除処理 ---------- */
function onSaveEvent(){
  const title = $('#evTitle').value.trim() || '無題';
  const date = $('#evDate').value;
  const allDay = $('#evAllDay').value === 'true';
  const startTime = $('#evStartTime').value;
  const endTime = $('#evEndTime').value;
  const type = $('#evType').value;
  const location = $('#evLocation').value.trim() || '--';
  const note = $('#evNote').value.trim();

  // normalize times
  let start = null, end = null;
  let rawTimeStr = '';
  if(allDay){
    rawTimeStr = '終日';
  } else {
    if(startTime && endTime){
      start = toLocalDateObj(date, startTime);
      end = toLocalDateObj(date, endTime);
      rawTimeStr = `${startTime}~${endTime}`;
    } else if(startTime && !endTime){
      start = toLocalDateObj(date, startTime);
      end = new Date(start.getTime() + 60*1000); // 1 minute
      rawTimeStr = `${startTime}`;
    } else {
      // no times provided -> treat as all-day
      rawTimeStr = '';
    }
    if(start && end && end.getTime() <= start.getTime()){
      end = new Date(start.getTime() + 60*1000);
    }
  }

  if(editingEvent){
    // update
    editingEvent.title = title;
    editingEvent.date = date;
    editingEvent.allDay = allDay;
    editingEvent.start = start;
    editingEvent.end = end;
    editingEvent.type = type;
    editingEvent.location = location;
    editingEvent.note = note;
    editingEvent.rawTimeStr = rawTimeStr;
  } else {
    // create
    const newEv = {
      id: 'ev-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
      title, date, allDay, start, end, type, location, note, rawTimeStr
    };
    events.push(newEv);
  }
  saveEvents();
  hideModal();
  render();
}

function onDeleteEvent(){
  if(!editingEvent) return;
  const idx = events.findIndex(e => e.id === editingEvent.id);
  if(idx !== -1){
    if(confirm('このイベントを削除しますか？')) {
      events.splice(idx,1);
      saveEvents();
      hideModal();
      render();
    }
  }
}

/* ---------- インポート / エクスポート ---------- */
function exportJSON(){
  const out = events.map(e => ({
    id: e.id, date: e.date, allDay: e.allDay,
    start: e.start ? e.start.toISOString() : null,
    end: e.end ? e.end.toISOString() : null,
    title: e.title, type: e.type, location: e.location, note: e.note, rawTimeStr: e.rawTimeStr
  }));
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'events.json'; a.click(); URL.revokeObjectURL(url);
}
function exportICS(){
  // simple ICS builder: convert local times to UTC timestamps
  function toICSDate(dt, allDay){
    if(!dt) return '';
    if(allDay) {
      // date-only YYYYMMDD
      const d = new Date(dt);
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
    }
    const d = new Date(dt);
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  }
  let out = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//PortalCalendar//EN\r\n';
  events.forEach((e,i) => {
    out += 'BEGIN:VEVENT\r\n';
    out += 'UID:' + (e.id || ('ev'+i)) + '\r\n';
    out += 'SUMMARY:' + (e.title || '').replace(/,/g,'\\,') + '\r\n';
    if(e.allDay){
      out += 'DTSTART;VALUE=DATE:' + toICSDate(e.date, true) + '\r\n';
      out += 'DTEND;VALUE=DATE:' + toICSDate(nextDateStr(e.date), true) + '\r\n';
    } else {
      out += 'DTSTART:' + toICSDate(e.start, false) + '\r\n';
      if(e.end) out += 'DTEND:' + toICSDate(e.end, false) + '\r\n';
    }
    if(e.location) out += 'LOCATION:' + (e.location || '').replace(/,/g,'\\,') + '\r\n';
    if(e.note) out += 'DESCRIPTION:' + (e.note || '').replace(/\n/g,'\\n') + '\r\n';
    out += 'END:VEVENT\r\n';
  });
  out += 'END:VCALENDAR\r\n';
  const blob = new Blob([out], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'events.ics'; a.click(); URL.revokeObjectURL(url);
}
function nextDateStr(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  dt.setDate(dt.getDate()+1);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      // basic validation
      if(Array.isArray(parsed)){
        // convert to internal events
        const imported = parsed.map(p => {
          return {
            id: p.id || ('ev-' + Date.now() + '-' + Math.random().toString(36).slice(2,6)),
            date: p.date,
            allDay: !!p.allDay,
            start: p.start ? new Date(p.start) : null,
            end: p.end ? new Date(p.end) : null,
            title: p.title || '無題',
            type: p.type || 'other',
            location: p.location || '--',
            note: p.note || '',
            rawTimeStr: p.rawTimeStr || ''
          };
        });
        // merge (append)
        events = events.concat(imported);
        saveEvents();
        render();
        alert('インポート完了: ' + imported.length + ' 件追加されました。');
      } else {
        alert('不正なJSON形式です。配列を期待します。');
      }
    }catch(err){
      alert('読み込みエラー: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* ---------- 通知（今日の予定） ---------- */
function notifyTodaysEvents(){
  if(!('Notification' in window)) return;
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const todays = events.filter(e => e.date === todayStr);
  if(todays.length === 0) return;
  function show(){
    if(todays.length === 1){
      const ev = todays[0];
      const title = `今日の予定: ${ev.title}`;
      const body = ev.allDay ? '終日' : (ev.rawTimeStr || (formatTimeShort(ev.start) + (ev.end ? ' - ' + formatTimeShort(ev.end) : '')));
      const n = new Notification(title, { body: body, tag: 'today-event', renotify: true });
      n.onclick = () => { window.focus(); openEditModal(ev); };
    } else {
      const title = `今日の予定 ${todays.length}件`;
      const body = todays.slice(0,6).map(t => (t.allDay ? '終日' : (t.rawTimeStr || formatTimeShort(t.start))) + ' ' + t.title).join('\n');
      const n = new Notification(title, { body: body, tag: 'today-events', renotify: true });
      n.onclick = () => { window.focus(); };
    }
  }
  if(Notification.permission === 'granted') show();
  else if(Notification.permission !== 'denied'){
    Notification.requestPermission().then(p => { if(p === 'granted') show(); });
  }
}

/* ---------- イベントハンドラ初期化 ---------- */
document.addEventListener('DOMContentLoaded', () => {
  // load events
  loadEvents();
  render();

  // controls
  $('#prevBtn').addEventListener('click', ()=> { current.setMonth(current.getMonth()-1); render(); });
  $('#nextBtn').addEventListener('click', ()=> { current.setMonth(current.getMonth()+1); render(); });
  $('#todayBtn').addEventListener('click', ()=> { current = new Date(); render(); });
  $('#viewSelect').addEventListener('change', render);
  $('#searchInput').addEventListener('input', render);
  $all('.type-filter').forEach(cb => cb.addEventListener('change', render));
  $('#addEventBtn').addEventListener('click', ()=> openCreateModal(formatDateKey(new Date())));
  $('#themeToggle').addEventListener('click', toggleTheme);
  $('#exportJsonBtn').addEventListener('click', exportJSON);
  $('#exportIcsBtn').addEventListener('click', exportICS);
  $('#fileInput').addEventListener('change', (e)=> {
    const f = e.target.files[0];
    if(!f) return;
    if(f.name.endsWith('.json')) importJSONFile(f);
    else if(f.name.endsWith('.ics')) { alert('ICSインポートは未実装（将来的に対応）'); }
    e.target.value = '';
  });
  $('#importBtn').addEventListener('click', ()=> $('#fileInput').click());

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if(e.key === 'n' || e.key === 'N') { openCreateModal(formatDateKey(new Date())); }
    if(e.key === 't' || e.key === 'T') { current = new Date(); render(); }
    if(e.key === 'ArrowLeft') { current.setMonth(current.getMonth()-1); render(); }
    if(e.key === 'ArrowRight') { current.setMonth(current.getMonth()+1); render(); }
  });

  // show today's notifications
  notifyTodaysEvents();
});

/* ---------- ヘルパー ---------- */
function formatDateKey(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

/* ---------- Drag & Drop のためのアクセシビリティ補助 ---------- */
/* （既に pill に draggable を付け、セルで drop を受ける実装をしている） */

/* ---------- 初回テーマ設定 ---------- */
function toggleTheme(){
  const el = document.documentElement;
  const cur = document.body.getAttribute('data-theme') || 'light';
  const next = cur === 'light' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', next);
}
document.addEventListener('DOMContentLoaded', () => {
  // restore theme from localStorage if present
  const t = localStorage.getItem('portal_calendar_theme');
  if(t) document.body.setAttribute('data-theme', t);
  // save on toggle
  $('#themeToggle').addEventListener('click', ()=> localStorage.setItem('portal_calendar_theme', document.body.getAttribute('data-theme')));
});

/* ---------- 初期ロード（イベントが空なら初期データを入れる） ---------- */
if(!localStorage.getItem(STORAGE_KEY)){
  events = normalizeEventArray(INIT_RAW_EVENTS);
  saveEvents();
}
