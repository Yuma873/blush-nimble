<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ポータルカレンダー（修正版）</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --muted:#6b7280;
    --accent:#1abc9c; --accent-contrast:#ffffff;
    --nav:#2c3e50; --nav-contrast:#ffffff;
    --danger:#e74c3c; --shadow:0 6px 20px rgba(0,0,0,0.08);
    --pill-font:13px;
  }
  [data-theme="dark"]{
    --bg:#071029; --card:#071829; --muted:#9aa4b2; --accent:#06b6d4; --accent-contrast:#042028; --nav:#02101a; --nav-contrast:#cfeff6;
  }
  html,body{ height:100%; margin:0; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, Arial, sans-serif; background:var(--bg); color:#111; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  /* Header: ensure strong contrast and readable controls */
  header{ display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--nav); color:var(--nav-contrast); box-shadow:var(--shadow); position:sticky; top:0; z-index:60; }
  header h1{ margin:0; font-size:18px; font-weight:800; color:var(--nav-contrast); }
  .controls{ margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn{ background:var(--card); color:#111; border:0; padding:8px 10px; border-radius:8px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.06); font-weight:600; }
  .btn.primary{ background:var(--accent); color:var(--accent-contrast); }
  .search{ padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.12); min-width:220px; background:#fff; color:#111; }
  main{ display:flex; gap:16px; padding:18px; box-sizing:border-box; min-height:calc(100vh - 64px); }
  nav{ width:260px; background:linear-gradient(180deg,var(--nav),#1f2d3a); padding:14px; border-radius:12px; box-sizing:border-box; color:var(--nav-contrast); }
  nav a{ display:block; color:var(--nav-contrast); text-decoration:none; margin:8px 0; padding:8px; background:rgba(255,255,255,0.03); border-radius:8px; text-align:center; }
  .sidebar-section{ margin-top:12px; font-size:14px; color:var(--nav-contrast); }
  .legend{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .legend div{ display:flex; align-items:center; gap:6px; color:var(--nav-contrast); }
  .legend span{ width:12px; height:12px; display:inline-block; border-radius:3px; }
  .calendar-wrap{ flex:1; display:flex; flex-direction:column; gap:12px; color:#111; }
  .topbar{ display:flex; align-items:center; gap:12px; }
  .month-title{ font-size:20px; font-weight:800; color:#111; }
  .toolbar-left{ display:flex; gap:8px; align-items:center; }
  .toolbar-right{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .dow{ background:#2c3e50; color:#fff; padding:8px; text-align:center; border-radius:8px; font-weight:800; }
  .cell{ background:var(--card); color:initial; min-height:110px; padding:8px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.04); position:relative; overflow:hidden; display:flex; flex-direction:column; gap:6px; }
  .cell .date{ font-weight:700; color:var(--muted); }
  .cell.sunday{ background: linear-gradient(180deg, rgba(255,240,240,0.6), var(--card)); }
  .cell.saturday{ background: linear-gradient(180deg, rgba(240,248,255,0.6), var(--card)); }
  .today{ outline:3px solid var(--accent); }
  .events-list{ overflow:auto; max-height:calc(100vh - 260px); padding-right:6px; }
  .event-pill{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; color:#fff; font-size:var(--pill-font); margin-bottom:6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .event-pill .badge{ background:rgba(255,255,255,0.18); color:#fff; padding:2px 6px; border-radius:6px; font-size:11px; }
  .type-practice{ background:#2b8cff; }
  .type-tournament{ background:#e74c3c; }
  .type-school{ background:#27ae60; }
  .type-other{ background:#f39c12; color:#222; }
  .modal-backdrop{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); z-index:2000; }
  .modal{ background:var(--card); color:initial; padding:16px; border-radius:10px; width:520px; max-width:96%; box-shadow:0 10px 40px rgba(0,0,0,0.3); }
  .form-row{ display:flex; gap:8px; margin-top:8px; }
  label{ font-size:13px; color:var(--muted); display:block; }
  input[type="text"], input[type="date"], input[type="time"], select, textarea{ padding:8px; border-radius:8px; border:1px solid rgba(0,0,0,0.08); width:100%; box-sizing:border-box; background:#fff; color:#111; }
  textarea{ min-height:80px; resize:vertical; }
  .small{ font-size:13px; color:var(--muted); }
  .footer-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .import-area{ margin-top:8px; }
  .kbd{ background:rgba(0,0,0,0.06); padding:2px 6px; border-radius:6px; font-weight:700; font-size:12px; }
  .status{ font-size:13px; color:#333; }
  @media(max-width:1000px){
    main{ flex-direction:column; padding:12px; }
    nav{ width:100%; display:flex; gap:8px; overflow-x:auto; padding:8px; border-radius:8px; }
    .grid{ gap:6px; }
    .cell{ min-height:90px; }
    .modal{ width:94% }
  }
</style>
</head>
<body data-theme="light">

<header>
  <h1>ポータルカレンダー</h1>
  <div class="controls" role="toolbar" aria-label="カレンダー操作">
    <div class="toolbar-left">
      <button id="prevBtn" class="btn" title="前月（←）">◀</button>
      <button id="todayBtn" class="btn primary" title="今日（T）">今日</button>
      <button id="nextBtn" class="btn" title="次月（→）">▶</button>
    </div>

    <input id="searchInput" class="search" placeholder="イベント検索（名前・場所・時間）" aria-label="イベント検索" />
    <select id="viewSelect" class="btn" title="表示切替">
      <option value="month">月表示</option>
      <option value="list">リスト表示</option>
    </select>
    <button id="addEventBtn" class="btn primary" title="イベント追加（N）">＋ イベント追加</button>
    <button id="themeToggle" class="btn" title="テーマ切替">テーマ</button>
    <button id="exportJsonBtn" class="btn" title="JSONエクスポート">JSON</button>
    <button id="exportIcsBtn" class="btn" title="ICSエクスポート">ICS</button>
    <button id="importBtn" class="btn" title="JSONインポート">インポート</button>
  </div>
</header>

<main>
  <nav aria-label="サイドバー">
    <a href="https://yuma873.github.io/blush-nimble/toppage.html">トップ</a>
    <a href="https://yuma873.github.io/blush-nimble/index.html" style="background:#f44336;">ログアウト</a>

    <div class="sidebar-section">
      <strong>表示フィルタ</strong>
      <div style="margin-top:8px;">
        <label><input type="checkbox" class="type-filter" value="practice" checked> 部活</label><br>
        <label><input type="checkbox" class="type-filter" value="tournament" checked> 大会</label><br>
        <label><input type="checkbox" class="type-filter" value="school" checked> 学校行事</label><br>
        <label><input type="checkbox" class="type-filter" value="other" checked> その他</label>
      </div>
    </div>

    <div class="sidebar-section">
      <strong>凡例</strong>
      <div class="legend">
        <div><span style="background:#e74c3c"></span> 大会</div>
        <div><span style="background:#2b8cff"></span> 部活</div>
        <div><span style="background:#27ae60"></span> 学校行事</div>
        <div><span style="background:#f39c12"></span> その他</div>
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:12px;">
      <strong>インポート / エクスポート</strong>
      <div class="small" style="margin-top:6px;">JSONで保存・読み込み、ICSでエクスポートできます。</div>
      <div class="import-area">
        <input id="fileInput" type="file" accept=".json,.ics" />
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:12px;">
      <div class="status" id="statusBox">状態: 初期化中…</div>
    </div>
  </nav>

  <div class="calendar-wrap" role="main">
    <div class="topbar">
      <div class="month-title" id="monthTitle">--</div>
      <div class="toolbar-right">
        <div class="status" id="statusInfo">イベント 0 件</div>
      </div>
    </div>

    <div id="calendarArea">
      <div id="monthView">
        <div class="grid" id="dowRow" aria-hidden="false">
          <div class="dow">日</div><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>
        </div>
        <div class="grid" id="calendarGrid" aria-live="polite"></div>
      </div>

      <div id="listView" style="display:none;">
        <div id="listContainer"></div>
      </div>
    </div>
  </div>
</main>

<!-- モーダル（固定構造：イベント追加/編集） -->
<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-hidden="true">
  <div class="modal" role="document" aria-labelledby="modalTitle">
    <h2 id="modalTitle">イベント</h2>
    <div id="modalContent">
      <label>タイトル
        <input id="evTitle" type="text" />
      </label>
      <div class="form-row">
        <label style="flex:1">日付
          <input id="evDate" type="date" />
        </label>
        <label style="flex:1">終日
          <select id="evAllDay"><option value="false">いいえ</option><option value="true">はい</option></select>
        </label>
      </div>
      <div class="form-row">
        <label style="flex:1">開始時刻
          <input id="evStartTime" type="time" />
        </label>
        <label style="flex:1">終了時刻
          <input id="evEndTime" type="time" />
        </label>
      </div>
      <label>種別
        <select id="evType">
          <option value="practice">部活</option>
          <option value="tournament">大会</option>
          <option value="school">学校行事</option>
          <option value="other">その他</option>
        </select>
      </label>
      <label>場所
        <input id="evLocation" type="text" />
      </label>
      <label>メモ
        <textarea id="evNote"></textarea>
      </label>
      <div class="footer-actions">
        <button id="deleteEventBtn" class="btn" style="background:var(--danger); color:#fff; display:none;">削除</button>
        <button id="cancelBtn" class="btn">キャンセル</button>
        <button id="saveBtn" class="btn primary">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================
   修正版カレンダー（イベントクリック/通知/コントラスト修正）
   - モーダルは固定DOM。クリックで編集できる。
   - 通知は許可確認→今日の予定通知→10分前リマインダー。
   - 上部テキストの色を明確化。
   ============================ */

/* ユーティリティ */
function $(sel, ctx=document){ return ctx.querySelector(sel); }
function $all(sel, ctx=document){ return Array.from(ctx.querySelectorAll(sel)); }
function pad(n){ return String(n).padStart(2,'0'); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatDateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function toLocalDateObj(dateStr, hhmm){
  const [y,m,d] = dateStr.split('-').map(Number);
  if(!hhmm) return new Date(y,m-1,d);
  const [hh,mm] = hhmm.split(':').map(Number);
  return new Date(y,m-1,d,hh,mm,0,0);
}
function formatDateTime(d){ if(!d) return ''; if(typeof d==='string') return d; const dt=new Date(d); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`; }
function formatTimeShort(d){ if(!d) return ''; if(typeof d==='string') return ''; const dt=new Date(d); return `${pad(dt.getHours())}:${pad(dt.getMinutes())}`; }

/* データ管理 */
const STORAGE_KEY = 'portal_calendar_events_fixed_v1';
let events = []; // {id,date,allDay,start,end,title,type,location,note,rawTimeStr}
function saveEvents(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(events.map(e=>({
  id:e.id,date:e.date,allDay:e.allDay,start:e.start?e.start.toISOString():null,end:e.end?e.end.toISOString():null,
  title:e.title,type:e.type,location:e.location,note:e.note,rawTimeStr:e.rawTimeStr
})))) }
function loadEvents(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      events = parsed.map(p=>({
        id:p.id,date:p.date,allDay:!!p.allDay,
        start:p.start?new Date(p.start):null,end:p.end?new Date(p.end):null,
        title:p.title,type:p.type||'other',location:p.location||'--',note:p.note||'',rawTimeStr:p.rawTimeStr||''
      }));
      $('#statusBox').textContent = '状態: データ読み込み完了';
      return;
    }catch(e){
      console.warn('load parse error', e);
    }
  }
  // 初回: 埋め込みデータ（抜粋）を使う
  events = normalizeEventArray(INIT_RAW_EVENTS);
  saveEvents();
  $('#statusBox').textContent = '状態: 初期データを読み込みました';
}

/* 時刻正規化 */
function parseTimeRange(timeStr){
  if(!timeStr) return { allDay:false };
  const s = String(timeStr).trim();
  if(/^All$/i.test(s) || /^終日$/.test(s)) return { allDay:true };
  const hhmmRegex = /(\d{1,2}:\d{2})/g;
  const matches = [...s.matchAll(hhmmRegex)].map(m=>m[1]);
  if(matches.length===0) return { allDay:false };
  if(matches.length===1) return { start:matches[0], end:matches[0], allDay:false };
  const start=matches[0], end=matches[1];
  if(start==='00:00' && end==='23:59') return { allDay:true };
  return { start,end,allDay:false };
}
function normalizeEventArray(rawArr){
  return rawArr.map((ev,idx)=>{
    const p = parseTimeRange(ev.time);
    const base = {
      id:'ev-'+Date.now()+'-'+idx+'-'+Math.random().toString(36).slice(2,6),
      date:ev.date, title:ev.name||ev.title||'無題', type:ev.type||'other', location:ev.location||'--', note:ev.note||'', rawTimeStr:ev.time||''
    };
    if(p.allDay){ base.allDay=true; base.start=null; base.end=null; }
    else {
      const start = toLocalDateObj(ev.date, p.start||null);
      const end = toLocalDateObj(ev.date, p.end||p.start||null);
      if(end.getTime() <= start.getTime()) end.setMinutes(end.getMinutes()+1);
      base.allDay=false; base.start=start; base.end=end;
    }
    return base;
  });
}

/* 描画（イベントクリックが確実に動くように、要素生成時にリスナーを付与） */
let current = new Date();
function render(){
  const view = $('#viewSelect').value;
  $('#monthTitle').textContent = `${current.getFullYear()}年 ${current.getMonth()+1}月`;
  $('#statusInfo').textContent = `イベント ${events.length} 件`;
  if(view === 'list'){ renderListView(); $('#monthView').style.display='none'; $('#listView').style.display='block'; }
  else { $('#listView').style.display='none'; $('#monthView').style.display='block'; renderMonthView(); }
  saveEvents();
}

function renderMonthView(){
  const grid = $('#calendarGrid'); grid.innerHTML = '';
  const year = current.getFullYear(), month = current.getMonth();
  const first = new Date(year, month, 1), last = new Date(year, month+1, 0);
  const firstDow = first.getDay(), totalDays = last.getDate();
  for(let i=0;i<firstDow;i++){ const blank=document.createElement('div'); blank.className='cell'; blank.style.opacity='0.3'; grid.appendChild(blank); }
  for(let d=1; d<=totalDays; d++){
    const dateStr = `${year}-${pad(month+1)}-${pad(d)}`;
    const cell = document.createElement('div'); cell.className='cell';
    const dow = new Date(year, month, d).getDay();
    if(dow===0) cell.classList.add('sunday'); if(dow===6) cell.classList.add('saturday');
    const today = new Date();
    if(d===today.getDate() && month===today.getMonth() && year===today.getFullYear()) cell.classList.add('today');
    const dateEl = document.createElement('div'); dateEl.className='date'; dateEl.textContent = d; cell.appendChild(dateEl);
    const eventsContainer = document.createElement('div'); eventsContainer.className='events-list';
    const dayEvents = events.filter(ev => ev.date === dateStr);
    const q = $('#searchInput').value.trim().toLowerCase();
    const allowedTypes = $all('.type-filter:checked').map(x=>x.value);
    dayEvents.forEach(ev => {
      if(!allowedTypes.includes(ev.type)) return;
      const text = (ev.title + ' ' + ev.location + ' ' + (ev.rawTimeStr||'')).toLowerCase();
      if(q && text.indexOf(q) === -1) return;
      const pill = document.createElement('div'); pill.className = `event-pill type-${ev.type}`;
      // time or badge
      if(ev.allDay){
        const titleSpan = document.createElement('span'); titleSpan.textContent = ev.title; titleSpan.style.flex='1'; pill.appendChild(titleSpan);
        const badge = document.createElement('span'); badge.className='badge'; badge.textContent='終日'; pill.appendChild(badge);
      } else {
        const timeSpan = document.createElement('span'); timeSpan.className='small'; timeSpan.textContent = formatTimeShort(ev.start); timeSpan.style.marginRight='6px';
        const titleSpan = document.createElement('span'); titleSpan.textContent = ev.title; titleSpan.style.flex='1';
        pill.appendChild(timeSpan); pill.appendChild(titleSpan);
      }
      pill.title = `${ev.title}\n${ev.allDay ? '終日' : (formatDateTime(ev.start) + (ev.end ? ' - ' + formatDateTime(ev.end) : ''))}\n場所: ${ev.location}`;
      // attach click listener here (ensures it works)
      pill.addEventListener('click', (e)=>{ e.stopPropagation(); openEditModal(ev); });
      // drag support
      pill.draggable = true;
      pill.addEventListener('dragstart', (e)=> { e.dataTransfer.setData('text/plain', ev.id); e.dataTransfer.effectAllowed='move'; });
      eventsContainer.appendChild(pill);
    });
    cell.appendChild(eventsContainer);
    // drop handling
    cell.addEventListener('dragover', (e)=> { e.preventDefault(); cell.style.outline='2px dashed rgba(0,0,0,0.12)'; });
    cell.addEventListener('dragleave', ()=> { cell.style.outline='none'; });
    cell.addEventListener('drop', (e)=> {
      e.preventDefault(); cell.style.outline='none';
      const evId = e.dataTransfer.getData('text/plain'); const ev = events.find(x=>x.id===evId);
      if(ev){ ev.date = dateStr;
        if(!ev.allDay && ev.start){ const s = ev.start, et = ev.end; const [y,mn,dd] = dateStr.split('-').map(Number);
          ev.start = new Date(y,mn-1,dd,s.getHours(),s.getMinutes(),0,0);
          if(et) ev.end = new Date(y,mn-1,dd,et.getHours(),et.getMinutes(),0,0);
        }
        saveEvents(); render();
      }
    });
    cell.addEventListener('click', ()=> {
      const dayList = events.filter(ev => ev.date === dateStr);
      if(dayList.length === 0) openCreateModal(dateStr);
      else openDayListModal(dayList, dateStr);
    });
    grid.appendChild(cell);
  }
  const cells = grid.children.length; const rem = (7 - (cells % 7)) % 7;
  for(let i=0;i<rem;i++){ const blank=document.createElement('div'); blank.className='cell'; blank.style.opacity='0.3'; grid.appendChild(blank); }
}

function renderListView(){
  const container = $('#listContainer'); container.innerHTML = '';
  const year = current.getFullYear(), month = current.getMonth()+1;
  const monthStr = `${year}-${pad(month)}`;
  const monthEvents = events.filter(e => e.date.startsWith(monthStr)).sort((a,b)=> {
    const ta = a.allDay ? new Date(a.date) : a.start;
    const tb = b.allDay ? new Date(b.date) : b.start;
    return ta - tb;
  });
  if(monthEvents.length === 0){ container.textContent = '今月の予定はありません'; return; }
  monthEvents.forEach(ev => {
    const el = document.createElement('div'); el.style.padding='10px'; el.style.marginBottom='8px'; el.style.background='var(--card)'; el.style.borderRadius='8px';
    el.innerHTML = `<strong>${escapeHtml(ev.title)}</strong> <span class="small">(${escapeHtml(ev.type)})</span><br>
      <div class="small">${ev.allDay ? '<span class="badge">終日</span>' : (formatDateTime(ev.start) + (ev.end ? ' - ' + formatDateTime(ev.end) : ''))}</div>
      <div class="small">場所: ${escapeHtml(ev.location)}</div>`;
    el.addEventListener('click', ()=> openEditModal(ev));
    container.appendChild(el);
  });
}

/* モーダル（固定DOM） */
const modal = $('#modalBackdrop');
let editingEvent = null;
function openCreateModal(dateStr){
  editingEvent = null;
  $('#modalTitle').textContent = '新規イベント';
  $('#evTitle').value = '';
  $('#evDate').value = dateStr;
  $('#evAllDay').value = 'false';
  $('#evStartTime').value = '';
  $('#evEndTime').value = '';
  $('#evType').value = 'practice';
  $('#evLocation').value = '';
  $('#evNote').value = '';
  $('#deleteEventBtn').style.display = 'none';
  showModal();
}
function openEditModal(ev){
  editingEvent = ev;
  $('#modalTitle').textContent = 'イベント編集';
  $('#evTitle').value = ev.title;
  $('#evDate').value = ev.date;
  $('#evAllDay').value = ev.allDay ? 'true' : 'false';
  $('#evStartTime').value = ev.start ? pad(ev.start.getHours()) + ':' + pad(ev.start.getMinutes()) : '';
  $('#evEndTime').value = ev.end ? pad(ev.end.getHours()) + ':' + pad(ev.end.getMinutes()) : '';
  $('#evType').value = ev.type;
  $('#evLocation').value = ev.location;
  $('#evNote').value = ev.note || '';
  $('#deleteEventBtn').style.display = 'inline-block';
  showModal();
}
function openDayListModal(list, dateStr){
  editingEvent = null;
  $('#modalTitle').textContent = `${dateStr} の予定`;
  const content = document.createElement('div');
  list.forEach(ev => {
    const div = document.createElement('div'); div.style.padding='8px'; div.style.marginBottom='6px'; div.style.background='rgba(0,0,0,0.03)'; div.style.borderRadius='6px';
    div.innerHTML = `<strong>${escapeHtml(ev.title)}</strong><br><small>${ev.allDay ? '<span class="badge">終日</span>' : (formatTimeShort(ev.start) + (ev.end ? ' - ' + formatTimeShort(ev.end) : ''))}</small><br><small>場所: ${escapeHtml(ev.location)}</small>`;
    div.addEventListener('click', ()=> openEditModal(ev));
    content.appendChild(div);
  });
  const modalEl = modal.querySelector('.modal');
  // replace content area safely
  modalEl.replaceChild(content, modalEl.children[1]);
  showModal();
}
function showModal(){ modal.style.display='flex'; modal.setAttribute('aria-hidden','false'); }

        <option value="other">その他</option>
      </select>
    </label>
    <label>場所
      <input id="evLocation" type="text" />
    </label>
    <label>メモ
      <textarea id="evNote"></textarea>
    </label>
    <div class="footer-actions">
      <button id="deleteEventBtn" class="btn" style="background:var(--danger); color:#fff; display:none;">削除</button>
      <button id="cancelBtn" class="btn">キャンセル</button>
      <button id="saveBtn" class="btn primary">保存</button>
    </div>
  `;
  if(modalEl.children[1]) modalEl.replaceChild(template, modalEl.children[1]);
  modal.style.display='none'; modal.setAttribute('aria-hidden','true');
}

/* モーダル操作（固定DOMなのでイベントは常に有効） */
document.addEventListener('click', (e)=> { if(e.target === modal) hideModal(); });
document.addEventListener('keydown', (e)=> { if(e.key === 'Escape') hideModal(); });
document.addEventListener('DOMContentLoaded', ()=> {
  document.body.addEventListener('click', (e)=> {
    if(e.target && e.target.id === 'cancelBtn'){ hideModal(); render(); }
    if(e.target && e.target.id === 'saveBtn'){ onSaveEvent(); }
    if(e.target && e.target.id === 'deleteEventBtn'){ onDeleteEvent(); }
  });
});

/* 保存・削除 */
function onSaveEvent(){
  const title = $('#evTitle').value.trim() || '無題';
  const date = $('#evDate').value;
  const allDay = $('#evAllDay').value === 'true';
  const startTime = $('#evStartTime').value;
  const endTime = $('#evEndTime').value;
  const type = $('#evType').value;
  const location = $('#evLocation').value.trim() || '--';
  const note = $('#evNote').value.trim();
  let start=null,end=null,rawTimeStr='';
  if(allDay){ rawTimeStr='終日'; }
  else {
    if(startTime && endTime){ start=toLocalDateObj(date,startTime); end=toLocalDateObj(date,endTime); rawTimeStr=`${startTime}~${endTime}`; }
    else if(startTime && !endTime){ start=toLocalDateObj(date,startTime); end=new Date(start.getTime()+60*1000); rawTimeStr=`${startTime}`; }
    else { rawTimeStr=''; }
    if(start && end && end.getTime() <= start.getTime()) end = new Date(start.getTime()+60*1000);
  }
  if(editingEvent){
    editingEvent.title = title; editingEvent.date = date; editingEvent.allDay = allDay; editingEvent.start = start; editingEvent.end = end;
    editingEvent.type = type; editingEvent.location = location; editingEvent.note = note; editingEvent.rawTimeStr = rawTimeStr;
  } else {
    const newEv = { id:'ev-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), title, date, allDay, start, end, type, location, note, rawTimeStr };
    events.push(newEv);
  }
  saveEvents(); hideModal(); render();
}
function onDeleteEvent(){
  if(!editingEvent) return;
  if(confirm('このイベントを削除しますか？')){
    events = events.filter(e => e.id !== editingEvent.id);
    saveEvents(); hideModal(); render();
  }
}

/* インポート/エクスポート */
function exportJSON(){
  const out = events.map(e => ({ id:e.id, date:e.date, allDay:e.allDay, start:e.start?e.start.toISOString():null, end:e.end?e.end.toISOString():null, title:e.title, type:e.type, location:e.location, note:e.note, rawTimeStr:e.rawTimeStr }));
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'events.json'; a.click(); URL.revokeObjectURL(url);
}
function exportICS(){
  function toICSDate(dt, allDay){
    if(!dt) return '';
    if(allDay){ const d = new Date(dt); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`; }
    const d = new Date(dt); return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  }
  let out = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//PortalCalendar//EN\r\n';
  events.forEach((e,i)=> {
    out += 'BEGIN:VEVENT\r\n';
    out += 'UID:' + (e.id || ('ev'+i)) + '\r\n';
    out += 'SUMMARY:' + (e.title || '').replace(/,/g,'\\,') + '\r\n';
    if(e.allDay){ out += 'DTSTART;VALUE=DATE:' + toICSDate(e.date,true) + '\r\n'; out += 'DTEND;VALUE=DATE:' + toICSDate(nextDateStr(e.date),true) + '\r\n'; }
    else { out += 'DTSTART:' + toICSDate(e.start,false) + '\r\n'; if(e.end) out += 'DTEND:' + toICSDate(e.end,false) + '\r\n'; }
    if(e.location) out += 'LOCATION:' + (e.location || '').replace(/,/g,'\\,') + '\r\n';
    if(e.note) out += 'DESCRIPTION:' + (e.note || '').replace(/\n/g,'\\n') + '\r\n';
    out += 'END:VEVENT\r\n';
  });
  out += 'END:VCALENDAR\r\n';
  const blob = new Blob([out], {type:'text/calendar;charset=utf-8'}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'events.ics'; a.click(); URL.revokeObjectURL(url);
}
function nextDateStr(dateStr){ const [y,m,d] = dateStr.split('-').map(Number); const dt = new Date(y,m-1,d); dt.setDate(dt.getDate()+1); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(Array.isArray(parsed)){
        const imported = parsed.map(p => ({ id:p.id||('ev-'+Date.now()), date:p.date, allDay:!!p.allDay, start:p.start?new Date(p.start):null, end:p.end?new Date(p.end):null, title:p.title||'無題', type:p.type||'other', location:p.location||'--', note:p.note||'', rawTimeStr:p.rawTimeStr||'' }));
        events = events.concat(imported); saveEvents(); render(); alert('インポート完了: ' + imported.length + ' 件追加されました。');
      } else alert('不正なJSON形式です。配列を期待します。');
    }catch(err){ alert('読み込みエラー: ' + err.message); }
  };
  reader.readAsText(file);
}

/* 通知（今日の予定 + 10分前リマインダー） */
function notifyTodaysEvents(){
  if(!('Notification' in window)){ $('#statusBox').textContent = '状態: 通知非対応のブラウザです'; return; }
  const now = new Date(); const todayStr = formatDateKey(now);
  const todays = events.filter(e => e.date === todayStr);
  if(todays.length === 0){ $('#statusBox').textContent = '状態: 今日の予定はありません'; return; }
  function show(){
    if(todays.length === 1){
      const ev = todays[0]; const title = `今日の予定: ${ev.title}`; const body = ev.allDay ? '終日' : (ev.rawTimeStr || (formatTimeShort(ev.start) + (ev.end ? ' - ' + formatTimeShort(ev.end) : '')));
      const n = new Notification(title, { body: body, tag:'today-event', renotify:true }); n.onclick = ()=>{ window.focus(); openEditModal(ev); };
    } else {
      const title = `今日の予定 ${todays.length}件`; const body = todays.slice(0,6).map(t => (t.allDay ? '終日' : (t.rawTimeStr || formatTimeShort(t.start))) + ' ' + t.title).join('\n');
      const n = new Notification(title, { body: body, tag:'today-events', renotify:true }); n.onclick = ()=>{ window.focus(); };
    }
    $('#statusBox').textContent = '状態: 通知を表示しました';
  }
  if(Notification.permission === 'granted') show();
  else if(Notification.permission !== 'denied') Notification.requestPermission().then(p => { if(p === 'granted') show(); else $('#statusBox').textContent = '状態: 通知が許可されていません'; });
  scheduleNearFutureReminders();
}
let reminderTimers = [];
function scheduleNearFutureReminders(){
  reminderTimers.forEach(t=>clearTimeout(t)); reminderTimers = [];
  const now = new Date();
  events.forEach(ev => {
    if(ev.allDay || !ev.start) return;
    const diff = ev.start.getTime() - now.getTime();
    const remindBefore = 10 * 60 * 1000;
    const when = diff - remindBefore;
    if(when > 0 && when < 24*60*60*1000){
      const t = setTimeout(()=> {
        if(Notification.permission === 'granted'){
          const n = new Notification(`まもなく: ${ev.title}`, { body: `${ev.rawTimeStr || formatTimeShort(ev.start)} 場所: ${ev.location}` });
          n.onclick = ()=> { window.focus(); openEditModal(ev); };
        }
      }, when);
      reminderTimers.push(t);
    }
  });
}

/* 初期化 */
document.addEventListener('DOMContentLoaded', ()=> {
  loadEvents();
  render();
  $('#prevBtn').addEventListener('click', ()=> { current.setMonth(current.getMonth()-1); render(); });
  $('#nextBtn').addEventListener('click', ()=> { current.setMonth(current.getMonth()+1); render(); });
  $('#todayBtn').addEventListener('click', ()=> { current = new Date(); render(); });
  $('#viewSelect').addEventListener('change', render);
  $('#searchInput').addEventListener('input', render);
  $all('.type-filter').forEach(cb => cb.addEventListener('change', render));
  $('#addEventBtn').addEventListener('click', ()=> openCreateModal(formatDateKey(new Date())));
  $('#themeToggle').addEventListener('click', ()=> {
    const cur = document.body.getAttribute('data-theme') || 'light'; const next = cur === 'light' ? 'dark' : 'light';
    document.body.setAttribute('data-theme', next); localStorage.setItem('portal_calendar_theme', next);
  });
  $('#exportJsonBtn').addEventListener('click', exportJSON);
  $('#exportIcsBtn').addEventListener('click', exportICS);
  $('#fileInput').addEventListener('change', (e)=> { const f = e.target.files[0]; if(!f) return; if(f.name.endsWith('.json')) importJSONFile(f); else if(f.name.endsWith('.ics')) alert('ICSインポートは未実装です'); e.target.value=''; });
  $('#importBtn').addEventListener('click', ()=> $('#fileInput').click());
  document.addEventListener('keydown', (e)=> {
    if(e.key === 'n' || e.key === 'N') openCreateModal(formatDateKey(new Date()));
    if(e.key === 't' || e.key === 'T') { current = new Date(); render(); }
    if(e.key === 'ArrowLeft') { current.setMonth(current.getMonth()-1); render(); }
    if(e.key === 'ArrowRight') { current.setMonth(current.getMonth()+1); render(); }
  });
  // restore theme
  const t = localStorage.getItem('portal_calendar_theme'); if(t) document.body.setAttribute('data-theme', t);
  // request notification permission and show today's notifications
  if('Notification' in window){
    if(Notification.permission === 'default') {
      Notification.requestPermission().then(p => { if(p === 'granted') notifyTodaysEvents(); else $('#statusBox').textContent = '状態: 通知が許可されていません'; });
    } else {
      notifyTodaysEvents();
    }
  } else {
    $('#statusBox').textContent = '状態: 通知非対応のブラウザです';
  }
});
