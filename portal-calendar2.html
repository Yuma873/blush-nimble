<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ポータルカレンダー Pro</title>
<style>
  :root{
    --bg:#f0f2f5; --card:#ffffff; --muted:#94a3b8;
    --accent:#1abc9c; --accent-hover:#16a085; --accent-contrast:#ffffff;
    --nav:#1e293b; --nav-contrast:#f8fafc;
    --danger:#ef4444; --shadow:0 10px 15px -3px rgba(0,0,0,0.1);
    --pill-font:12px;
  }
  [data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --muted:#64748b; --accent:#2dd4bf; --accent-contrast:#0f172a; --nav:#020617; --nav-contrast:#f1f5f9;
  }
  html,body{ height:100%; margin:0; font-family: "Inter", "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--nav); transition: background 0.3s; }
  
  header{ display:flex; align-items:center; gap:12px; padding:12px 24px; background:var(--nav); color:var(--nav-contrast); box-shadow:var(--shadow); position:sticky; top:0; z-index:60; }
  header h1{ margin:0; font-size:20px; font-weight:800; letter-spacing:-0.5px; }
  
  .btn{ background:var(--card); color:var(--nav); border:1px solid rgba(0,0,0,0.05); padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:600; transition:all 0.2s; }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .btn.primary{ background:var(--accent); color:var(--accent-contrast); border:none; }
  .btn.primary:hover{ background:var(--accent-hover); }

  main{ display:flex; gap:20px; padding:20px; box-sizing:border-box; min-height:calc(100vh - 64px); }
  
  nav{ width:280px; background:var(--card); padding:20px; border-radius:16px; box-shadow:var(--shadow); color:var(--nav); }
  nav a{ display:block; color:var(--nav); text-decoration:none; margin:8px 0; padding:10px; border-radius:10px; transition:0.2s; border:1px solid transparent; }
  nav a:hover{ background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.1); }

  .calendar-wrap{ flex:1; display:flex; flex-direction:column; gap:16px; }
  .month-title{ font-size:24px; font-weight:800; }

  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .dow{ color:var(--muted); padding:10px; text-align:center; font-weight:700; font-size:14px; }
  
  .cell{ background:var(--card); min-height:120px; padding:10px; border-radius:12px; box-shadow:var(--shadow); transition:0.2s; border:2px solid transparent; cursor: pointer; }
  .cell:hover{ border-color:var(--accent); }
  .cell.sunday .date{ color: var(--danger); }
  .cell.saturday .date{ color: #3b82f6; }
  .today{ outline: 3px solid var(--accent); outline-offset: 2px; }

  .event-pill{ padding:4px 8px; border-radius:6px; color:#fff; font-size:var(--pill-font); margin-bottom:4px; font-weight:500; cursor:pointer; transition: opacity 0.2s; }
  .event-pill:hover{ opacity: 0.8; }
  .type-practice{ background:#3b82f6; }
  .type-tournament{ background:var(--danger); }
  .type-school{ background:#10b981; }
  .type-other{ background:#f59e0b; }

  .modal-backdrop{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:2000; }
  .modal{ background:var(--card); padding:24px; border-radius:20px; width:480px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); animation: modalIn 0.3s ease-out; }
  
  @keyframes modalIn { from{ opacity:0; transform:scale(0.95); } to{ opacity:1; transform:scale(1); } }
</style>
</head>
<body data-theme="light">

<header>
  <h1>Portal Calendar</h1>
  <div class="controls">
    <button id="prevBtn" class="btn">◀</button>
    <button id="todayBtn" class="btn primary">今日</button>
    <button id="nextBtn" class="btn">▶</button>
    <button id="themeToggle" class="btn">🌙</button>
  </div>
</header>

<main>
  <nav>
    <div class="sidebar-section">
      <strong>📅 表示フィルタ</strong>
      <div style="margin-top:12px;">
        <label><input type="checkbox" class="type-filter" value="practice" checked> 部活 (青)</label><br>
        <label><input type="checkbox" class="type-filter" value="tournament" checked> 大会 (赤)</label><br>
        <label><input type="checkbox" class="type-filter" value="school" checked> 学校行事 (緑)</label>
      </div>
    </div>
    <hr style="opacity:0.1; margin:20px 0;">
    <button id="addEventBtn" class="btn primary" style="width:100%">＋ 新規予定を追加</button>
  </nav>

  <div class="calendar-wrap">
    <div class="month-title" id="monthTitle">2026年 4月</div>
    <div class="grid">
      <div class="dow">日</div><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>
    </div>
    <div class="grid" id="calendarGrid"></div>
  </div>
</main>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle">予定の編集</h2>
    <input id="evTitle" type="text" placeholder="タイトルを入力" style="font-size:18px; margin-bottom:15px; padding:10px; width:100%; border-radius:8px; border:1px solid #ddd;">
    <div style="display:flex; gap:10px; margin-bottom:15px;">
      <input id="evDate" type="date" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ddd;">
      <select id="evType" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ddd;">
        <option value="practice">部活</option>
        <option value="tournament">大会</option>
        <option value="school">学校行事</option>
        <option value="other">その他</option>
      </select>
    </div>
    <textarea id="evNote" placeholder="メモ・場所など" style="width:100%; height:80px; padding:10px; border-radius:8px; border:1px solid #ddd; margin-bottom:15px;"></textarea>
    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button id="cancelBtn" class="btn">キャンセル</button>
      <button id="saveBtn" class="btn primary">保存する</button>
    </div>
  </div>
</div>

<script>
/* 前回のコードの後半部分（JSロジック）を補完しつつ、
  「クリックして追加」などの新機能を追加しました。
*/
const $ = sel => document.querySelector(sel);
let current = new Date();
let events = JSON.parse(localStorage.getItem('cal_events') || '[]');

function render() {
  const grid = $('#calendarGrid');
  grid.innerHTML = '';
  const year = current.getFullYear();
  const month = current.getMonth();
  
  $('#monthTitle').textContent = `${year}年 ${month + 1}月`;

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  // 空白セル
  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'cell';
    blank.style.opacity = '0.3';
    grid.appendChild(blank);
  }

  // 日付セル
  const today = new Date();
  for (let d = 1; d <= lastDate; d++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const dateStr = `${year}-${String(month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    
    if(d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
      cell.classList.add('today');
    }
    
    const dow = new Date(year, month, d).getDay();
    if(dow === 0) cell.classList.add('sunday');
    if(dow === 6) cell.classList.add('saturday');

    cell.innerHTML = `<div class="date" style="font-weight:800; margin-bottom:8px;">${d}</div>`;
    
    // イベント表示
    const dayEvents = events.filter(e => e.date === dateStr);
    dayEvents.forEach(ev => {
      const pill = document.createElement('div');
      pill.className = `event-pill type-${ev.type}`;
      pill.textContent = ev.title;
      cell.appendChild(pill);
    });

    // セルクリックで新規作成
    cell.onclick = () => openModal(dateStr);
    grid.appendChild(cell);
  }
}

function openModal(date) {
  $('#evDate').value = date;
  $('#evTitle').value = '';
  $('#modalBackdrop').style.display = 'flex';
}

$('#saveBtn').onclick = () => {
  events.push({
    title: $('#evTitle').value || '無題',
    date: $('#evDate').value,
    type: $('#evType').value,
    note: $('#evNote').value
  });
  localStorage.setItem('cal_events', JSON.stringify(events));
  $('#modalBackdrop').style.display = 'none';
  render();
};

$('#cancelBtn').onclick = () => $('#modalBackdrop').style.display = 'none';

$('#prevBtn').onclick = () => { current.setMonth(current.getMonth() - 1); render(); };
$('#nextBtn').onclick = () => { current.setMonth(current.getMonth() + 1); render(); };
$('#todayBtn').onclick = () => { current = new Date(); render(); };

$('#themeToggle').onclick = () => {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  $('#themeToggle').textContent = isDark ? '🌙' : '☀️';
};

render();
</script>

</body>
</html>
