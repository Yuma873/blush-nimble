<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報パネル - 水泳部</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #f0f8ff;
    color: #000;
    overflow: hidden;
  }
  .panel {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
    transition: opacity 1s;
    position: absolute;
    top: 0;
    left: 0;
  }
  h1 { font-size: 48px; margin: 10px 0; }
  h2 { font-size: 36px; margin: 5px 0; }
  .section { margin: 15px 0; }
  .item { font-size: 28px; margin: 5px 0; }
</style>
</head>
<body>

<!-- パネル1: 部活予定 -->
<div class="panel" style="background-color:#a0e7e5;">
  <h1>🏊 部活予定</h1>
  <div id="practice" class="section"></div>
</div>

<!-- パネル2: 大会情報 -->
<div class="panel" style="background-color:#ffb6b9; opacity:0;">
  <h1>🏆 大会情報</h1>
  <div id="tournament" class="section"></div>
</div>

<!-- パネル3: 連絡 -->
<div class="panel" style="background-color:#ffd6a5; opacity:0;">
  <h1>📢 連絡</h1>
  <div id="notice" class="section"></div>
</div>

<!-- パネル4: 天気 -->
<div class="panel" style="background-color:#caffbf; opacity:0;">
  <h1>🌤 天気</h1>
  <div id="weather" class="section">読み込み中…</div>
</div>

<script>
// データ例（サイネージ用に自動更新想定）
const practiceData = [
  "1年生: 16:00〜18:00 メインプール",
  "2年生: 17:00〜19:00 サブプール",
  "3年生: 18:00〜20:00 メインプール"
];
const tournamentData = [
  "9/23 横浜市大会 - メインプール",
  "10/5 神奈川県大会 - 国際プール",
  "10/20 学内記録会 - サブプール"
];
const noticeData = [
  "明日: プール清掃 16:00集合",
  "忘れ物: ゴーグル・キャップ確認",
  "提出物: 健康チェックシート"
];

// 各パネルに表示
function populateSection(id, data) {
  const container = document.getElementById(id);
  container.innerHTML = data.map(item => `<div class="item">${item}</div>`).join('');
}
populateSection('practice', practiceData);
populateSection('tournament', tournamentData);
populateSection('notice', noticeData);

// 天気取得（OpenWeatherMap API）
const apiKey = "1c9ab4ae3ab780ce08bee6c67d6f4571"; // ユーザー提供
const city = "Yokohama,jp";
fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=ja`)
  .then(res => res.json())
  .then(data => {
    const weatherDiv = document.getElementById('weather');
    const icon = `http://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
    weatherDiv.innerHTML = `
      <div class="item"><img src="${icon}" style="vertical-align:middle;"> ${data.weather[0].description}</div>
      <div class="item">気温: ${data.main.temp}℃</div>
      <div class="item">湿度: ${data.main.humidity}%</div>
    `;
  })
  .catch(() => {
    document.getElementById('weather').innerHTML = "天気情報取得失敗";
  });

// パネル自動切替
const panels = document.querySelectorAll('.panel');
let current = 0;
function showNextPanel() {
  panels[current].style.opacity = 0;
  current = (current + 1) % panels.length;
  panels[current].style.opacity = 1;
}
setInterval(showNextPanel, 10000);
</script>

</body>
</html>
