<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポータルサイト - PDFプレビュー(chrome等)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      background-color: #f5f5f5;
      height: 100vh;
      overflow: hidden;
    }
    nav {
      width: 220px;
      background-color: #2c3e50;
      color: white;
      padding: 10px;
      box-sizing: border-box;
    }
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px;
      margin: 8px 0;
      background-color: #34495e;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    nav a:hover {
      background-color: #1abc9c;
    }
    nav img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    main {
      flex: 1;
      padding: 20px 30px 70px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .pdf-viewer-section {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      flex-grow: 1;
    }
    .pdf-viewer-section header {
      font-size: 1.5em;
      margin-bottom: 20px;
      color: #34495e;
      border-bottom: 2px solid #1abc9c;
      padding-bottom: 8px;
    }

    /* カード一覧 */
    .pdf-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }
    .pdf-card {
      display: block;
      padding: 15px;
      background-color: #ecf0f1;
      color: #2c3e50;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      font-weight: bold;
      transition: all 0.2s;
      text-align: center;
    }
    .pdf-card:hover {
      background-color: #1abc9c;
      color: white;
      transform: translateY(-3px);
    }

    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      background-color: #2c3e50;
      color: white;
      padding: 8px 0;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 9999;
    }
    .ticker {
      display: inline-block;
      white-space: nowrap;
      animation: tickerScroll 25s linear infinite;
      padding-left: 100%;
    }
    @keyframes tickerScroll {
      from { transform: translateX(0%); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
