<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本格システム監視画面</title>
<style>
  body {
    margin: 0;
    font-family: "Courier New", monospace;
    background-color: #0a0f1e;
    color: #00ff99;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background-color: #081026;
    padding: 10px 20px;
    font-size: 18px;
    border-bottom: 2px solid #00ff99;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .main {
    flex: 1;
    display: flex;
    padding: 10px;
    gap: 10px;
    overflow: hidden;
  }

  .panel {
    flex: 1;
    background-color: #081026;
    border: 1px solid #00ff99;
    border-radius: 6px;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }

  .panel h3 {
    margin: 0 0 10px 0;
    color: #00ff99;
  }

  .log {
    flex: 1;
    background-color: #00121b;
    border-radius: 6px;
    padding: 5px;
    overflow-y: auto;
    font-size: 12px;
  }

  .log p.warning {
    color: #ff5555;
    font-weight: bold;
    animation: blink 1s step-start infinite;
  }

  .log p.critical {
    color: #ff0000;
    font-weight: bold;
    animation: blink 0.5s step-start infinite;
  }

  .log p.info {
    color: #00ff99;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  canvas {
    background-color: #00121b;
    border-radius: 6px;
  }
</style>
</head>
<body>
<header>
  🚀 System Monitoring Dashboard
  <span id="time-display"></span>
</header>

<div class="main">
  <div class="panel">
    <h3>CPU / Memory</h3>
    <canvas id="cpuChart" height="120"></canvas>
    <canvas id="memChart" height="120"></canvas>
  </div>

  <div class="panel">
    <h3>Network</h3>
    <div class="log" id="log">
      <p class="info">2025-08-17 14:00:00: System initialized...</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const cpuCtx = document.getElementById('cpuChart').getContext('2d');
const memCtx = document.getElementById('memChart').getContext('2d');

const createChart = (ctx, label, color) => new Chart(ctx, {
  type: 'line',
  data: {
    labels: Array(20).fill(''),
    datasets: [{
      label: label,
      data: Array(20).fill(0),
      borderColor: color,
      backgroundColor: 'rgba(0,255,153,0.2)',
      tension: 0.3,
      fill: true,
    }]
  },
  options: {
    animation: false,
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      y: { min: 0, max: 100 },
      x: { display: false }
    }
  }
});

const cpuChart = createChart(cpuCtx, 'CPU %', '#00ff99');
const memChart = createChart(memCtx, 'Memory %', '#00ccff');

function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

const logEl = document.getElementById('log');
function addLog(msg, type='info') {
  const p = document.createElement('p');
  p.className = type;
  p.innerHTML = msg;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateCharts() {
  const cpuVal = getRandomInt(5, 90);
  const memVal = getRandomInt(20, 85);

  cpuChart.data.datasets[0].data.push(cpuVal);
  cpuChart.data.datasets[0].data.shift();
  cpuChart.update();

  memChart.data.datasets[0].data.push(memVal);
  memChart.data.datasets[0].data.shift();
  memChart.update();

  // ログ生成
  const now = new Date();
  const time = now.toISOString().split('T')[1].split('.')[0];
  const r = Math.random();
  if (r < 0.05) addLog(`${time}: CRITICAL - Server overload!`, 'critical');
  else if (r < 0.15) addLog(`${time}: WARNING - CPU spike detected!`, 'warning');
  else addLog(`${time}: Info - System running normally.`, 'info');

  document.getElementById('time-display').textContent = time;
}

setInterval(updateCharts, 1000);
</script>
</body>
</html>
