<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通系ICカード管理</title>
<style>
body { font-family: Arial, sans-serif; background: #eef2f7; margin:0; padding:20px; }
.container { max-width:950px; margin:auto; background:#fff; padding:30px; border-radius:10px; box-shadow:0 6px 15px rgba(0,0,0,0.1); }
h1,h2,h3{ color:#2c3e50; }
input, button, select, textarea { width:100%; padding:10px; margin:6px 0; font-size:16px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box; }
textarea { resize: vertical; }
button { background:#4caf50; color:#fff; border:none; cursor:pointer; transition:0.2s; }
button:hover { background:#45a049; }
button.delete { background:#e74c3c; }
button.delete:hover { background:#c0392b; }
button.edit { background:#3498db; }
button.edit:hover { background:#2980b9; }
.small-btn { width:auto; padding:5px 12px; margin-right:5px; }
li { background:#f7f9fc; margin:6px 0; padding:12px; border-radius:6px; }
hr { margin:25px 0; border:0; border-top:1px solid #ccc; }
.mode-btn { width:auto; padding:8px 16px; margin-right:10px; border-radius:6px; border:none; cursor:pointer; }
.mode-btn.active { background:#4caf50; color:#fff; }
.mode-btn.inactive { background:#bdc3c7; color:#fff; }
.flex { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.flex> * { flex:1; }
</style>
</head>
<body>
<div class="container">
<h1>交通系ICカード管理</h1>

<h2>残高管理</h2>
<div class="flex">
  <input type="number" id="balanceInput" placeholder="残高">
  <button id="saveBalance">保存</button>
</div>
<div class="flex">
  <input type="number" id="chargeAmount" placeholder="チャージ額">
  <button id="chargeBalance">チャージ</button>
  <button id="resetBalance" class="delete">リセット</button>
</div>
<h3>現在の残高：¥<span id="balanceDisplay">0</span></h3>

<hr>

<h2>モード選択</h2>
<div class="flex">
  <button class="mode-btn active" id="trainModeBtn">電車モード</button>
  <button class="mode-btn inactive" id="shoppingModeBtn">買い物モード</button>
</div>

<hr>

<div id="trainSection">
<h2>使用履歴入力（電車）</h2>
<input type="date" id="date">
<input type="text" id="departure" placeholder="出発駅">
<input type="text" id="arrival" placeholder="到着駅">
<input type="text" id="route" placeholder="路線名（自動／手動可）">
<input type="text" id="company" placeholder="会社名（自動／手動可）">
<input type="number" id="fare" placeholder="運賃（自動／手動可）">
<textarea id="trainNote" placeholder="備考"></textarea>
<button id="saveHistory">保存</button>
</div>

<div id="shoppingSection" style="display:none;">
<h2>使用履歴入力（買い物）</h2>
<input type="date" id="shoppingDate">
<input type="text" id="shoppingItem" placeholder="購入品">
<input type="number" id="shoppingAmount" placeholder="金額">
<textarea id="shoppingNote" placeholder="備考"></textarea>
<button id="saveShopping">保存</button>
</div>

<hr>

<h2>使用履歴</h2>
<ul id="historyList"></ul>

<hr>

<h2>CSV操作</h2>
<button id="exportCSV">CSVエクスポート</button>
<input type="file" id="importCSV" accept=".csv">
</div>

<script>
/* ===== 区間データ ===== */
const routeData = {
  "茅ケ崎⇔横浜": { fare: 506, route: "東海道線", company: "JR東日本" },
  "茅ケ崎⇔上溝": { fare: 506, route: "東海道線-相模線", company: "JR東日本" },
  "茅ケ崎⇔関内": { fare: 594, route: "東海道線-根岸線", company: "JR東日本" },
  "茅ケ崎⇔厚木": { fare: 242, route: "相模線", company: "JR東日本" },
    "茅ケ崎⇔北山田": { fare: 990, route: "東海道線-東急東横線-横浜市営地下鉄グリーンライン", company: "JR東日本-東急-横浜市交通局" },
  "茅ケ崎⇔藤野": { fare: 1170, route: "相模線-横浜線-中央本線", company: "JR東日本" },
    "茅ケ崎⇔伊勢原": { fare: 440, route: "相模線-小田急小田原線", company: "JR東日本-小田急電鉄" },
  "厚木⇔伊勢原": { fare: 199, route: "小田急小田原線", company: "小田急電鉄" },
  "茅ケ崎⇔日本大通り": { fare: 730, route: "東海道線-みなとみらい線", company: "JR東日本-横浜高速鉄道" },
  "横浜⇔北山田": { fare: 335, route: "横浜市営地下鉄ブルーライン-グリーンライン", company: "横浜市交通局" },
  "横浜⇔日吉": { fare: 227, route: "東海道線-東急東横線", company: "JR東日本-東急" },
  "日吉⇔北山田": { fare: 242, route: "横浜市営地下鉄グリーンライン", company: "横浜市交通局" },
  "茅ケ崎⇔共済病院前総合公園西": { fare: 210, route: "平88,89,90,91,92,93,94,96,99", company: "神奈川中央交通" }
};

let editIndex = null;
let mode = "train";

/* ===== 保存・読込 ===== */
function saveData(balance, history) {
  localStorage.setItem("balance", balance);
  localStorage.setItem("history", JSON.stringify(history));
}

function loadData() {
  const balance = parseInt(localStorage.getItem("balance")||0);
  const history = JSON.parse(localStorage.getItem("history")||"[]");
  document.getElementById("balanceDisplay").textContent = balance;

  const historyList = document.getElementById("historyList");
  historyList.innerHTML = "";
  history.forEach((h,i)=>{
    const li=document.createElement("li");
    if(h.type==="train"){
      li.innerHTML=`${h.date}｜${h.departure}⇔${h.arrival}｜¥${h.fare}<br>${h.route}｜${h.company}<br>備考: ${h.note||""}<br>
        <button class="small-btn edit" onclick="editHistory(${i})">編集</button>
        <button class="small-btn delete" onclick="deleteHistory(${i})">削除</button>`;
    } else {
      li.innerHTML=`${h.date}｜${h.item}｜¥${h.amount}<br>備考: ${h.note||""}<br>
        <button class="small-btn edit" onclick="editShopping(${i})">編集</button>
        <button class="small-btn delete" onclick="deleteHistory(${i})">削除</button>`;
    }
    historyList.appendChild(li);
  });
}

/* ===== モード切替 ===== */
const trainSection=document.getElementById("trainSection");
const shoppingSection=document.getElementById("shoppingSection");
document.getElementById("trainModeBtn").onclick=()=>{
  mode="train";
  trainSection.style.display="block";
  shoppingSection.style.display="none";
  document.getElementById("trainModeBtn").classList.add("active");
  document.getElementById("trainModeBtn").classList.remove("inactive");
  document.getElementById("shoppingModeBtn").classList.remove("active");
  document.getElementById("shoppingModeBtn").classList.add("inactive");
};
document.getElementById("shoppingModeBtn").onclick=()=>{
  mode="shopping";
  trainSection.style.display="none";
  shoppingSection.style.display="block";
  document.getElementById("shoppingModeBtn").classList.add("active");
  document.getElementById("shoppingModeBtn").classList.remove("inactive");
  document.getElementById("trainModeBtn").classList.remove("active");
  document.getElementById("trainModeBtn").classList.add("inactive");
};

window.onload=loadData;

/* ===== 自動入力（逆対応） ===== */
function autoFill() {
  const key1=`${departure.value}⇔${arrival.value}`;
  const key2=`${arrival.value}⇔${departure.value}`;
  let data=routeData[key1]||routeData[key2];
  if(data){
    fare.value=data.fare;
    route.value=data.route;
    company.value=data.company;
  }
}
departure.oninput=autoFill;
arrival.oninput=autoFill;

/* ===== 電車履歴保存 ===== */
document.getElementById("saveHistory").onclick=()=>{
  if(!date.value||!fare.value) return alert("入力不足");
  let balance=parseInt(localStorage.getItem("balance")||0);
  const history=JSON.parse(localStorage.getItem("history")||"[]");
  const cost=parseInt(fare.value);
  if(editIndex===null){
    if(balance<cost) return alert("残高不足");
    balance-=cost;
    history.push({type:"train",date:date.value,departure:departure.value,arrival:arrival.value,route:route.value,company:company.value,fare:cost,note:trainNote.value});
  } else {
    history[editIndex]={type:"train",date:date.value,departure:departure.value,arrival:arrival.value,route:route.value,company:company.value,fare:cost,note:trainNote.value};
    editIndex=null;
  }
  saveData(balance,history);
  loadData();
};

/* ===== 買い物履歴保存 ===== */
document.getElementById("saveShopping").onclick=()=>{
  if(!shoppingDate.value||!shoppingAmount.value) return alert("入力不足");
  let balance=parseInt(localStorage.getItem("balance")||0);
  const history=JSON.parse(localStorage.getItem("history")||"[]");
  const cost=parseInt(shoppingAmount.value);
  if(editIndex===null){
    if(balance<cost) return alert("残高不足");
    balance-=cost;
    history.push({type:"shopping",date:shoppingDate.value,item:shoppingItem.value,amount:cost,note:shoppingNote.value});
  } else {
    history[editIndex]={type:"shopping",date:shoppingDate.value,item:shoppingItem.value,amount:cost,note:shoppingNote.value};
    editIndex=null;
  }
  saveData(balance,history);
  loadData();
};

/* ===== 編集 ===== */
function editHistory(i){
  const h=JSON.parse(localStorage.getItem("history"))[i];
  if(h.type==="train"){
    date.value=h.date; departure.value=h.departure; arrival.value=h.arrival;
    route.value=h.route; company.value=h.company; trainNote.value=h.note||"";
    mode="train"; trainSection.style.display="block"; shoppingSection.style.display="none";
  }
  editIndex=i;
}
function editShopping(i){
  const h=JSON.parse(localStorage.getItem("history"))[i];
  if(h.type==="shopping"){
    shoppingDate.value=h.date; shoppingItem.value=h.item; shoppingAmount.value=h.amount; shoppingNote.value=h.note||"";
    mode="shopping"; trainSection.style.display="none"; shoppingSection.style.display="block";
  }
  editIndex=i;
}

/* ===== 削除 ===== */
function deleteHistory(i){
  const history=JSON.parse(localStorage.getItem("history")||"[]");
  history.splice(i,1);
  saveData(localStorage.getItem("balance")||0,history);
  loadData();
}

/* ===== 残高操作 ===== */
saveBalance.onclick=()=>{ saveData(balanceInput.value,JSON.parse(localStorage.getItem("history")||"[]")); loadData(); };
chargeBalance.onclick=()=>{ let b=parseInt(localStorage.getItem("balance")||0); b+=parseInt(chargeAmount.value||0); saveData(b,JSON.parse(localStorage.getItem("history")||"[]")); loadData(); };
resetBalance.onclick=()=>{ saveData(0,JSON.parse(localStorage.getItem("history")||"[]")); loadData(); };

/* ===== CSV ===== */
exportCSV.onclick=()=>{
  const balance=localStorage.getItem("balance")||0;
  const history=JSON.parse(localStorage.getItem("history")||"[]");
  let csv=`#BALANCE,${balance}\n日付,種別,出発駅,到着駅,路線,会社,購入品,金額,運賃,備考\n`;
  history.forEach(h=>{
    if(h.type==="train"){
      csv+=`${h.date},train,${h.departure},${h.arrival},${h.route},${h.company},,,${h.fare},${h.note||""}\n`;
    } else {
      csv+=`${h.date},shopping,,,,,${h.item},${h.amount},,${h.note||""}\n`;
    }
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ic_card_data.csv"; a.click();
};
importCSV.onchange=e=>{
  const reader=new FileReader();
  reader.onload=()=>{
    const lines=reader.result.trim().split("\n");
    let balance=parseInt(lines[0].split(",")[1])||0;
    const history=[];
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(",");
      if(cols[1]==="train"){
        const f=parseInt(cols[8]||0);
        history.push({type:"train",date:cols[0],departure:cols[2],arrival:cols[3],route:cols[4],company:cols[5],fare:f,note:cols[9]||""});
        balance-=f;
      } else if(cols[1]==="shopping"){
        const amt=parseInt(cols[7]||0);
        history.push({type:"shopping",date:cols[0],item:cols[6],amount:amt,note:cols[9]||""});
        balance-=amt;
      }
    }
    saveData(balance,history);
    loadData();
  };
  reader.readAsText(e.target.files[0],"UTF-8");
};
</script>
</body>
</html>
