<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交通系ICカード管理</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f4f4f9;
      }

      .container {
        width: 60%;
        margin: 0 auto;
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      h1,
      h2,
      h3 {
        color: #333;
      }

      input[type="number"],
      input[type="text"],
      input[type="date"] {
        padding: 8px;
        margin: 6px 0;
        width: calc(100% - 20px);
        font-size: 16px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }

      button {
        padding: 10px 15px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin: 5px 3px;
      }

      button:hover {
        background-color: #45a049;
      }

      button.delete {
        background-color: #e74c3c;
      }

      button.delete:hover {
        background-color: #c0392b;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }

      li {
        padding: 10px;
        margin: 5px 0;
        background-color: #f0f0f0;
        border-radius: 4px;
      }

      hr {
        margin: 20px 0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>交通系ICカード管理</h1>

      <!-- 残高 -->
      <h2>現在の残高</h2>
      <input type="number" id="balance" placeholder="残高を入力" min="0" />
      <button id="saveBalance">残高保存</button>
      <br />
      <input type="number" id="chargeAmount" placeholder="チャージ額" min="0" />
      <button id="chargeBalance">チャージ</button>
      <button id="resetBalance" class="delete">残高リセット</button>

      <h3>現在の残高：¥<span id="balanceDisplay">0</span></h3>

      <hr />

      <!-- 履歴入力 -->
      <h2>使用履歴の追加</h2>
      <input type="date" id="transactionDate" />
      <input type="text" id="departureStation" placeholder="出発駅" />
      <input type="text" id="arrivalStation" placeholder="到着駅" />
      <input type="text" id="routeName" placeholder="路線名" />
      <input type="text" id="railCompany" placeholder="会社" />
      <input type="number" id="fare" placeholder="運賃（自動）" readonly />
      <button id="saveTransaction">履歴追加</button>

      <hr />

      <!-- 履歴表示 -->
      <h2>使用履歴</h2>
      <ul id="historyList"></ul>
      <button id="clearHistory" class="delete">履歴を全て削除</button>

      <hr />

      <!-- CSV -->
      <h2>CSV操作</h2>
      <button id="exportCSV">CSVエクスポート</button>
      <input type="file" id="importCSV" accept=".csv" />
    </div>

    <script>
      /* 運賃データ */
      const fareData = {
        "茅ケ崎⇔横浜": 506,
        "茅ケ崎⇔上溝": 506,
        "茅ケ崎⇔関内": 594,
        "茅ケ崎⇔厚木": 242,
        "茅ケ崎⇔橋本": 594,
        "橋本⇔八王子": 178,
        "八王子⇔藤野": 330,
        "厚木⇔伊勢原": 199,
        "茅ケ崎⇔日本大通り": 730,
        "横浜⇔北山田": 335,
        "横浜⇔日吉": 227,
        "日吉⇔北山田": 242,
        "茅ケ崎⇔共済病院前総合公園西": 210,
      };

      window.onload = loadData;

      function saveData(balance, history) {
        localStorage.setItem("balance", balance);
        localStorage.setItem("history", JSON.stringify(history));
      }

      function loadData() {
        const balance = localStorage.getItem("balance") || 0;
        const history = JSON.parse(localStorage.getItem("history")) || [];

        document.getElementById("balanceDisplay").textContent = balance;

        const list = document.getElementById("historyList");
        list.innerHTML = "";
        history.forEach((item) => {
          const li = document.createElement("li");
          li.textContent = `${item.date}｜${item.departureStation} ⇔ ${item.arrivalStation}｜¥${item.fare}（${item.routeName}・${item.railCompany}）`;
          list.appendChild(li);
        });
      }

      /* 残高操作 */
      document.getElementById("saveBalance").onclick = () => {
        const b = document.getElementById("balance").value;
        if (b >= 0) saveData(b, JSON.parse(localStorage.getItem("history")) || []);
        loadData();
      };

      document.getElementById("chargeBalance").onclick = () => {
        const c = parseInt(document.getElementById("chargeAmount").value);
        if (c > 0) {
          const b = parseInt(localStorage.getItem("balance") || 0) + c;
          saveData(b, JSON.parse(localStorage.getItem("history")) || []);
          document.getElementById("chargeAmount").value = "";
          loadData();
        }
      };

      document.getElementById("resetBalance").onclick = () => {
        saveData(0, JSON.parse(localStorage.getItem("history")) || []);
        loadData();
      };

      /* 運賃自動 */
      function updateFare() {
        const d = departureStation.value;
        const a = arrivalStation.value;
        fare.value = fareData[`${d}⇔${a}`] || "";
      }

      departureStation.oninput = updateFare;
      arrivalStation.oninput = updateFare;

      /* 履歴追加 */
      document.getElementById("saveTransaction").onclick = () => {
        const date = transactionDate.value;
        const fareValue = parseInt(fare.value);
        if (!date || !fareValue) return alert("入力不足");

        let balance = parseInt(localStorage.getItem("balance") || 0);
        if (balance < fareValue) return alert("残高不足");

        balance -= fareValue;

        const history = JSON.parse(localStorage.getItem("history")) || [];
        history.push({
          date,
          departureStation: departureStation.value,
          arrivalStation: arrivalStation.value,
          routeName: routeName.value,
          railCompany: railCompany.value,
          fare: fareValue,
        });

        saveData(balance, history);
        loadData();
      };

      document.getElementById("clearHistory").onclick = () => {
        saveData(localStorage.getItem("balance") || 0, []);
        loadData();
      };

      /* CSVエクスポート（残高＋履歴） */
      document.getElementById("exportCSV").onclick = () => {
        const balance = localStorage.getItem("balance") || 0;
        const history = JSON.parse(localStorage.getItem("history")) || [];

        let csv = `#BALANCE,${balance}\n`;
        csv += "日付,出発駅,到着駅,路線名,会社,運賃\n";

        history.forEach((h) => {
          csv += `${h.date},${h.departureStation},${h.arrivalStation},${h.routeName},${h.railCompany},${h.fare}\n`;
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "ic_card_data.csv";
        a.click();
      };

      /* CSVインポート */
      document.getElementById("importCSV").onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          const lines = reader.result.trim().split("\n");
          let balance = 0;
          let start = 2;

          if (lines[0].startsWith("#BALANCE")) {
            balance = parseInt(lines[0].split(",")[1]) || 0;
          }

          const history = [];
          for (let i = start; i < lines.length; i++) {
            const [date, d, a, r, c, f] = lines[i].split(",");
            history.push({
              date,
              departureStation: d,
              arrivalStation: a,
              routeName: r,
              railCompany: c,
              fare: parseInt(f),
            });
          }

          saveData(balance, history);
          loadData();
          alert("CSVをインポートしました");
        };
        reader.readAsText(file, "UTF-8");
      };
    </script>
  </body>
</html>
