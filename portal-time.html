<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Swim Records</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#eef2f6;
margin:0;
}

header{
background:#1e73be;
color:white;
padding:15px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
}

input,select{
padding:6px;
margin-right:6px;
}

button{
padding:6px 10px;
border:none;
background:#1e73be;
color:white;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h2>Swim Record Manager</h2>
</header>

<div class="container">

<div class="card">

<h3>記録入力</h3>

<input id="date" type="date">
<input id="meet" placeholder="大会名">
<input id="venue" placeholder="会場">

<select id="course">
<option>短水路</option>
<option>長水路</option>
</select>

<input id="event" placeholder="種目 (例: 自由形100m)">
<input id="time" placeholder="タイム (例: 1:15.12)">

<button onclick="addRecord()">追加</button>

</div>


<div class="card">

<h3>CSV</h3>

<input type="file" id="csvUpload">

<button onclick="downloadCSV()">CSVダウンロード</button>

</div>


<div class="card">

<h3>記録一覧</h3>

<table id="recordsTable">

<tr>
<th>日付</th>
<th>大会</th>
<th>会場</th>
<th>水路</th>
<th>種目</th>
<th>タイム</th>
<th>操作</th>
</tr>

</table>

</div>


<div class="card">

<h3>ベストタイム</h3>

<table id="bestTable"></table>

</div>


<div class="card">

<h3>タイム推移</h3>

<select id="graphEvent"></select>

<canvas id="chart"></canvas>

</div>

</div>


<script>

let records=[]
let chart
let editIndex=null


function save(){

localStorage.setItem("swimRecords",JSON.stringify(records))

}

function load(){

let data=localStorage.getItem("swimRecords")

if(data){

records=JSON.parse(data)

}

render()

}

function addRecord(){

let r={
date:date.value,
meet:meet.value,
venue:venue.value,
course:course.value,
event:event.value,
time:time.value
}

if(editIndex!==null){

records[editIndex]=r
editIndex=null

}else{

records.push(r)

}

save()
clearForm()
render()

}

function clearForm(){

date.value=""
meet.value=""
venue.value=""
event.value=""
time.value=""

}

function editRecord(i){

let r=records[i]

date.value=r.date
meet.value=r.meet
venue.value=r.venue
course.value=r.course
event.value=r.event
time.value=r.time

editIndex=i

}

function deleteRecord(i){

records.splice(i,1)

save()
render()

}


function render(){

renderTable()
renderBest()
renderGraph()

}

function renderTable(){

let t=document.getElementById("recordsTable")

t.innerHTML=`
<tr>
<th>日付</th>
<th>大会</th>
<th>会場</th>
<th>水路</th>
<th>種目</th>
<th>タイム</th>
<th>操作</th>
</tr>
`

records.forEach((r,i)=>{

t.innerHTML+=`
<tr>
<td>${r.date}</td>
<td>${r.meet}</td>
<td>${r.venue}</td>
<td>${r.course}</td>
<td>${r.event}</td>
<td>${r.time}</td>
<td>
<button onclick="editRecord(${i})">編集</button>
<button onclick="deleteRecord(${i})">削除</button>
</td>
</tr>
`

})

}

function timeToSec(t){

if(t.includes(":")){

let p=t.split(":")

return parseFloat(p[0])*60+parseFloat(p[1])

}

return parseFloat(t)

}

function renderBest(){

let best={}

records.forEach(r=>{

let key=r.event+"_"+r.course

let sec=timeToSec(r.time)

if(!best[key]||sec<best[key].sec){

best[key]={time:r.time,sec:sec}

}

})

let t=document.getElementById("bestTable")

t.innerHTML="<tr><th>種目</th><th>水路</th><th>ベスト</th></tr>"

for(let k in best){

let p=k.split("_")

t.innerHTML+=`
<tr>
<td>${p[0]}</td>
<td>${p[1]}</td>
<td>${best[k].time}</td>
</tr>
`

}

}

document.getElementById("csvUpload").addEventListener("change",e=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=()=>{

let rows=reader.result.split("\n")

rows.shift()

rows.forEach(r=>{

let c=r.split(",")

if(c.length<6)return

records.push({

date:c[0],
meet:c[1],
venue:c[2],
course:c[3],
event:c[4],
time:c[5]

})

})

save()
render()

}

reader.readAsText(file)

})


function downloadCSV(){

let csv="date,meet,venue,course,event,time\n"

records.forEach(r=>{

csv+=`${r.date},${r.meet},${r.venue},${r.course},${r.event},${r.time}\n`

})

let blob=new Blob([csv])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="swim_records.csv"

a.click()

}


function renderGraph(){

let events=[...new Set(records.map(r=>r.event))]

let sel=document.getElementById("graphEvent")

sel.innerHTML=""

events.forEach(e=>{

let o=document.createElement("option")
o.text=e

sel.add(o)

})

sel.onchange=drawGraph

drawGraph()

}

function drawGraph(){

let ev=document.getElementById("graphEvent").value

let data=records.filter(r=>r.event==ev)

data.sort((a,b)=>new Date(a.date)-new Date(b.date))

let labels=data.map(r=>r.date)

let times=data.map(r=>timeToSec(r.time))

if(chart) chart.destroy()

chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:labels,
datasets:[{
label:ev,
data:times
}]
}

})

}


load()

</script>

</body>
</html>
