<style>
  /* ===== 全体スタイル（既存の見た目を維持） ===== */

  header{background:#1e73be;color:#fff;padding:18px;font-size:20px;font-weight:700;}

<script>
/* ===== JS: 既存の機能を維持しつつ、中央テキストはオーバーレイで表示する最小変更版 ===== */

let records = [];
let goals = {};
const CHART_COLORS = ['#1e73be','#ff7f50','#4caf50','#f39c12','#9b59b6','#e74c3c'];
/* ===== 置換用：拡張種目対応の finaBase マップ（必要に応じて値は調整してください） ===== */
const finaBase = {
  "自由形50m": 21.04,
  "自由形100m": 46.86,
  "自由形200m": 102.00,

  "背泳ぎ50m": 24.50,
  "背泳ぎ100m": 51.60,

  "平泳ぎ50m": 27.00,
  "平泳ぎ100m": 56.88,

  "バタフライ50m": 23.50,
  "ﾊﾞﾀﾌﾗｲ50m": 23.50,   // 全角/半角表記の違いに対応
  "バタフライ100m": 49.45,
  "ﾊﾞﾀﾌﾗｲ100m": 49.45,  // 同上

  "個人ﾒﾄﾞﾚｰ50m": 25.50,
  "個人ﾒﾄﾞﾚｰ100m": 54.00,

 
  "ﾒﾄﾞﾚｰﾘﾚｰ400m": 220.00,

  "ﾘﾚｰ400m": 190.00
};

/*
注意：
- 上の数値は「FINAポイント計算の基準タイム（ベースタイム）」として使うための目安値です。
- 実際のベース値（公式や目的に応じた基準）は必要に応じて調整してください。
- 同じ種目が全角/半角や表記ゆれで複数ある場合は両方登録しておくと既存データとの照合が楽になります。
*/



/* DOM refs */
const inputDate = document.getElementById('inputDate');
const inputMeet = document.getElementById('inputMeet');
const inputVenue = document.getElementById('inputVenue');
const inputCourse = document.getElementById('inputCourse');
const inputEvent = document.getElementById('inputEvent');
const inputTime = document.getElementById('inputTime');
const saveRecordBtn = document.getElementById('saveRecordBtn');

const csvUpload = document.getElementById('csvUpload');
const importCsvBtn = document.getElementById('importCsvBtn');
const downloadCsvBtn = document.getElementById('downloadCsvBtn');

const goalEventSelect = document.getElementById('goalEventSelect');
const goalTimeInput = document.getElementById('goalTimeInput');
const saveGoalBtn = document.getElementById('saveGoalBtn');
const goalTable = document.getElementById('goalTable');

const statsDiv = document.getElementById('stats');
const recordsTable = document.getElementById('recordsTable');
const bestTable = document.getElementById('bestTable');
const seasonBestTable = document.getElementById('seasonBestTable');

const goalGaugeCanvas = document.getElementById('goalGauge');
const goalGaugeCenter = document.getElementById('goalGaugeCenter');
const chartCanvas = document.getElementById('chartCanvas');
const finaCanvas = document.getElementById('finaCanvas');
const improveCanvas = document.getElementById('improveCanvas');
const strokeCanvas = document.getElementById('strokeCanvas');

const filterSearch = document.getElementById('filterSearch');
const filterEvent = document.getElementById('filterEvent');
const filterCourse = document.getElementById('filterCourse');
const clearFiltersBtn = document.getElementById('clearFiltersBtn');

let goalChart, mainChart, finaChart, improveChart, strokeChart;

/* date sort direction */
let dateSortDir = 'desc';

/* Chart.js plugin not required for overlay; keep charts simple */

/* CSV helpers */
function stripBOM(s){ return s.replace(/^\uFEFF/, ''); }
function detectDelimiter(sample){
  const counts = {',':0,';':0,'\t':0};
  const lines = sample.split(/\r?\n/).slice(0,5);
  lines.forEach(l=>{
    counts[','] += (l.match(/,/g)||[]).length;
    counts[';'] += (l.match(/;/g)||[]).length;
    counts['\t'] += (l.match(/\t/g)||[]).length;
  });
  let max = ',', maxv = counts[','];
  Object.keys(counts).forEach(k=>{ if(counts[k] > maxv){ max = k; maxv = counts[k]; }});
  return max;
}
function parseCSVText(text){
  text = stripBOM(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(!text) return {header:[], rows:[]};
  const delim = detectDelimiter(text);
  const rows = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    const next = text[i+1] || '';
    if(ch === '"'){
      if(inQuotes && next === '"'){ cur += '"'; i++; continue; }
      inQuotes = !inQuotes;
      continue;
    }
    if(!inQuotes && ch === '\n'){ rows.push(cur); cur = ''; continue; }
    cur += ch;
  }
  if(cur !== '') rows.push(cur);
  const parsed = rows.map(line=>{
    const fields = [];
    let field = '', q = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      const next = line[i+1] || '';
      if(ch === '"'){
        if(q && next === '"'){ field += '"'; i++; continue; }
        q = !q; continue;
      }
      if(!q && line.substr(i, delim.length) === delim){
        fields.push(field); field = ''; i += delim.length - 1; continue;
      }
      field += ch;
    }
    fields.push(field);
    return fields.map(f=>f.trim().replace(/\u3000/g,' ').replace(/　/g,' ').replace(/\uFF0C/g,','));
  });
  const header = parsed.shift() || [];
  return {header, rows: parsed};
}

/* read file once only */
function readFileWithEncodings(file, callback){
  let called = false;
  function onceCallback(text){
    if(called) return;
    called = true;
    callback(text);
  }
  const readerUtf8 = new FileReader();
  readerUtf8.onload = e => {
    const txt = String(e.target.result || '');
    if(txt && txt.length > 0) onceCallback(txt);
  };
  readerUtf8.onerror = () => {};
  readerUtf8.readAsText(file, 'utf-8');

  const readerBuf = new FileReader();
  readerBuf.onload = e => {
    if(called) return;
    const ab = e.target.result;
    const encCandidates = ['shift_jis','windows-31j','utf-8'];
    for(const enc of encCandidates){
      try{
        const dec = new TextDecoder(enc);
        const txt = dec.decode(ab);
        if(txt && txt.length > 0){ onceCallback(txt); return; }
      }catch(err){}
    }
    if(!called) onceCallback('');
  };
  readerBuf.onerror = () => { if(!called) onceCallback(''); };
  readerBuf.readAsArrayBuffer(file);
}

/* persistence */
function saveStorage(){ localStorage.setItem('swimRecords', JSON.stringify(records)); localStorage.setItem('swimGoals', JSON.stringify(goals)); }
function loadStorage(){ records = JSON.parse(localStorage.getItem('swimRecords')) || []; goals = JSON.parse(localStorage.getItem('swimGoals')) || {}; }

/* time helpers */
function timeToSec(t){
  if(t === null || t === undefined) return NaN;
  t = String(t).trim();
  if(t === '') return NaN;
  if(t.includes(':')){
    const parts = t.split(':');
    const m = parseInt(parts[0].replace(/[^\d]/g,''),10) || 0;
    const s = parseFloat(parts[1].replace(/[^\d.]/g,'')) || 0;
    return m*60 + s;
  }
  const v = parseFloat(t.replace(/[^\d.]/g,''));
  return isNaN(v) ? NaN : v;
}
function secToTime(s){
  if(isNaN(s) || s === Infinity) return '-';
  s = Number(s);
  const m = Math.floor(s/60);
  const sec = (s - m*60).toFixed(2).padStart(5,'0');
  if(m>0) return `${m}:${sec}`;
  return `${sec}`;
}

/* FINA */
function finaPoint(eventName, timeStr){
  const base = finaBase[eventName];
  if(!base) return '-';
  const sec = timeToSec(timeStr);
  if(isNaN(sec) || sec <= 0) return '-';
  return Math.round(1000 * Math.pow(base / sec, 3));
}

/* CRUD */
function addRecord(){
  const date = inputDate.value || new Date().toISOString().slice(0,10);
  const meet = inputMeet.value.trim();
  const venue = inputVenue.value.trim();
  const course = inputCourse.value;
  const eventName = inputEvent.value;
  const time = inputTime.value.trim();
  const sec = timeToSec(time);
  if(isNaN(sec) || sec <= 0){ alert('正しいタイムを入力してください（例 0:23.45 または 23.45）'); return; }
  records.push({date, meet, venue, course, event: eventName, time});
  records.sort((a,b)=> new Date(a.date) - new Date(b.date));
  saveStorage();
  populateFilterEvent();
  renderAll();
  inputTime.value = '';
}
function editRecord(index){
  const r = records[index]; if(!r) return;
  inputDate.value = r.date; inputMeet.value = r.meet; inputVenue.value = r.venue;
  inputCourse.value = r.course; inputEvent.value = r.event; inputTime.value = r.time;
  records.splice(index,1); saveStorage(); populateFilterEvent(); renderAll();
}
function deleteRecord(index){ if(!confirm('削除しますか？')) return; records.splice(index,1); saveStorage(); populateFilterEvent(); renderAll(); }

/* CSV import */
function importCSVFileEnhanced(file, onDone){
  readFileWithEncodings(file, (text) => {
    try{
      if(!text){ alert('ファイルの読み込みに失敗しました'); if(typeof onDone==='function') onDone(); return; }
      const parsed = parseCSVText(text);
      if(!parsed.header || parsed.header.length === 0){ alert('CSVのヘッダが見つかりません'); console.log(parsed); if(typeof onDone==='function') onDone(); return; }
      const header = parsed.header.map(h=>String(h).toLowerCase());
      const required = ['date','meet','venue','course','event','time'];
      const missing = required.filter(r=>!header.includes(r));
      if(missing.length){ alert('CSVに必要な列がありません: ' + missing.join(', ')); console.log('header', parsed.header); if(typeof onDone==='function') onDone(); return; }
      const idx = {}; header.forEach((h,i)=> idx[h]=i);
      const newRecords = [];
      parsed.rows.forEach((cols, rowIndex)=>{
        if(cols.length < header.length){ console.warn('行スキップ: 列数不足', rowIndex+2, cols); return; }
        const r = {
          date: (cols[idx['date']]||'').trim(),
          meet: (cols[idx['meet']]||'').trim(),
          venue: (cols[idx['venue']]||'').trim(),
          course: (cols[idx['course']]||'').trim(),
          event: (cols[idx['event']]||'').trim(),
          time: (cols[idx['time']]||'').trim()
        };
        if(!r.date || isNaN(new Date(r.date).getTime())){ console.warn('行スキップ: 日付不正', rowIndex+2, r); return; }
        if(isNaN(timeToSec(r.time))){ console.warn('行スキップ: タイム不正', rowIndex+2, r); return; }
        newRecords.push(r);
      });
      if(newRecords.length === 0){ alert('有効なレコードが見つかりませんでした。コンソールを確認してください。'); console.log(parsed); if(typeof onDone==='function') onDone(); return; }
      records = records.concat(newRecords);
      records.sort((a,b)=> new Date(a.date) - new Date(b.date));
      saveStorage(); populateFilterEvent(); renderAll(); alert(`${newRecords.length} 件をインポートしました`);
    }catch(err){
      console.error('importCSVFileEnhanced error', err);
      alert('CSVの読み込み中にエラーが発生しました。コンソールを確認してください。');
    } finally {
      if(typeof onDone==='function') onDone();
    }
  });
}

/* goals */
function saveGoal(){ const e = goalEventSelect.value; const t = goalTimeInput.value.trim(); if(!e){ alert('種目を選択してください'); return; } if(isNaN(timeToSec(t))){ alert('正しい目標タイムを入力してください'); return; } goals[e] = t; saveStorage(); renderAll(); }
function deleteGoal(e){ if(goals[e] && confirm(`${e} の目標を削除しますか？`)){ delete goals[e]; saveStorage(); renderAll(); } }

/* populate filter event select from inputEvent options */
function populateFilterEvent(){
  const options = Array.from(inputEvent.options).map(o=>o.value);
  filterEvent.innerHTML = '<option value="">全種目</option>';
  options.forEach(opt=>{
    const o = document.createElement('option'); o.value = opt; o.textContent = opt; filterEvent.appendChild(o);
  });
  // also keep goal/graph selects in sync
  goalEventSelect.innerHTML = '';
  graphEventSelect.innerHTML = '<option>選択</option>';
  options.forEach(opt=>{
    const o1 = document.createElement('option'); o1.value = opt; o1.textContent = opt; goalEventSelect.appendChild(o1);
    const o2 = document.createElement('option'); o2.value = opt; o2.textContent = opt; graphEventSelect.appendChild(o2);
  });
}

/* filtering */
function getFilteredRecords(){
  const q = (filterSearch.value || '').trim().toLowerCase();
  const ev = filterEvent.value;
  const course = filterCourse.value;
  return records.filter(r=>{
    if(ev && r.event !== ev) return false;
    if(course && r.course !== course) return false;
    if(!q) return true;
    return (r.meet||'').toLowerCase().includes(q) || (r.event||'').toLowerCase().includes(q) || (r.venue||'').toLowerCase().includes(q);
  });
}

/* toggle date sort */
function toggleDateSort(){
  dateSortDir = (dateSortDir === 'desc') ? 'asc' : 'desc';
  renderTable();
}

/* renderGoalGauge: draw donut and update overlay center text (no canvas text) */
function renderGoalGauge(){
  const e = goalEventSelect.value;
  if(!e || !goals[e]){
    if(goalChart){ try{ goalChart.destroy() }catch{} goalChart = null; }
    // clear overlay
    goalGaugeCenter.querySelector('.main').textContent = '-- / --';
    goalGaugeCenter.querySelector('.sub').textContent = '(--%)';
    return;
  }

  const bestTimes = records.filter(r=>r.event===e).map(r=>timeToSec(r.time)).filter(v=>!isNaN(v));
  if(bestTimes.length === 0){
    if(goalChart){ try{ goalChart.destroy() }catch{} goalChart = null; }
    goalGaugeCenter.querySelector('.main').textContent = '-- / --';
    goalGaugeCenter.querySelector('.sub').textContent = '(--%)';
    return;
  }

  const bestTime = Math.min(...bestTimes);
  const goalSec = timeToSec(goals[e]);
  if(isNaN(goalSec) || goalSec <= 0) return;

  let progress = Math.round(Math.max(0, Math.min(100, (goalSec / bestTime) * 100)));
  const remaining = 100 - progress;

  // ensure canvas pixel size matches CSS for crisp overlay
  const dpr = window.devicePixelRatio || 1;
  const cssSize = parseInt(getComputedStyle(goalGaugeCanvas).width,10) || 260;
  goalGaugeCanvas.width = cssSize * dpr;
  goalGaugeCanvas.height = cssSize * dpr;
  goalGaugeCanvas.style.width = cssSize + 'px';
  goalGaugeCanvas.style.height = cssSize + 'px';

  if(goalChart){ try{ goalChart.destroy() }catch{} goalChart = null; }

  // create donut chart (responsive:false to avoid unexpected resizing)
  goalChart = new Chart(goalGaugeCanvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: ['達成率','残り'],
      datasets: [{ data: [progress, remaining], backgroundColor: [CHART_COLORS[0], '#e9eef5'] }]
    },
    options: {
      cutout: '70%',
      responsive: false,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } }
    }
  });

  // update overlay center text (large & clear)
  const mainText = `${goalSec.toFixed(2)}s / ${bestTime.toFixed(2)}s`;
  const subText = `(${progress}%)`;
  const mainEl = goalGaugeCenter.querySelector('.main');
  const subEl = goalGaugeCenter.querySelector('.sub');
  if(mainEl) mainEl.textContent = mainText;
  if(subEl) subEl.textContent = subText;
}

/* render functions */
function renderDashboard(){
  const races = records.length;
  const meets = new Set(records.map(r=>r.meet)).size;
  const times = records.map(r=>timeToSec(r.time)).filter(v=>!isNaN(v));
  const avgSec = times.length ? (times.reduce((a,b)=>a+b,0)/times.length) : NaN;
  const bestSec = times.length ? Math.min(...times) : NaN;
  const latestSec = times.length ? times[times.length-1] : NaN;
  statsDiv.innerHTML = `
    <div class="stat">レース数<b>${races}</b></div>
    <div class="stat">大会数<b>${meets}</b></div>
    <div class="stat">平均<b>${isNaN(avgSec)?'-':secToTime(avgSec)}</b></div>
    <div class="stat">ベスト<b>${isNaN(bestSec)?'-':secToTime(bestSec)}</b></div>
    <div class="stat">最新<b>${isNaN(latestSec)?'-':secToTime(latestSec)}</b></div>
  `;
}

function renderTable(){
  const filtered = getFilteredRecords();
  filtered.sort((a,b)=>{
    const ta = new Date(a.date).getTime();
    const tb = new Date(b.date).getTime();
    if(ta === tb) return 0;
    return dateSortDir === 'asc' ? (ta - tb) : (tb - ta);
  });

  const dirSymbol = dateSortDir === 'asc' ? '▲' : '▼';
  let html = `<tr>
    <th class="sortable" onclick="toggleDateSort()">日付<span class="sort-indicator">${dirSymbol}</span></th>
    <th>大会</th><th>会場</th><th>コース</th><th>種目</th><th>タイム</th><th>FINA</th><th></th></tr>`;
  filtered.forEach((r)=>{
    const globalIndex = records.indexOf(r);
    const goal = goals[r.event];
    let diffHtml = '';
    if(goal){
      const d = (timeToSec(r.time) - timeToSec(goal));
      if(!isNaN(d)) diffHtml = d <= 0 ? `<span style="color:green;font-weight:bold">達成</span>` : `<span style="color:red">あと ${d.toFixed(2)}s</span>`;
    }
    html += `<tr>
      <td>${r.date}</td><td>${r.meet}</td><td>${r.venue}</td><td>${r.course}</td><td>${r.event}</td>
      <td>${r.time} ${diffHtml}</td><td>${finaPoint(r.event, r.time)}</td>
      <td><button onclick="editRecord(${globalIndex})">編集</button><button onclick="deleteRecord(${globalIndex})">削除</button></td>
    </tr>`;
  });
  recordsTable.innerHTML = html;
}

function renderBest(){
  const best = {};
  records.forEach(r=>{
    const sec = timeToSec(r.time); if(isNaN(sec)) return;
    if(!best[r.event] || sec < best[r.event].sec) best[r.event] = {time: r.time, sec};
  });
  let html = `<tr><th>種目</th><th>ベスト</th></tr>`;
  Object.keys(best).sort().forEach(e=> html += `<tr><td>${e}</td><td>${best[e].time}</td></tr>`);
  bestTable.innerHTML = html;
}

function renderProgressChart(){
  const e = graphEventSelect.value;
  if(!e || e === '選択'){ if(mainChart){ mainChart.destroy(); mainChart = null; } return; }
  const data = records.filter(r=>r.event===e).sort((a,b)=> new Date(a.date) - new Date(b.date));
  const labels = data.map(r=>r.date);
  const times = data.map(r=>timeToSec(r.time));
  const goalArr = goals[e] ? Array(labels.length).fill(timeToSec(goals[e])) : [];
  if(mainChart) mainChart.destroy();
  mainChart = new Chart(chartCanvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [
      { label: 'タイム (秒)', data: times, borderColor: CHART_COLORS[0], backgroundColor: 'rgba(30,115,190,0.08)', tension:0.2 },
      { label: '目標', data: goalArr, borderColor: CHART_COLORS[1], borderDash: [6,4], fill:false }
    ]},
    options: { plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: false } } }
  });
}

function renderFINAChart(){
  const data = [...records].sort((a,b)=> new Date(a.date) - new Date(b.date));
  const labels = data.map(r=>r.date);
  const points = data.map(r=> { const p = finaPoint(r.event, r.time); return (p === '-') ? null : p; });
  if(finaChart) finaChart.destroy();
  finaChart = new Chart(finaCanvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ label: 'FINA', data: points, borderColor: CHART_COLORS[1], backgroundColor: 'rgba(255,127,80,0.08)', tension:0.2 }] },
    options: { plugins: { legend: { display: true } } }
  });
}

function renderImproveChart(){
  const map = {};
  records.forEach(r=>{ if(!map[r.event]) map[r.event]=[]; map[r.event].push(r); });
  const labels = [], data = [];
  Object.keys(map).forEach(e=>{
    const arr = map[e].sort((a,b)=> new Date(a.date) - new Date(b.date));
    if(arr.length < 2) return;
    const first = timeToSec(arr[0].time);
    const last = timeToSec(arr[arr.length-1].time);
    if(isNaN(first) || isNaN(last) || first === 0) return;
    labels.push(e); data.push(Number(((first - last) / first * 100).toFixed(1)));
  });
  if(improveChart) improveChart.destroy();
  improveChart = new Chart(improveCanvas.getContext('2d'), { type: 'bar', data: { labels, datasets: [{ label: '改善率 %', data, backgroundColor: CHART_COLORS }] }, options: { plugins: { legend: { display: false } } } });
}

function renderStrokeChart(){
  const map = {};
  records.forEach(r=>{
    if(!r || !r.event) return;
    const sec = timeToSec(r.time); if(isNaN(sec)) return;
    let stroke = r.event.replace(/[\dｍm\uFF10-\uFF19]/g,'').replace(/m/gi,'').trim();
    if(!stroke) stroke = r.event.trim();
    if(!map[stroke]) map[stroke]=[]; map[stroke].push(sec);
  });
  const labels = [], data = [];
  Object.keys(map).forEach(s=>{
    const arr = map[s]; if(!arr || arr.length===0) return;
    const avg = arr.reduce((a,b)=>a+b,0)/arr.length;
    labels.push(s); data.push(Number(avg.toFixed(2)));
  });
  if(strokeChart) strokeChart.destroy();
  strokeChart = new Chart(strokeCanvas.getContext('2d'), { type: 'bar', data: { labels, datasets: [{ label: '平均秒', data, backgroundColor: CHART_COLORS }] }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
}

function renderSeasonBest(){
  const map = {};
  records.forEach(r=>{
    if(!r || !r.date || !r.event) return;
    const d = new Date(r.date); if(isNaN(d.getTime())) return;
    const y = d.getFullYear(); const key = `${y}__${r.event}`; const sec = timeToSec(r.time); if(isNaN(sec)) return;
    if(!map[key] || sec < map[key]) map[key] = sec;
  });
  let html = `<tr><th>年</th><th>種目</th><th>SB</th></tr>`;
  const keys = Object.keys(map).sort((a,b)=>{ const ay = parseInt(a.split('__')[0],10); const by = parseInt(b.split('__')[0],10); if(ay !== by) return ay - by; return a.localeCompare(b); });
  keys.forEach(k=>{ const [year, ...evParts] = k.split('__'); const ev = evParts.join('__'); html += `<tr><td>${year}</td><td>${ev}</td><td>${secToTime(map[k])}</td></tr>`; });
  seasonBestTable.innerHTML = html;
}

/* select init & render all */
function renderGoalsTable(){ let html = `<tr><th>種目</th><th>目標タイム</th><th></th></tr>`; Object.keys(goals).sort().forEach(e=>{ html += `<tr><td>${e}</td><td>${goals[e]}</td><td><button onclick="deleteGoal('${e.replace(/'/g,"\\'")}')">削除</button></td></tr>`; }); goalTable.innerHTML = html; }

function populateEventSelects(){
  const options = Array.from(inputEvent.options).map(o=>o.value);
  goalEventSelect.innerHTML = ''; graphEventSelect.innerHTML = '<option>選択</option>';
  options.forEach(opt=>{ const o1 = document.createElement('option'); o1.value = opt; o1.textContent = opt; const o2 = document.createElement('option'); o2.value = opt; o2.textContent = opt; goalEventSelect.appendChild(o1); graphEventSelect.appendChild(o2); });
  populateFilterEvent();
}
function renderAll(){ renderDashboard(); renderTable(); renderBest(); renderGoalsTable(); renderGoalGauge(); renderProgressChart(); renderFINAChart(); renderImproveChart(); renderStrokeChart(); renderSeasonBest(); }

/* events */
saveRecordBtn.addEventListener('click', addRecord);
downloadCsvBtn.addEventListener('click', ()=>{
  const header = ['date','meet','venue','course','event','time'];
  const rows = records.map(r => header.map(h => `"${String(r[h]||'').replace(/"/g,'""')}"`).join(','));
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'swim_records.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
importCsvBtn.addEventListener('click', ()=>{
  const f = csvUpload.files[0]; if(!f){ alert('CSVファイルを選択してください'); return; }
  importCsvBtn.disabled = true; importCsvBtn.textContent = 'インポート中...';
  importCSVFileEnhanced(f, ()=>{ importCsvBtn.disabled = false; importCsvBtn.textContent = 'CSVインポート'; });
});
saveGoalBtn.addEventListener('click', saveGoal);
goalEventSelect.addEventListener('change', renderGoalGauge);
graphEventSelect.addEventListener('change', renderProgressChart);

filterSearch.addEventListener('input', ()=>{ renderTable(); });
filterEvent.addEventListener('change', ()=>{ renderTable(); });
filterCourse.addEventListener('change', ()=>{ renderTable(); });
clearFiltersBtn.addEventListener('click', ()=>{ filterSearch.value=''; filterEvent.value=''; filterCourse.value=''; renderTable(); });

/* init */
(function init(){ loadStorage(); populateEventSelects(); records.sort((a,b)=> new Date(b.date) - new Date(a.date)); renderAll(); window.editRecord = editRecord; window.deleteRecord = deleteRecord; window.deleteGoal = deleteGoal; window.toggleDateSort = toggleDateSort; })();
</script>
