<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Swim Record Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eef2f6;
}

header{
background:#1e73be;
color:white;
padding:18px;
font-size:20px;
font-weight:bold;
}

.container{
padding:25px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:25px;
border-radius:12px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

h3{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#f0f4f8;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

input,select{
padding:7px;
margin:5px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:7px 12px;
border:none;
background:#1e73be;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
opacity:0.85;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.stat{
background:#f4f6f9;
padding:15px;
border-radius:8px;
font-size:18px;
text-align:center;
}

.stat b{
display:block;
font-size:24px;
margin-top:5px;
}

.goalGood{color:green;font-weight:bold;}
.goalBad{color:red;}

</style>
</head>

<body>

<header>
Swim Record Dashboard
</header>

<div class="container">

<div class="card">
<h3>ダッシュボード</h3>
<div class="stats" id="stats"></div>
</div>


<div class="card">
<h3>記録入力</h3>

<input id="date" type="date">
<input id="meet" placeholder="大会名">
<input id="venue" placeholder="会場">

<select id="course">
<option>短水路</option>
<option>長水路</option>
</select>

<input id="event" placeholder="種目 (例 自由形100m)">
<input id="time" placeholder="タイム">

<button onclick="addRecord()">保存</button>

</div>


<div class="card">
<h3>CSV</h3>

<input type="file" id="csvUpload">
<button onclick="downloadCSV()">CSVダウンロード</button>

</div>


<div class="card">
<h3>目標タイム</h3>

<input id="goalEvent" placeholder="種目">
<input id="goalTime" placeholder="目標タイム">

<button onclick="saveGoal()">保存</button>

<table id="goalTable"></table>

</div>


<div class="card">
<h3>記録一覧</h3>

<select id="eventFilter">
<option value="all">すべて</option>
</select>

<table id="recordsTable"></table>

</div>


<div class="card">
<h3>ベストタイム</h3>
<table id="bestTable"></table>
</div>


<div class="card">
<h3>記録推移</h3>

<select id="graphEvent"></select>

<canvas id="chart"></canvas>

</div>

</div>


<script>

let records=[]
let chart
let goals={}
let editIndex=null

const finaBase={
"自由形50m":21.04,
"自由形100m":46.86,
"自由形200m":102,
"背泳ぎ100m":51.6,
"平泳ぎ100m":56.88,
"バタフライ100m":49.45
}

const eventOrder=[
"自由形50m","自由形100m","自由形200m","自由形400m","自由形800m","自由形1500m",
"背泳ぎ50m","背泳ぎ100m","背泳ぎ200m",
"平泳ぎ50m","平泳ぎ100m","平泳ぎ200m",
"バタフライ50m","バタフライ100m","バタフライ200m",
"個人メドレー200m","個人メドレー400m"
]

function save(){
localStorage.setItem("swimRecords",JSON.stringify(records))
localStorage.setItem("swimGoals",JSON.stringify(goals))
}

function load(){

let r=localStorage.getItem("swimRecords")
let g=localStorage.getItem("swimGoals")

if(r) records=JSON.parse(r)
if(g) goals=JSON.parse(g)

render()

}

function timeToSec(t){

if(!t) return 0

if(t.includes(":")){
let p=t.split(":")
return parseFloat(p[0])*60+parseFloat(p[1])
}

return parseFloat(t)

}

function secToTime(s){

let m=Math.floor(s/60)
let sec=(s%60).toFixed(2)

if(m>0) return m+":"+sec
return sec

}

function finaPoint(event,time){

let base=finaBase[event]

if(!base) return "-"

let sec=timeToSec(time)

return Math.round(1000*Math.pow(base/sec,3))

}

function addRecord(){

let r={
date:date.value,
meet:meet.value,
venue:venue.value,
course:course.value,
event:event.value,
time:time.value
}

if(editIndex!=null){
records[editIndex]=r
editIndex=null
}else{
records.push(r)
}

save()
render()

}

function editRecord(i){

let r=records[i]

date.value=r.date
meet.value=r.meet
venue.value=r.venue
course.value=r.course
event.value=r.event
time.value=r.time

editIndex=i

}

function deleteRecord(i){

records.splice(i,1)

save()
render()

}


document.getElementById("csvUpload").addEventListener("change",e=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=()=>{

let rows=reader.result.split("\n")

rows.shift()

rows.forEach(r=>{

let c=r.split(",")

if(c.length<6)return

records.push({
date:c[0],
meet:c[1],
venue:c[2],
course:c[3],
event:c[4],
time:c[5]
})

})

save()
render()

}

reader.readAsText(file)

})


function downloadCSV(){

let csv="date,meet,venue,course,event,time\n"

records.forEach(r=>{
csv+=`${r.date},${r.meet},${r.venue},${r.course},${r.event},${r.time}\n`
})

let blob=new Blob([csv])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="swim_records.csv"

a.click()

}


function saveGoal(){

goals[goalEvent.value]=goalTime.value

save()
render()

}



function renderDashboard(){

let races=records.length

let meets=new Set(records.map(r=>r.meet)).size

let latest=records.sort((a,b)=>new Date(b.date)-new Date(a.date))[0]

document.getElementById("stats").innerHTML=`

<div class="stat">レース数<b>${races}</b></div>
<div class="stat">大会数<b>${meets}</b></div>
<div class="stat">最新<b>${latest?latest.time:"-"}</b></div>

`

}



function renderTable(){

let filter=document.getElementById("eventFilter").value

let list=records.filter(r=>{
if(filter==="all") return true
return r.event===filter
})

let t=document.getElementById("recordsTable")

t.innerHTML="<tr><th>日付</th><th>大会</th><th>種目</th><th>タイム</th><th>FINA</th><th></th></tr>"

list.forEach((r,i)=>{

t.innerHTML+=`
<tr>
<td>${r.date}</td>
<td>${r.meet}</td>
<td>${r.event}</td>
<td>${r.time}</td>
<td>${finaPoint(r.event,r.time)}</td>
<td>
<button onclick="editRecord(${i})">編集</button>
<button onclick="deleteRecord(${i})">削除</button>
</td>
</tr>
`

})

}



function renderBest(){

let best={}

records.forEach(r=>{

let key=r.event+"_"+r.course

let sec=timeToSec(r.time)

if(!best[key]||sec<best[key].sec){
best[key]={time:r.time,sec:sec}
}

})

let rows=[]

for(let k in best){

let p=k.split("_")

rows.push({
event:p[0],
course:p[1],
time:best[k].time
})

}

rows.sort((a,b)=>eventOrder.indexOf(a.event)-eventOrder.indexOf(b.event))

let t=document.getElementById("bestTable")

t.innerHTML="<tr><th>種目</th><th>水路</th><th>ベスト</th></tr>"

rows.forEach(r=>{
t.innerHTML+=`
<tr>
<td>${r.event}</td>
<td>${r.course}</td>
<td>${r.time}</td>
</tr>
`
})

}



function renderGoals(){

let html=""

for(let event in goals){

let goal=goals[event]

let eventRecords=records.filter(r=>r.event===event)

if(eventRecords.length===0){

html+=`
<tr>
<td>${event}</td>
<td>${goal}</td>
<td>-</td>
<td>-</td>
<td>-</td>
</tr>
`
continue
}

let bestSec=Math.min(...eventRecords.map(r=>timeToSec(r.time)))

let goalSec=timeToSec(goal)

let remain=(bestSec-goalSec).toFixed(2)

let rate=((goalSec/bestSec)*100).toFixed(1)

let color=bestSec<=goalSec?"goalGood":"goalBad"

html+=`
<tr>
<td>${event}</td>
<td>${goal}</td>
<td>${secToTime(bestSec)}</td>
<td class="${color}">${remain}</td>
<td>${rate}%</td>
</tr>
`

}

document.getElementById("goalTable").innerHTML=

"<tr><th>種目</th><th>目標</th><th>ベスト</th><th>残り秒</th><th>達成率</th></tr>"+html

}



function renderGraph(){

let events=[...new Set(records.map(r=>r.event))]

let sel=document.getElementById("graphEvent")

sel.innerHTML=""

events.forEach(e=>{
let o=document.createElement("option")
o.text=e
sel.add(o)
})

sel.onchange=drawGraph

drawGraph()

}



function drawGraph(){

let ev=document.getElementById("graphEvent").value

let data=records.filter(r=>r.event==ev)

data.sort((a,b)=>new Date(a.date)-new Date(b.date))

let labels=data.map(r=>r.date)

let times=data.map(r=>timeToSec(r.time))

if(chart) chart.destroy()

chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:labels,
datasets:[
{
label:"タイム",
data:times
}
]
}

})

}



function render(){

renderDashboard()
renderTable()
renderBest()
renderGoals()
renderGraph()

}



load()

</script>

</body>
</html>
