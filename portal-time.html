<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swim Record Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eef2f6;
}

header{
background:#2c3e50;
color:white;
padding:16px;
font-size:22px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:white;
padding:18px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

h3{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:center;
}

input,select{
padding:6px;
margin:3px;
}

button{
padding:6px 12px;
background:#1abc9c;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#16a085;
}

.progress{

background:#ddd;
border-radius:10px;
height:16px;

}

.progressBar{

background:#1abc9c;
height:16px;
border-radius:10px;

}

.stats{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:15px;

}

.stat{

background:#f4f6f9;
padding:15px;
border-radius:8px;
text-align:center;

}

.stat b{

font-size:22px;
display:block;

}

</style>

</head>


<body>

<header>
競泳記録ダッシュボード
</header>

<div class="container">


<div class="card">

<h3>記録入力</h3>

<input id="meet" placeholder="大会名">

<select id="event"></select>

<select id="course">
<option>長水路</option>
<option>短水路</option>
</select>

<input id="time" placeholder="タイム">
<input id="date" type="date">

<button onclick="addRecord()">追加</button>

</div>


<div class="card">

<h3>ダッシュボード</h3>

<div class="stats" id="stats"></div>

</div>


<div class="grid">

<div class="card">

<h3>記録推移グラフ</h3>

<select id="graphEvent" onchange="drawGraph()"></select>

<canvas id="chart"></canvas>

</div>


<div class="card">

<h3>目標達成グラフ</h3>

<canvas id="goalChart"></canvas>

</div>

</div>


<div class="card">

<h3>目標達成率</h3>

<table id="goalTable"></table>

</div>


<div class="card">

<h3>ベストタイム</h3>

<table id="bestTable"></table>

</div>


</div>



<script>

const events=[

"50m自由形","100m自由形","200m自由形","400m自由形",
"50m背泳ぎ","100m背泳ぎ","200m背泳ぎ",
"50m平泳ぎ","100m平泳ぎ","200m平泳ぎ",
"50mバタフライ","100mバタフライ","200mバタフライ",
"200m個人メドレー","400m個人メドレー"

]

let records=JSON.parse(localStorage.getItem("records")||"[]")
let goals=JSON.parse(localStorage.getItem("goals")||"{}")

let chart
let goalChart


function save(){

localStorage.setItem("records",JSON.stringify(records))
localStorage.setItem("goals",JSON.stringify(goals))

}


function timeToSec(t){

if(!t)return 0

if(t.includes(":")){

let p=t.split(":")
return p[0]*60+parseFloat(p[1])

}

return parseFloat(t)

}


function secToTime(sec){

let m=Math.floor(sec/60)

let s=(sec%60).toFixed(2)

if(m==0)return s

return m+":"+s.padStart(5,"0")

}



function addRecord(){

records.push({

event:event.value,
course:course.value,
time:time.value,
date:date.value,
meet:meet.value

})

save()

render()

}



function renderDashboard(){

let total=records.length

let best=records.length?

Math.min(...records.map(r=>timeToSec(r.time))):null

stats.innerHTML=

`
<div class="stat">記録数<b>${total}</b></div>
<div class="stat">最速<b>${best?secToTime(best):"-"}</b></div>
`

}



function renderBest(){

let map={}

records.forEach(r=>{

let sec=timeToSec(r.time)

if(!map[r.event]||sec<map[r.event]){

map[r.event]=sec

}

})

let html="<tr><th>種目</th><th>ベスト</th></tr>"

Object.keys(map).forEach(e=>{

html+=`

<tr>

<td>${e}</td>
<td>${secToTime(map[e])}</td>

</tr>

`

})

bestTable.innerHTML=html

}



function renderGoals(){

let html="<tr><th>種目</th><th>達成率</th></tr>"

let labels=[]
let data=[]

Object.keys(goals).forEach(e=>{

let goal=timeToSec(goals[e])

let list=records.filter(r=>r.event==e)

if(!list.length)return

let best=Math.min(...list.map(r=>timeToSec(r.time)))

let rate=(goal/best)*100

labels.push(e)

data.push(rate.toFixed(1))

html+=`

<tr>

<td>${e}</td>

<td>

<div class="progress">

<div class="progressBar" style="width:${rate}%"></div>

</div>

${rate.toFixed(1)}%

</td>

</tr>

`

})

goalTable.innerHTML=html

drawGoalChart(labels,data)

}



function drawGoalChart(labels,data){

if(goalChart)goalChart.destroy()

goalChart=new Chart(goalChartCanvas,{

type:"bar",

data:{

labels:labels,

datasets:[{

label:"達成率",

data:data

}]

}

})

}



function drawGraph(){

let ev=graphEvent.value

let data=records

.filter(r=>r.event==ev)

.sort((a,b)=>new Date(a.date)-new Date(b.date))

if(!data.length)return

let labels=data.map(r=>r.date)

let times=data.map(r=>timeToSec(r.time))

if(chart)chart.destroy()

chart=new Chart(chartCanvas,{

type:"line",

data:{

labels:labels,

datasets:[{

label:"タイム",

data:times

}]

}

})

}



function init(){

events.forEach(e=>{

event.add(new Option(e,e))
graphEvent.add(new Option(e,e))

})

render()

}

function render(){

renderDashboard()
renderBest()
renderGoals()
drawGraph()

}

init()

</script>

</body>
</html>
