<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Swim Record Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eef2f6;
}

header{
background:#1e73be;
color:white;
padding:18px;
font-size:20px;
font-weight:bold;
}

.container{
padding:25px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:25px;
border-radius:12px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

h3{margin-top:0;}

table{
width:100%;
border-collapse:collapse;
}

th{background:#f0f4f8;}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

input,select{
padding:7px;
margin:5px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:7px 12px;
border:none;
background:#1e73be;
color:white;
border-radius:6px;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.stat{
background:#f4f6f9;
padding:15px;
border-radius:8px;
font-size:18px;
text-align:center;
}

.stat b{
display:block;
font-size:24px;
margin-top:5px;
}

.goalGood{color:green;font-weight:bold;}
.goalBad{color:red;}

</style>
</head>

<body>

<header>Swim Record Dashboard</header>

<div class="container">

<div class="card">
<h3>ダッシュボード</h3>
<div class="stats" id="stats"></div>
</div>

<div class="card">
<h3>記録入力</h3>

<input id="date" type="date">
<input id="meet" placeholder="大会名">
<input id="venue" placeholder="会場">

<select id="course">
<option>短水路</option>
<option>長水路</option>
</select>

<select id="event">
<option>自由形50m</option>
<option>自由形100m</option>
<option>自由形200m</option>
<option>背泳ぎ100m</option>
<option>平泳ぎ100m</option>
<option>バタフライ100m</option>
<option>個人メドレー200m</option>
</select>

<input id="time" placeholder="タイム">

<button onclick="addRecord()">保存</button>

</div>

<div class="card">
<h3>CSV</h3>
<input type="file" id="csvUpload">
<button onclick="downloadCSV()">CSVダウンロード</button>
</div>

<div class="card">
<h3>目標タイム</h3>

<input id="goalEvent" placeholder="種目">
<input id="goalTime" placeholder="目標タイム">

<button onclick="saveGoal()">保存</button>

<table id="goalTable"></table>

</div>

<div class="card">
<h3>記録一覧</h3>

<select id="eventFilter">
<option value="all">すべて</option>
</select>

<table id="recordsTable"></table>

</div>

<div class="card">
<h3>ベストタイム</h3>
<table id="bestTable"></table>
</div>

<div class="card">
<h3>記録推移</h3>

<select id="graphEvent"></select>

<canvas id="chart"></canvas>

</div>

<div class="card">
<h3>FINAポイント推移</h3>
<canvas id="finaChart"></canvas>
</div>

<div class="card">
<h3>改善率</h3>
<canvas id="improveChart"></canvas>
</div>

<div class="card">
<h3>泳法別平均</h3>
<canvas id="strokeChart"></canvas>
</div>

<div class="card">
<h3>シーズンベスト</h3>
<table id="seasonBest"></table>
</div>

</div>

<script>

let records=[]
let goals={}

let chart=null
let finaChart=null
let improveChart=null
let strokeChart=null

const finaBase={
"自由形50m":21.04,
"自由形100m":46.86,
"自由形200m":102,
"背泳ぎ100m":51.6,
"平泳ぎ100m":56.88,
"バタフライ100m":49.45
}

function save(){
localStorage.setItem("swimRecords",JSON.stringify(records))
localStorage.setItem("swimGoals",JSON.stringify(goals))
}

function load(){

records=JSON.parse(localStorage.getItem("swimRecords"))||[]
goals=JSON.parse(localStorage.getItem("swimGoals"))||[]

render()

}

function timeToSec(t){

if(!t) return 0

if(t.includes(":")){
let p=t.split(":")
return parseFloat(p[0])*60+parseFloat(p[1])
}

return parseFloat(t)

}

function secToTime(s){

let m=Math.floor(s/60)
let sec=(s%60).toFixed(2)

if(m>0) return m+":"+sec
return sec

}

function finaPoint(event,time){

let base=finaBase[event]

if(!base) return "-"

let sec=timeToSec(time)

return Math.round(1000*Math.pow(base/sec,3))

}

function addRecord(){

records.push({
date:date.value,
meet:meet.value,
venue:venue.value,
course:course.value,
event:event.value,
time:time.value
})

save()
render()

}

document.getElementById("csvUpload").addEventListener("change",e=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=()=>{

let rows=reader.result.split("\n")

rows.shift()

rows.forEach(r=>{

if(!r.trim()) return

let c=r.split(",")

if(c.length<6)return

records.push({
date:c[0],
meet:c[1],
venue:c[2],
course:c[3],
event:c[4],
time:c[5]
})

})

save()
render()

}

reader.readAsText(file)

})

function downloadCSV(){

let csv="date,meet,venue,course,event,time\n"

records.forEach(r=>{
csv+=`${r.date},${r.meet},${r.venue},${r.course},${r.event},${r.time}\n`
})

let blob=new Blob([csv])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="swim_records.csv"

a.click()

}

function saveGoal(){

goals[goalEvent.value]=goalTime.value

save()
render()

}

function renderDashboard(){

let races=records.length
let meets=new Set(records.map(r=>r.meet)).size

document.getElementById("stats").innerHTML=`

<div class="stat">レース数<b>${races}</b></div>
<div class="stat">大会数<b>${meets}</b></div>

`

}

function renderTable(){

let t=document.getElementById("recordsTable")

t.innerHTML="<tr><th>日付</th><th>大会</th><th>種目</th><th>タイム</th><th>FINA</th></tr>"

records.forEach(r=>{

t.innerHTML+=`
<tr>
<td>${r.date}</td>
<td>${r.meet}</td>
<td>${r.event}</td>
<td>${r.time}</td>
<td>${finaPoint(r.event,r.time)}</td>
</tr>
`

})

}

function renderBest(){

let best={}

records.forEach(r=>{

let sec=timeToSec(r.time)

if(!best[r.event]||sec<best[r.event].sec){
best[r.event]={time:r.time,sec:sec}
}

})

let t=document.getElementById("bestTable")

t.innerHTML="<tr><th>種目</th><th>ベスト</th></tr>"

Object.keys(best).forEach(e=>{
t.innerHTML+=`<tr><td>${e}</td><td>${best[e].time}</td></tr>`
})

}

function renderFINA(){

let data=[...records].sort((a,b)=>new Date(a.date)-new Date(b.date))

let labels=data.map(r=>r.date)

let points=data.map(r=>finaPoint(r.event,r.time))

if(finaChart)finaChart.destroy()

finaChart=new Chart(document.getElementById("finaChart"),{

type:"line",

data:{
labels:labels,
datasets:[{
label:"FINA",
data:points
}]
}

})

}

function renderImprove(){

let map={}

records.forEach(r=>{

if(!map[r.event])map[r.event]=[]

map[r.event].push(r)

})

let labels=[]
let data=[]

for(let e in map){

let arr=map[e].sort((a,b)=>new Date(a.date)-new Date(b.date))

if(arr.length<2)continue

let first=timeToSec(arr[0].time)
let last=timeToSec(arr[arr.length-1].time)

labels.push(e)

data.push(((first-last)/first*100).toFixed(1))

}

if(improveChart)improveChart.destroy()

improveChart=new Chart(improveChartCanvas,{

type:"bar",

data:{
labels:labels,
datasets:[{label:"改善率%",data:data}]
}

})

}

function renderStroke(){

let map={}

records.forEach(r=>{

let stroke=r.event.replace(/[0-9]/g,"")

let sec=timeToSec(r.time)

if(!map[stroke])map[stroke]=[]

map[stroke].push(sec)

})

let labels=[]
let data=[]

for(let s in map){

let avg=map[s].reduce((a,b)=>a+b)/map[s].length

labels.push(s)
data.push(avg)

}

if(strokeChart)strokeChart.destroy()

strokeChart=new Chart(document.getElementById("strokeChart"),{

type:"bar",

data:{
labels:labels,
datasets:[{label:"平均秒",data:data}]
}

})

}

function renderSeasonBest(){

let map={}

records.forEach(r=>{

let y=new Date(r.date).getFullYear()

let key=y+"_"+r.event

let sec=timeToSec(r.time)

if(!map[key]||sec<map[key])map[key]=sec

})

let html="<tr><th>年</th><th>種目</th><th>SB</th></tr>"

for(let k in map){

let p=k.split("_")

html+=`
<tr>
<td>${p[0]}</td>
<td>${p[1]}</td>
<td>${secToTime(map[k])}</td>
</tr>
`

}

seasonBest.innerHTML=html

}

function render(){

renderDashboard()
renderTable()
renderBest()
renderFINA()
renderImprove()
renderStroke()
renderSeasonBest()

}

load()

</script>

</body>
</html>
