<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Swim Record Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#eef2f6;color:#222;}
  header{background:#1e73be;color:#fff;padding:18px;font-size:20px;font-weight:700;}
  .container{max-width:1200px;margin:20px auto;padding:20px;}
  .card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,0.08);margin-bottom:20px;}
  h3{margin:0 0 12px 0;}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th{background:#f0f4f8;padding:8px;border-bottom:1px solid #ddd;text-align:center;cursor:default;}
  th.sortable{cursor:pointer;color:#1e73be;}
  td{padding:8px;border-bottom:1px solid #eee;text-align:center;}
  input,select{padding:8px;margin:6px;border-radius:6px;border:1px solid #ccc;}
  button{padding:8px 12px;border-radius:6px;border:none;background:#1e73be;color:#fff;cursor:pointer;margin:6px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .stat{background:#f4f6f9;padding:12px;border-radius:8px;text-align:center;}
  .stat b{display:block;font-size:20px;margin-top:6px;}
  .goalGauge{width:260px;height:260px;margin:10px auto;display:block;}
  .small{font-size:13px;color:#666;margin-top:6px;}
  @media (max-width:700px){ .stats{grid-template-columns:repeat(2,1fr);} }
  .sort-indicator{font-weight:700;margin-left:6px;color:#1e73be;}
</style>
</head>
<body>
<header>Swim Record Dashboard</header>
<div class="container">

  <div class="card">
    <h3>ダッシュボード</h3>
    <div id="stats" class="stats"></div>
  </div>

  <div class="card">
    <h3>記録入力</h3>
    <div>
      <label>日付</label>
      <input id="inputDate" type="date">
      <label>大会</label>
      <input id="inputMeet" placeholder="大会名">
      <label>会場</label>
      <input id="inputVenue" placeholder="会場">
    </div>
    <div>
      <label>コース</label>
      <select id="inputCourse"><option>短水路</option><option>長水路</option></select>
      <label>種目</label>
      <select id="inputEvent">
        <option>自由形50m</option>
        <option>自由形100m</option>
        <option>自由形200m</option>
        <option>背泳ぎ100m</option>
        <option>平泳ぎ100m</option>
        <option>バタフライ100m</option>
        <option>個人メドレー200m</option>
      </select>
      <label>タイム</label>
      <input id="inputTime" placeholder="例 0:23.45 または 23.45">
      <button id="saveRecordBtn">保存</button>
    </div>
    <div class="small">タイムは「m:ss.xx」または「ss.xx」で入力してください。日付が空なら今日の日付が設定されます。</div>
  </div>

  <div class="card">
    <h3>CSV</h3>
    <div>
      <input type="file" id="csvUpload" accept=".csv">
      <button id="importCsvBtn">CSVインポート</button>
      <button id="downloadCsvBtn">CSVダウンロード</button>
    </div>
    <div class="small">CSV列: <b>date,meet,venue,course,event,time</b>（ヘッダ必須）。区切りはカンマ・セミコロン・タブに対応。</div>
  </div>

  <div class="card">
    <h3>目標タイム</h3>
    <div>
      <label>種目</label>
      <select id="goalEventSelect"></select>
      <label>目標タイム</label>
      <input id="goalTimeInput" placeholder="例 0:22.00">
      <button id="saveGoalBtn">保存</button>
    </div>
    <table id="goalTable"></table>
  </div>

  <div class="card">
    <h3>目標達成率</h3>
    <canvas id="goalGauge" class="goalGauge"></canvas>
    <div class="small">ドーナツ中央に <b>目標秒 / ベスト秒（達成率%）</b> を表示します。秒は大きく表示されます。</div>
  </div>

  <div class="card">
    <h3>記録一覧</h3>
    <table id="recordsTable"></table>
  </div>

  <div class="card">
    <h3>ベストタイム</h3>
    <table id="bestTable"></table>
  </div>

  <div class="card">
    <h3>記録推移</h3>
    <div>
      <label>種目選択</label>
      <select id="graphEventSelect"></select>
    </div>
    <canvas id="chartCanvas"></canvas>
  </div>

  <div class="card">
    <h3>FINAポイント推移</h3>
    <canvas id="finaCanvas"></canvas>
  </div>

  <div class="card">
    <h3>改善率</h3>
    <canvas id="improveCanvas"></canvas>
  </div>

  <div class="card">
    <h3>泳法別平均</h3>
    <canvas id="strokeCanvas"></canvas>
  </div>

  <div class="card">
    <h3>シーズンベスト</h3>
    <table id="seasonBestTable"></table>
  </div>

</div>

<script>
/* ===== データ ===== */
let records = [];
let goals = {};
let currentSort = { key: 'date', dir: 'desc' }; // 初期は日付降順（最新上）
const CHART_COLORS = ['#1e73be','#ff7f50','#4caf50','#f39c12','#9b59b6','#e74c3c'];
const finaBase = {
  "自由形50m":21.04,"自由形100m":46.86,"自由形200m":102,
  "背泳ぎ100m":51.6,"平泳ぎ100m":56.88,"バタフライ100m":49.45
};

/* ===== DOM ===== */
const inputDate = document.getElementById('inputDate');
const inputMeet = document.getElementById('inputMeet');
const inputVenue = document.getElementById('inputVenue');
const inputCourse = document.getElementById('inputCourse');
const inputEvent = document.getElementById('inputEvent');
const inputTime = document.getElementById('inputTime');
const saveRecordBtn = document.getElementById('saveRecordBtn');

const csvUpload = document.getElementById('csvUpload');
const importCsvBtn = document.getElementById('importCsvBtn');
const downloadCsvBtn = document.getElementById('downloadCsvBtn');

const goalEventSelect = document.getElementById('goalEventSelect');
const goalTimeInput = document.getElementById('goalTimeInput');
const saveGoalBtn = document.getElementById('saveGoalBtn');
const goalTable = document.getElementById('goalTable');

const statsDiv = document.getElementById('stats');
const recordsTable = document.getElementById('recordsTable');
const bestTable = document.getElementById('bestTable');
const seasonBestTable = document.getElementById('seasonBestTable');

const goalGaugeCanvas = document.getElementById('goalGauge');
const chartCanvas = document.getElementById('chartCanvas');
const finaCanvas = document.getElementById('finaCanvas');
const improveCanvas = document.getElementById('improveCanvas');
const strokeCanvas = document.getElementById('strokeCanvas');

let goalChart, mainChart, finaChart, improveChart, strokeChart;

/* ===== Chart.js 中央テキストプラグイン（行ごとにサイズ指定可） ===== */
const centerLinesPlugin = {
  id: 'centerLinesPlugin',
  afterDraw(chart) {
    const cfg = chart.config.options.plugins && chart.config.options.plugins.centerLines;
    if(!cfg || !cfg.lines) return;
    const ctx = chart.ctx;
    ctx.save();
    const centerX = (chart.chartArea.left + chart.chartArea.right) / 2;
    const centerY = (chart.chartArea.top + chart.chartArea.bottom) / 2;
    const lines = cfg.lines;
    // 合計高さを計算して中央揃え
    const totalHeight = lines.reduce((sum, ln) => sum + (ln.size || 14) + (ln.spacing || 4), - (lines[lines.length-1].spacing || 4));
    let y = centerY - totalHeight/2;
    lines.forEach(ln=>{
      ctx.fillStyle = ln.color || '#111';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `${ln.weight || ''} ${ln.size || 14}px ${ln.font || 'Arial'}`;
      ctx.fillText(ln.text || '', centerX, y + (ln.size || 14)/2);
      y += (ln.size || 14) + (ln.spacing || 4);
    });
    ctx.restore();
  }
};
Chart.register(centerLinesPlugin);

/* ===== CSV ユーティリティ ===== */
function stripBOM(s){ return s.replace(/^\uFEFF/, ''); }
function detectDelimiter(sample){
  const counts = {',':0,';':0,'\t':0};
  const lines = sample.split(/\r?\n/).slice(0,5);
  lines.forEach(l=>{
    counts[','] += (l.match(/,/g)||[]).length;
    counts[';'] += (l.match(/;/g)||[]).length;
    counts['\t'] += (l.match(/\t/g)||[]).length;
  });
  let max = ',', maxv = counts[','];
  Object.keys(counts).forEach(k=>{ if(counts[k] > maxv){ max = k; maxv = counts[k]; }});
  return max;
}
function parseCSVText(text){
  text = stripBOM(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(!text) return {header:[], rows:[]};
  const delim = detectDelimiter(text);
  const rows = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    const next = text[i+1] || '';
    if(ch === '"'){
      if(inQuotes && next === '"'){ cur += '"'; i++; continue; }
      inQuotes = !inQuotes;
      continue;
    }
    if(!inQuotes && ch === '\n'){ rows.push(cur); cur = ''; continue; }
    cur += ch;
  }
  if(cur !== '') rows.push(cur);
  const parsed = rows.map(line=>{
    const fields = [];
    let field = '', q = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      const next = line[i+1] || '';
      if(ch === '"'){
        if(q && next === '"'){ field += '"'; i++; continue; }
        q = !q; continue;
      }
      if(!q && line.substr(i, delim.length) === delim){
        fields.push(field); field = ''; i += delim.length - 1; continue;
      }
      field += ch;
    }
    fields.push(field);
    return fields.map(f=>f.trim().replace(/\u3000/g,' ').replace(/　/g,' ').replace(/\uFF0C/g,','));
  });
  const header = parsed.shift() || [];
  return {header, rows: parsed};
}
function readFileWithEncodings(file, callback){
  const reader = new FileReader();
  reader.onload = e => { callback(String(e.target.result)); };
  reader.readAsText(file, 'utf-8');
  const reader2 = new FileReader();
  reader2.onload = e => {
    const ab = e.target.result;
    try { const dec1 = new TextDecoder('shift_jis'); callback(dec1.decode(ab)); return; } catch(err){}
    try { const dec2 = new TextDecoder('windows-31j'); callback(dec2.decode(ab)); return; } catch(err){}
  };
  reader2.readAsArrayBuffer(file);
}

/* ===== 永続化 ===== */
function saveStorage(){ localStorage.setItem('swimRecords', JSON.stringify(records)); localStorage.setItem('swimGoals', JSON.stringify(goals)); }
function loadStorage(){ records = JSON.parse(localStorage.getItem('swimRecords')) || []; goals = JSON.parse(localStorage.getItem('swimGoals')) || {}; }

/* ===== 時間変換 ===== */
function timeToSec(t){
  if(t === null || t === undefined) return NaN;
  t = String(t).trim();
  if(t === '') return NaN;
  if(t.includes(':')){
    const parts = t.split(':');
    const m = parseInt(parts[0].replace(/[^\d]/g,''),10) || 0;
    const s = parseFloat(parts[1].replace(/[^\d.]/g,'')) || 0;
    return m*60 + s;
  }
  const v = parseFloat(t.replace(/[^\d.]/g,''));
  return isNaN(v) ? NaN : v;
}
function secToTime(s){
  if(isNaN(s) || s === Infinity) return '-';
  s = Number(s);
  const m = Math.floor(s/60);
  const sec = (s - m*60).toFixed(2).padStart(5,'0');
  if(m>0) return `${m}:${sec}`;
  return `${sec}`;
}

/* ===== FINA ===== */
function finaPoint(eventName, timeStr){
  const base = finaBase[eventName];
  if(!base) return '-';
  const sec = timeToSec(timeStr);
  if(isNaN(sec) || sec <= 0) return '-';
  return Math.round(1000 * Math.pow(base / sec, 3));
}

/* ===== レコード操作 ===== */
function addRecord(){
  const date = inputDate.value || new Date().toISOString().slice(0,10);
  const meet = inputMeet.value.trim();
  const venue = inputVenue.value.trim();
  const course = inputCourse.value;
  const eventName = inputEvent.value;
  const time = inputTime.value.trim();
  const sec = timeToSec(time);
  if(isNaN(sec) || sec <= 0){ alert('正しいタイムを入力してください（例 0:23.45 または 23.45）'); return; }
  records.push({date, meet, venue, course, event: eventName, time});
  sortRecords(currentSort.key, currentSort.dir);
  saveStorage(); renderAll(); inputTime.value = '';
}
function editRecord(index){
  const r = records[index]; if(!r) return;
  inputDate.value = r.date; inputMeet.value = r.meet; inputVenue.value = r.venue;
  inputCourse.value = r.course; inputEvent.value = r.event; inputTime.value = r.time;
  records.splice(index,1); saveStorage(); renderAll();
}
function deleteRecord(index){ if(!confirm('削除しますか？')) return; records.splice(index,1); saveStorage(); renderAll(); }

/* ===== CSV インポート ===== */
function importCSVFileEnhanced(file){
  readFileWithEncodings(file, (text) => {
    if(!text){ alert('ファイルの読み込みに失敗しました'); return; }
    const parsed = parseCSVText(text);
    if(!parsed.header || parsed.header.length === 0){ alert('CSVのヘッダが見つかりません'); console.log(parsed); return; }
    const header = parsed.header.map(h=>h.toLowerCase());
    const required = ['date','meet','venue','course','event','time'];
    const missing = required.filter(r=>!header.includes(r));
    if(missing.length){ alert('CSVに必要な列がありません: ' + missing.join(', ')); console.log('header', parsed.header); return; }
    const idx = {}; header.forEach((h,i)=> idx[h]=i);
    const newRecords = [];
    parsed.rows.forEach((cols, rowIndex)=>{
      if(cols.length < header.length){ console.warn('行スキップ: 列数不足', rowIndex+2, cols); return; }
      const r = {
        date: (cols[idx['date']]||'').trim(),
        meet: (cols[idx['meet']]||'').trim(),
        venue: (cols[idx['venue']]||'').trim(),
        course: (cols[idx['course']]||'').trim(),
        event: (cols[idx['event']]||'').trim(),
        time: (cols[idx['time']]||'').trim()
      };
      if(!r.date || isNaN(new Date(r.date).getTime())){ console.warn('行スキップ: 日付不正', rowIndex+2, r); return; }
      if(isNaN(timeToSec(r.time))){ console.warn('行スキップ: タイム不正', rowIndex+2, r); return; }
      newRecords.push(r);
    });
    if(newRecords.length === 0){ alert('有効なレコードが見つかりませんでした。コンソールを確認してください。'); console.log(parsed); return; }
    records = records.concat(newRecords);
    sortRecords(currentSort.key, currentSort.dir);
    saveStorage(); renderAll(); alert(`${newRecords.length} 件をインポートしました`);
  });
}

/* ===== 目標管理 ===== */
function saveGoal(){ const e = goalEventSelect.value; const t = goalTimeInput.value.trim(); if(!e){ alert('種目を選択してください'); return; } if(isNaN(timeToSec(t))){ alert('正しい目標タイムを入力してください'); return; } goals[e] = t; saveStorage(); renderAll(); }
function deleteGoal(e){ if(goals[e] && confirm(`${e} の目標を削除しますか？`)){ delete goals[e]; saveStorage(); renderAll(); } }

/* ===== ソート機能 ===== */
function sortRecords(key, dir){
  currentSort.key = key;
  currentSort.dir = dir || (currentSort.dir === 'asc' ? 'desc' : 'asc');
  records.sort((a,b)=>{
    let va = a[key], vb = b[key];
    if(key === 'date'){ va = new Date(a.date).getTime(); vb = new Date(b.date).getTime(); }
    if(va < vb) return currentSort.dir === 'asc' ? -1 : 1;
    if(va > vb) return currentSort.dir === 'asc' ? 1 : -1;
    return 0;
  });
  renderTable();
}

/* ===== レンダリング ===== */
function renderDashboard(){
  const races = records.length;
  const meets = new Set(records.map(r=>r.meet)).size;
  const times = records.map(r=>timeToSec(r.time)).filter(v=>!isNaN(v));
  const avgSec = times.length ? (times.reduce((a,b)=>a+b,0)/times.length) : NaN;
  const bestSec = times.length ? Math.min(...times) : NaN;
  const latestSec = times.length ? times[times.length-1] : NaN;
  statsDiv.innerHTML = `
    <div class="stat">レース数<b>${races}</b></div>
    <div class="stat">大会数<b>${meets}</b></div>
    <div class="stat">平均<b>${isNaN(avgSec)?'-':secToTime(avgSec)}</b></div>
    <div class="stat">ベスト<b>${isNaN(bestSec)?'-':secToTime(bestSec)}</b></div>
    <div class="stat">最新<b>${isNaN(latestSec)?'-':secToTime(latestSec)}</b></div>
  `;
}

function renderTable(){
  // ヘッダ: 日付はソート可能
  const dir = currentSort.key === 'date' ? (currentSort.dir === 'asc' ? '▲' : '▼') : '';
  let html = `<tr>
    <th class="sortable" onclick="toggleSort('date')">日付<span class="sort-indicator">${dir}</span></th>
    <th>大会</th><th>会場</th><th>コース</th><th>種目</th><th>タイム</th><th>FINA</th><th></th></tr>`;
  records.forEach((r,i)=>{
    const goal = goals[r.event];
    let diffHtml = '';
    if(goal){
      const d = (timeToSec(r.time) - timeToSec(goal));
      if(!isNaN(d)) diffHtml = d <= 0 ? `<span style="color:green;font-weight:bold">達成</span>` : `<span style="color:red">あと ${d.toFixed(2)}s</span>`;
    }
    html += `<tr>
      <td>${r.date}</td><td>${r.meet}</td><td>${r.venue}</td><td>${r.course}</td><td>${r.event}</td>
      <td>${r.time} ${diffHtml}</td><td>${finaPoint(r.event, r.time)}</td>
      <td><button onclick="editRecord(${i})">編集</button><button onclick="deleteRecord(${i})">削除</button></td>
    </tr>`;
  });
  recordsTable.innerHTML = html;
}
function toggleSort(key){
  const newDir = (currentSort.key === key && currentSort.dir === 'asc') ? 'desc' : 'asc';
  sortRecords(key, newDir);
  renderTable();
}

function renderBest(){
  const best = {};
  records.forEach(r=>{
    const sec = timeToSec(r.time); if(isNaN(sec)) return;
    if(!best[r.event] || sec < best[r.event].sec) best[r.event] = {time: r.time, sec};
  });
  let html = `<tr><th>種目</th><th>ベスト</th></tr>`;
  Object.keys(best).sort().forEach(e=> html += `<tr><td>${e}</td><td>${best[e].time}</td></tr>`);
  bestTable.innerHTML = html;
}

function renderGoalGauge(){
  const e = goalEventSelect.value;
  if(!e || !goals[e]){ if(goalChart){ goalChart.destroy(); goalChart = null; } return; }
  const bestTimes = records.filter
