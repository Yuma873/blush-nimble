<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swim Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#2c3e50;
color:white;
padding:15px;
font-size:20px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:6px;
border-bottom:1px solid #ddd;
text-align:center;
}

input,select,button{
padding:6px;
margin:4px;
}

button{
background:#1abc9c;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#16a085;
}

</style>
</head>

<body>

<header>
Swim Analytics Dashboard
</header>

<div class="container">

<div class="card">

<h2>記録入力</h2>

<input type="date" id="date">

<select id="event">

<option>50m自由形</option>
<option>100m自由形</option>
<option>200m自由形</option>
<option>50m背泳ぎ</option>
<option>100m背泳ぎ</option>
<option>200m背泳ぎ</option>
<option>50m平泳ぎ</option>
<option>100m平泳ぎ</option>
<option>200m平泳ぎ</option>
<option>50mバタフライ</option>
<option>100mバタフライ</option>
<option>200mバタフライ</option>

</select>

<input placeholder="タイム 例 55.32 / 1:55.20" id="time">

<input placeholder="目標タイム" id="target">

<button onclick="addRecord()">追加</button>

</div>

<div class="card">

<h2>ベストタイム</h2>

<table id="bestTable"></table>

</div>

<div class="card">

<h2>目標達成率</h2>

<canvas id="goalGauge"></canvas>

<div id="goalText"></div>

</div>

<div class="card">

<h2>記録推移</h2>

<canvas id="recordChart"></canvas>

</div>

<div class="card">

<h2>FINAポイント推移</h2>

<canvas id="finaChart"></canvas>

</div>

<div class="card">

<h2>改善率</h2>

<canvas id="improveChart"></canvas>

</div>

<div class="card">

<h2>泳法別平均</h2>

<canvas id="strokeChart"></canvas>

</div>

<div class="card">

<h2>シーズンベスト</h2>

<table id="seasonBest"></table>

</div>

</div>

<script>

let records=[]

function timeToSec(t){

if(t.includes(":")){
let p=t.split(":")
return Number(p[0])*60+Number(p[1])
}

return Number(t)

}

function secToTime(sec){

let m=Math.floor(sec/60)
let s=(sec%60).toFixed(2)

if(m>0)return m+":"+s
return s

}

function addRecord(){

let r={
date:date.value,
event:event.value,
time:time.value,
target:target.value
}

records.push(r)

renderAll()

}

function renderBest(){

let best={}

records.forEach(r=>{

let sec=timeToSec(r.time)

if(!best[r.event]||sec<best[r.event]){

best[r.event]=sec

}

})

let html="<tr><th>種目</th><th>BEST</th></tr>"

Object.keys(best).sort().forEach(e=>{

html+=`
<tr>
<td>${e}</td>
<td>${secToTime(best[e])}</td>
</tr>
`

})

bestTable.innerHTML=html

}

function renderGoal(){

let best=Infinity
let target=null

records.forEach(r=>{

if(!r.target)return

let sec=timeToSec(r.time)
let tar=timeToSec(r.target)

if(sec<best){

best=sec
target=tar

}

})

if(!target)return

let rate=(target/best)*100
let remain=best-target

goalText.innerHTML=
"あと "+Math.abs(remain).toFixed(2)+" 秒"

new Chart(goalGauge,{

type:"doughnut",

data:{
datasets:[{
data:[Math.min(rate,100),100-Math.min(rate,100)]
}]
},

options:{cutout:"70%"}

})

}

function renderImprove(){

let map={}

records.forEach(r=>{

if(!map[r.event])map[r.event]=[]

map[r.event].push(r)

})

let labels=[]
let data=[]

for(let e in map){

let arr=map[e].sort((a,b)=>new Date(a.date)-new Date(b.date))

if(arr.length<2)continue

let first=timeToSec(arr[0].time)
let last=timeToSec(arr[arr.length-1].time)

let improve=(first-last)/first*100

labels.push(e)
data.push(improve.toFixed(1))

}

new Chart(improveChart,{
type:"bar",
data:{labels:labels,datasets:[{label:"改善率%",data:data}]}
})

}

function renderSeasonBest(){

let map={}

records.forEach(r=>{

let y=new Date(r.date).getFullYear()

let key=y+"_"+r.event

let sec=timeToSec(r.time)

if(!map[key]||sec<map[key]){

map[key]=sec

}

})

let html="<tr><th>年</th><th>種目</th><th>SB</th></tr>"

for(let k in map){

let p=k.split("_")

html+=`
<tr>
<td>${p[0]}</td>
<td>${p[1]}</td>
<td>${secToTime(map[k])}</td>
</tr>
`

}

seasonBest.innerHTML=html

}

function renderStroke(){

let map={}

records.forEach(r=>{

let stroke=r.event.replace(/[0-9]/g,"")

let sec=timeToSec(r.time)

if(!map[stroke])map[stroke]=[]

map[stroke].push(sec)

})

let labels=[]
let data=[]

for(let s in map){

let avg=map[s].reduce((a,b)=>a+b)/map[s].length

labels.push(s)
data.push(avg)

}

new Chart(strokeChart,{
type:"bar",
data:{labels:labels,datasets:[{label:"平均秒",data:data}]}
})

}

function renderRecordChart(){

let arr=records.sort((a,b)=>new Date(a.date)-new Date(b.date))

let labels=arr.map(r=>r.date)
let data=arr.map(r=>timeToSec(r.time))

new Chart(recordChart,{
type:"line",
data:{labels:labels,datasets:[{label:"タイム",data:data}]}
})

}

function finaPoint(time){

let base=50

return Math.round(1000*(base/time))

}

function renderFINA(){

let arr=records.sort((a,b)=>new Date(a.date)-new Date(b.date))

let labels=[]
let data=[]

arr.forEach(r=>{

labels.push(r.date)

data.push(finaPoint(timeToSec(r.time)))

})

new Chart(finaChart,{
type:"line",
data:{labels:labels,datasets:[{label:"FINAポイント",data:data}]}
})

}

function renderAll(){

renderBest()

renderGoal()

renderImprove()

renderSeasonBest()

renderStroke()

renderRecordChart()

renderFINA()

}

</script>

</body>
</html>
