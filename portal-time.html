<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Swim Record</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:sans-serif;
background:#f5f5f5;
margin:20px;
}

h1{
margin-bottom:10px;
}

.card{
background:white;
padding:15px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

input,select,button{
padding:6px;
margin:4px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #ddd;
padding:6px;
text-align:center;
}

.stats{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.stat{
background:#ecf0f1;
padding:10px;
border-radius:8px;
min-width:120px;
text-align:center;
}

canvas{
background:white;
}

</style>
</head>

<body>

<h1>水泳記録管理</h1>

<div class="card">

<h3>記録入力</h3>

<input type="date" id="date">

<input placeholder="大会名" id="meet">

<input placeholder="会場" id="venue">

<select id="course">
<option>SC</option>
<option>LC</option>
</select>

<select id="event">
<option>50Fr</option>
<option>100Fr</option>
<option>200Fr</option>
<option>400Fr</option>
<option>800Fr</option>
<option>1500Fr</option>

<option>50Ba</option>
<option>100Ba</option>
<option>200Ba</option>

<option>50Br</option>
<option>100Br</option>
<option>200Br</option>

<option>50Fly</option>
<option>100Fly</option>
<option>200Fly</option>

<option>200IM</option>
<option>400IM</option>
</select>

<input placeholder="秒 (例 27.34)" id="time">

<button onclick="addRecord()">追加</button>

</div>


<div class="card">

<h3>CSV</h3>

<button onclick="downloadCSV()">CSV保存</button>

<input type="file" onchange="loadCSV(event)">

</div>


<div class="card">

<h3>目標タイム</h3>

<select id="goalEvent"></select>

<input id="goalTime" placeholder="秒">

<button onclick="setGoal()">設定</button>

</div>


<div class="card">

<h3>統計</h3>

<div class="stats" id="stats"></div>

</div>


<div class="card">

<h3>記録推移</h3>

<canvas id="progressChart"></canvas>

</div>


<div class="card">

<h3>改善率</h3>

<canvas id="improveChart"></canvas>

</div>


<div class="card">

<h3>泳法別平均</h3>

<canvas id="styleChart"></canvas>

</div>


<div class="card">

<h3>シーズンベスト</h3>

<div id="seasonBest"></div>

</div>


<div class="card">

<h3>記録一覧</h3>

<table>

<thead>
<tr>
<th>日付</th>
<th>大会</th>
<th>会場</th>
<th>コース</th>
<th>種目</th>
<th>タイム</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>



<script>

let records=[]
let goals={}

function save(){
localStorage.setItem("swim_records",JSON.stringify(records))
localStorage.setItem("swim_goals",JSON.stringify(goals))
}

function load(){

records=JSON.parse(localStorage.getItem("swim_records")||"[]")
goals=JSON.parse(localStorage.getItem("swim_goals")||"{}")

document.getElementById("goalEvent").innerHTML=
document.getElementById("event").innerHTML

update()

}

function addRecord(){

let r={
date:date.value,
meet:meet.value,
venue:venue.value,
course:course.value,
event:event.value,
time:parseFloat(time.value)
}

records.push(r)

save()

update()

}

function update(){

records.sort((a,b)=>new Date(a.date)-new Date(b.date))

let tbody=document.getElementById("table")
tbody.innerHTML=""

records.forEach(r=>{

let tr=document.createElement("tr")

tr.innerHTML=`
<td>${r.date}</td>
<td>${r.meet}</td>
<td>${r.venue}</td>
<td>${r.course}</td>
<td>${r.event}</td>
<td>${r.time}</td>
`

tbody.appendChild(tr)

})

updateStats()
drawCharts()

}


function updateStats(){

let races=records.length

let meets=[...new Set(records.map(r=>r.meet))].length

let times=records.map(r=>r.time)

let best=Math.min(...times)

let latest=times[times.length-1]

let avg=(times.reduce((a,b)=>a+b,0)/times.length).toFixed(2)

let improve=((times[0]-times[times.length-1])).toFixed(2)

let html=`

<div class="stat">レース数<br>${races}</div>
<div class="stat">大会数<br>${meets}</div>
<div class="stat">平均<br>${avg}</div>
<div class="stat">ベスト<br>${best}</div>
<div class="stat">最新<br>${latest}</div>
<div class="stat">改善<br>${improve}</div>

`

document.getElementById("stats").innerHTML=html

}


function drawCharts(){

drawProgress()

drawImprove()

drawStyle()

drawSeason()

}



function drawProgress(){

let ctx=document.getElementById("progressChart")

let labels=records.map(r=>r.date)

let data=records.map(r=>r.time)

let goalLine=records.map(r=>goals[r.event]||null)

new Chart(ctx,{
type:"line",
data:{
labels:labels,
datasets:[
{
label:"タイム",
data:data
},
{
label:"目標",
data:goalLine,
borderDash:[5,5]
}
]
}
})

}


function drawImprove(){

let ctx=document.getElementById("improveChart")

let data=[]

for(let i=1;i<records.length;i++){

data.push(records[i-1].time-records[i].time)

}

new Chart(ctx,{
type:"bar",
data:{
labels:data.map((_,i)=>i+1),
datasets:[{label:"改善秒",data:data}]
}
})

}



function drawStyle(){

let ctx=document.getElementById("styleChart")

let styles={Fr:[],Ba:[],Br:[],Fly:[],IM:[]}

records.forEach(r=>{

let s=r.event.replace(/[0-9]/g,'')

styles[s].push(r.time)

})

let avg={}

for(let s in styles){

if(styles[s].length>0){

avg[s]=styles[s].reduce((a,b)=>a+b)/styles[s].length

}

}

new Chart(ctx,{
type:"bar",
data:{
labels:Object.keys(avg),
datasets:[{data:Object.values(avg)}]
}
})

}


function drawSeason(){

let year=new Date().getFullYear()

let season=records.filter(r=>r.date.startsWith(year))

let best={}

season.forEach(r=>{

if(!best[r.event]||r.time<best[r.event]){

best[r.event]=r.time

}

})

let html=""

for(let e in best){

html+=`${e} : ${best[e]}<br>`

}

document.getElementById("seasonBest").innerHTML=html

}


function setGoal(){

goals[goalEvent.value]=parseFloat(goalTime.value)

save()

update()

}


function downloadCSV(){

let csv="date,meet,venue,course,event,time\n"

records.forEach(r=>{

csv+=`${r.date},${r.meet},${r.venue},${r.course},${r.event},${r.time}\n`

})

let blob=new Blob([csv])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="swim_records.csv"

a.click()

}


function loadCSV(e){

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

let lines=reader.result.split("\n")

lines.slice(1).forEach(l=>{

let c=l.split(",")

if(c.length>=6){

records.push({
date:c[0],
meet:c[1],
venue:c[2],
course:c[3],
event:c[4],
time:parseFloat(c[5])
})

}

})

save()

update()

}

reader.readAsText(file)

}


load()

</script>

</body>
</html>
