<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Swim Record Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#eef2f6;
  color:#222;
}
header{
  background:#1e73be;
  color:white;
  padding:18px;
  font-size:20px;
  font-weight:bold;
}
.container{
  padding:25px;
  max-width:1200px;
  margin:auto;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:25px;
  border-radius:12px;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);
}
h3{margin-top:0;}
table{width:100%;border-collapse:collapse;}
th{background:#f0f4f8;}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:center;}
th.sortable{cursor:pointer;color:#1e73be;}
input,select{padding:7px;margin:5px;border-radius:6px;border:1px solid #ccc;}
button{padding:7px 12px;border:none;background:#1e73be;color:white;border-radius:6px;cursor:pointer;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;}
.stat{background:#f4f6f9;padding:15px;border-radius:8px;font-size:18px;text-align:center;}
.stat b{display:block;font-size:24px;margin-top:5px;}
.goalGauge{width:200px;height:200px;margin:auto;display:block;}
.goalGood{color:green;font-weight:bold;}
.goalBad{color:red;}
.small{font-size:13px;color:#666;}
.undo-area{display:inline-block;margin-left:12px;}
.danger{background:#e74c3c;}
@media (max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr);}
}
.sort-indicator{font-weight:700;margin-left:6px;color:#1e73be;}
</style>
</head>

<body>

<header>Swim Record Dashboard</header>

<div class="container">

<div class="card">
<h3>ダッシュボード</h3>
<div class="stats" id="stats"></div>
</div>

<div class="card">
<h3>記録入力</h3>

<input id="date" type="date">
<input id="meet" placeholder="大会名">
<input id="venue" placeholder="会場">

<select id="course">
<option>短水路</option>
<option>長水路</option>
</select>

<select id="event">
<option>自由形50m</option>
<option>自由形100m</option>
<option>自由形200m</option>
<option>背泳ぎ100m</option>
<option>平泳ぎ100m</option>
<option>バタフライ100m</option>
<option>個人メドレー200m</option>
</select>

<input id="time" placeholder="タイム">

<button id="saveBtn">保存</button>

</div>

<div class="card">
<h3>CSV / 全消去</h3>
<input type="file" id="csvUpload">
<button id="importCsvBtn">CSVインポート</button>
<button id="downloadCsvBtn">CSVダウンロード</button>
<button id="clearRecordsBtn" class="danger">全記録削除</button>
<button id="clearAllBtn" class="danger">全データ削除</button>
<span class="undo-area" id="undoArea" style="display:none;">
  <button id="undoBtn">元に戻す</button>
</span>
<div class="small">CSV列: date,meet,venue,course,event,time（ヘッダ必須）。全消去は取り消し可能です。</div>
</div>

<div class="card">
<h3>目標タイム</h3>

<select id="goalEvent"></select>
<input id="goalTime" placeholder="目標タイム">

<button id="saveGoalBtn">保存</button>

<table id="goalTable"></table>

</div>

<div class="card">
<h3>目標達成率</h3>
<canvas id="goalGauge" class="goalGauge"></canvas>
</div>

<div class="card">
<h3>記録一覧</h3>

<table id="recordsTable"></table>

</div>

<div class="card">
<h3>ベストタイム</h3>
<table id="bestTable"></table>
</div>

<div class="card">
<h3>記録推移</h3>

<select id="graphEvent"></select>

<canvas id="chart"></canvas>

</div>

<div class="card">
<h3>FINAポイント推移</h3>
<canvas id="finaChart"></canvas>
</div>

<div class="card">
<h3>改善率</h3>
<canvas id="improveChart"></canvas>
</div>

<div class="card">
<h3>泳法別平均（泳法 × 距離）</h3>
<canvas id="strokeChart"></canvas>
</div>

<div class="card">
<h3>シーズンベスト</h3>
<table id="seasonBest"></table>
</div>

</div>

<script>
/* ===== original working code + minimal "clear" feature (undoable) ===== */

let records=[]
let goals={}

let chart=null, finaChart=null, improveChart=null, strokeChart=null, goalChart=null

let currentSort = { key: 'date', dir: 'desc' } // default: newest first

const finaBase={
"自由形50m":21.04,
"自由形100m":46.86,
"自由形200m":102,
"背泳ぎ100m":51.6,
"平泳ぎ100m":56.88,
"バタフライ100m":49.45
}

/* canvas contexts */
const goalGaugeCanvas = document.getElementById('goalGauge')
const chartCanvas = document.getElementById('chart')
const finaCanvas = document.getElementById('finaChart')
const improveCanvas = document.getElementById('improveChart')
const strokeCanvas = document.getElementById('strokeChart')

/* DOM */
const dateInput = document.getElementById('date')
const meetInput = document.getElementById('meet')
const venueInput = document.getElementById('venue')
const courseInput = document.getElementById('course')
const eventSelect = document.getElementById('event')
const timeInput = document.getElementById('time')
const saveBtn = document.getElementById('saveBtn')

const csvUpload = document.getElementById('csvUpload')
const importCsvBtn = document.getElementById('importCsvBtn')
const downloadCsvBtn = document.getElementById('downloadCsvBtn')
const clearRecordsBtn = document.getElementById('clearRecordsBtn')
const clearAllBtn = document.getElementById('clearAllBtn')
const undoArea = document.getElementById('undoArea')
const undoBtn = document.getElementById('undoBtn')

const goalEventSelect = document.getElementById('goalEvent')
const goalTimeInput = document.getElementById('goalTime')
const saveGoalBtn = document.getElementById('saveGoalBtn')
const goalTable = document.getElementById('goalTable')

const statsDiv = document.getElementById('stats')
const recordsTable = document.getElementById('recordsTable')
const bestTable = document.getElementById('bestTable')
const seasonBestTable = document.getElementById('seasonBest')

const graphEventSelect = document.getElementById('graphEvent')

/* undo backup */
let lastBackup = null
function setBackup(){
  lastBackup = { records: JSON.parse(JSON.stringify(records)), goals: JSON.parse(JSON.stringify(goals)) }
  undoArea.style.display = 'inline-block'
  if(window._undoTimeout) clearTimeout(window._undoTimeout)
  window._undoTimeout = setTimeout(()=>{ undoArea.style.display = 'none'; lastBackup = null }, 20000)
}
function undoClear(){
  if(!lastBackup) return
  records = lastBackup.records
  goals = lastBackup.goals
  lastBackup = null
  undoArea.style.display = 'none'
  if(window._undoTimeout) clearTimeout(window._undoTimeout)
  save()
  populateSelects()
  render()
}

/* persistence */
function save(){
  localStorage.setItem("swimRecords",JSON.stringify(records))
  localStorage.setItem("swimGoals",JSON.stringify(goals))
}

function load(){
  records=JSON.parse(localStorage.getItem("swimRecords"))||[]
  goals=JSON.parse(localStorage.getItem("swimGoals"))||{}

  // populate selects
  populateSelects()

  // apply initial sort
  sortRecords(currentSort.key, currentSort.dir)

  render()
}

/* time utils */
function timeToSec(t){
  if(!t)return NaN
  t=String(t).trim()
  if(t.includes(":")){
    let p=t.split(":")
    return parseFloat(p[0])*60+parseFloat(p[1])
  }
  return parseFloat(t)
}

function secToTime(s){
  if(isNaN(s)) return '-'
  let m=Math.floor(s/60)
  let sec=(s%60).toFixed(2)
  if(m>0)return m+":"+sec
  return sec
}

/* FINA */
function finaPoint(event,time){
  let base=finaBase[event]
  if(!base)return "-"
  let sec=timeToSec(time)
  if(isNaN(sec) || sec<=0) return "-"
  return Math.round(1000*Math.pow(base/sec,3))
}

/* CRUD */
function addRecord(){
  const d = dateInput.value || new Date().toISOString().slice(0,10)
  const r = {
    date: d,
    meet: meetInput.value.trim(),
    venue: venueInput.value.trim(),
    course: courseInput.value,
    event: eventSelect.value,
    time: timeInput.value.trim()
  }
  const sec = timeToSec(r.time)
  if(isNaN(sec) || sec<=0){ alert('正しいタイムを入力してください'); return }
  records.push(r)
  sortRecords(currentSort.key, currentSort.dir)
  save()
  populateSelects()
  render()
  timeInput.value=''
}

function deleteRecord(i){
  if(!confirm("削除しますか？"))return
  records.splice(i,1)
  save()
  populateSelects()
  render()
}

function editRecord(i){
  let r=records[i]
  dateInput.value=r.date
  meetInput.value=r.meet
  venueInput.value=r.venue
  courseInput.value=r.course
  eventSelect.value=r.event
  timeInput.value=r.time
  records.splice(i,1)
  save()
  populateSelects()
  render()
}

/* clear functions (minimal) */
function clearAllRecords(){
  if(records.length === 0){ alert('記録はありません'); return }
  if(!confirm('すべての記録を削除しますか？（取り消し可能）')) return
  setBackup()
  records = []
  save()
  populateSelects()
  render()
  alert('すべての記録を削除しました。元に戻すには「元に戻す」を押してください（20秒）')
}

function clearAllData(){
  if(records.length === 0 && Object.keys(goals).length === 0){ alert('データは既に空です'); return }
  if(!confirm('すべての記録と目標を削除しますか？（取り消し可能）')) return
  setBackup()
  records = []
  goals = {}
  save()
  populateSelects()
  render()
  alert('すべてのデータを削除しました。元に戻すには「元に戻す」を押してください（20秒）')
}

/* sorting */
function sortRecords(key, dir){
  if(key) currentSort.key = key
  if(dir) currentSort.dir = dir
  records.sort((a,b)=>{
    let va=a[currentSort.key], vb=b[currentSort.key]
    if(currentSort.key==='date'){ va=new Date(a.date).getTime(); vb=new Date(b.date).getTime() }
    if(va < vb) return currentSort.dir==='asc' ? -1 : 1
    if(va > vb) return currentSort.dir==='asc' ? 1 : -1
    return 0
  })
}

/* render functions */
function renderDashboard(){
  let races=records.length
  let meets=new Set(records.map(r=>r.meet)).size
  let times=records.map(r=>timeToSec(r.time)).filter(v=>!isNaN(v))
  let avg=(times.reduce((a,b)=>a+b,0)/times.length||0)
  let best=times.length?Math.min(...times):NaN
  let latest=times.length?times[times.length-1]:NaN

  statsDiv.innerHTML=`
  <div class="stat">レース数<b>${races}</b></div>
  <div class="stat">大会数<b>${meets}</b></div>
  <div class="stat">平均<b>${isNaN(avg)?'-':secToTime(avg)}</b></div>
  <div class="stat">ベスト<b>${isNaN(best)?'-':secToTime(best)}</b></div>
  <div class="stat">最新<b>${isNaN(latest)?'-':secToTime(latest)}</b></div>
  `
}

function renderTable(){
  const dirSymbol = currentSort.key==='date' ? (currentSort.dir==='asc' ? '▲' : '▼') : ''
  let t=recordsTable
  t.innerHTML=`<tr>
    <th class="sortable" onclick="toggleSort('date')">日付<span class="sort-indicator">${dirSymbol}</span></th>
    <th>大会</th><th>種目</th><th>タイム</th><th>FINA</th><th></th></tr>`

  records.forEach((r,i)=>{
    let goal=goals[r.event]
    let diff=""
    if(goal){
      let d=(timeToSec(r.time)-timeToSec(goal)).toFixed(2)
      diff=d<=0?`<span class="goalGood">達成</span>`:`<span class="goalBad">あと${d}s</span>`
    }
    t.innerHTML+=`
    <tr>
    <td>${r.date}</td>
    <td>${r.meet}</td>
    <td>${r.event}</td>
    <td>${r.time} ${diff}</td>
    <td>${finaPoint(r.event,r.time)}</td>
    <td>
      <button onclick="editRecord(${i})">編集</button>
      <button onclick="deleteRecord(${i})">削除</button>
    </td>
    </tr>
    `
  })
}

function renderBest(){
  let best={}
  records.forEach(r=>{
    let sec=timeToSec(r.time)
    if(isNaN(sec)) return
    if(!best[r.event]||sec<best[r.event].sec){
      best[r.event]={time:r.time,sec:sec}
    }
  })
  let html="<tr><th>種目</th><th>ベスト</th></tr>"
  for(let e in best){
    html+=`<tr><td>${e}</td><td>${best[e].time}</td></tr>`
  }
  bestTable.innerHTML=html
}

function renderGoalGauge(){
  let e=goalEventSelect.value
  let goal=goals[e]
  if(!goal){ if(goalChart){ try{ goalChart.destroy() }catch(e){} goalChart=null } return }
  let best=records.filter(r=>r.event==e).map(r=>timeToSec(r.time)).filter(v=>!isNaN(v))
  if(best.length==0){ if(goalChart){ try{ goalChart.destroy() }catch(e){} goalChart=null } return }
  let bestTime=Math.min(...best)
  let progress=Math.min(100, Math.round((timeToSec(goal)/bestTime)*100))
  if(goalChart){ try{ goalChart.destroy() }catch(e){} goalChart=null }
  goalChart=new Chart(goalGaugeCanvas.getContext('2d'), {
    type:"doughnut",
    data:{
      labels:["達成率","残り"],
      datasets:[{data:[progress,100-progress], backgroundColor:['#1e73be','#e9eef5'] }]
    },
    options:{
      plugins:{legend:{display:false}},
      cutout:"70%"
    }
  })

  const ctx = goalGaugeCanvas.getContext('2d')
  setTimeout(()=>{
    ctx.save()
    const cx = goalGaugeCanvas.width/2
    const cy = goalGaugeCanvas.height/2
    ctx.clearRect(cx-80, cy-40, 160, 80)
    ctx.fillStyle = '#333'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.font = '14px Arial'
    ctx.fillText(`目標: ${timeToSec(goal).toFixed(2)}s`, cx, cy-14)
    ctx.font = 'bold 26px Arial'
    ctx.fillText(`${bestTime.toFixed(2)}s`, cx, cy+6)
    ctx.font = '13px Arial'
    ctx.fillText(`達成率: ${progress}%`, cx, cy+30)
    ctx.restore()
  }, 200)
}

function renderProgress(){
  let e=graphEventSelect.value
  if(!e || e==="選択"){ if(chart){ try{ chart.destroy() }catch(e){} chart=null } return }
  let data=records.filter(r=>r.event==e)
  let labels=data.map(r=>r.date)
  let times=data.map(r=>timeToSec(r.time))
  let goal=goals[e]?Array(labels.length).fill(timeToSec(goals[e])):[]
  if(chart){ try{ chart.destroy() }catch(e){} chart=null }
  chart=new Chart(chartCanvas.getContext('2d'),{
    type:"line",
    data:{
      labels:labels,
      datasets:[
        {label:"タイム",data:times,borderColor:'#1e73be',backgroundColor:'rgba(30,115,190,0.08)'},
        {label:"目標",data:goal,borderDash:[5,5],borderColor:'#ff7f50',fill:false}
      ]
    }
  })
}

function renderFINA(){
  let data=[...records].sort((a,b)=>new Date(a.date)-new Date(b.date))
  let labels=data.map(r=>r.date)
  let points=data.map(r=>finaPoint(r.event,r.time))
  if(finaChart){ try{ finaChart.destroy() }catch(e){} finaChart=null }
  finaChart=new Chart(finaCanvas.getContext('2d'), {
    type:"line",
    data:{labels:labels,datasets:[{label:"FINA",data:points,borderColor:'#ff7f50'}]}
  })
}

function renderImprove(){
  let map={}
  records.forEach(r=>{
    if(!map[r.event])map[r.event]=[]
    map[r.event].push(r)
  })
  let labels=[], data=[]
  for(let e in map){
    let arr=map[e].sort((a,b)=>new Date(a.date)-new Date(b.date))
    if(arr.length<2)continue
    let first=timeToSec(arr[0].time)
    let last=timeToSec(arr[arr.length-1].time)
    if(isNaN(first)||isNaN(last)||first===0)continue
    labels.push(e)
    data.push(((first-last)/first*100).toFixed(1))
  }
  if(improveChart){ try{ improveChart.destroy() }catch(e){} improveChart=null }
  improveChart=new Chart(improveCanvas.getContext('2d'),{
    type:"bar",
    data:{labels:labels,datasets:[{label:"改善率%",data:data, backgroundColor:'#4caf50'}]}
  })
}

function renderStroke(){
  let map={}
  records.forEach(r=>{
    if(!r.event) return
    let s=r.event.replace(/[0-9]/g,"").replace(/m/gi,'').trim()
    let sec=timeToSec(r.time)
    if(isNaN(sec)) return
    if(!map[s])map[s]=[]
    map[s].push(sec)
  })
  let labels=[], data=[]
  for(let s in map){
    let avg=map[s].reduce((a,b)=>a+b)/map[s].length
    labels.push(s)
    data.push(avg)
  }
  if(strokeChart){ try{ strokeChart.destroy() }catch(e){} strokeChart=null }
  strokeChart=new Chart(strokeCanvas.getContext('2d'),{
    type:"bar",
    data:{labels:labels,datasets:[{label:"平均秒",data:data, backgroundColor:'#9b59b6'}]}
  })
}

function renderSeasonBest(){
  let map={}
  records.forEach(r=>{
    if(!r.date || !r.event) return
    let d=new Date(r.date)
    if(isNaN(d.getTime())) return
    let y=d.getFullYear()
    let key=y+"_"+r.event
    let sec=timeToSec(r.time)
    if(isNaN(sec)) return
    if(!map[key]||sec<map[key])map[key]=sec
  })
  let html="<tr><th>年</th><th>種目</th><th>SB</th></tr>"
  for(let k in map){
    let p=k.split("_")
    html+=`
    <tr>
    <td>${p[0]}</td>
    <td>${p[1]}</td>
    <td>${secToTime(map[k])}</td>
    </tr>
    `
  }
  seasonBestTable.innerHTML=html
}

function saveGoal(){
  goals[goalEventSelect.value]=goalTimeInput.value
  save()
  render()
}

function renderGoalsTable(){
  let html="<tr><th>種目</th><th>目標タイム</th><th></th></tr>"
  for(let e in goals){
    html+=`<tr><td>${e}</td><td>${goals[e]}</td><td><button onclick="deleteGoal('${e.replace(/'/g,"\\'")}')">削除</button></td></tr>`
  }
  goalTable.innerHTML=html
}

function deleteGoal(e){
  if(goals[e] && confirm(`${e} の目標を削除しますか？`)){
    delete goals[e]
    save()
    render()
  }
}

function render(){
  renderDashboard()
  renderTable()
  renderBest()
  renderGoalsTable()
  renderGoalGauge()
  renderProgress()
  renderFINA()
  renderImprove()
  renderStroke()
  renderSeasonBest()
}

/* CSV import/export (simple) - keep original simple parser to match earlier working code */
function recordsToCSV(){
  const header=['date','meet','venue','course','event','time']
  const rows=records.map(r=>header.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))
  return [header.join(','), ...rows].join('\n')
}

function downloadCSV(){
  const csv=recordsToCSV()
  const blob=new Blob([csv],{type:'text/csv'})
  const url=URL.createObjectURL(blob)
  const a=document.createElement('a')
  a.href=url
  a.download='swim_records.csv'
  document.body.appendChild(a)
  a.click()
  a.remove()
  URL.revokeObjectURL(url)
}

function importCSVFile(file){
  const reader=new FileReader()
  reader.onload=e=>{
    const text=e.target.result
    parseCSV(text)
  }
  reader.readAsText(file,'utf-8')
}

function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='')
  if(lines.length<1) return
  const header=lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim().toLowerCase())
  const required=['date','meet','venue','course','event','time']
  const missing=required.filter(r=>!header.includes(r))
  if(missing.length){ alert('CSVに必要な列がありません: '+missing.join(',')); return }
  const idx={}
  header.forEach((h,i)=>idx[h]=i)
  const newRecords=[]
  for(let i=1;i<lines.length;i++){
    const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || []
    if(cols.length < header.length) continue
    const r = {
      date: cols[idx['date']].replace(/^"|"$/g,'').trim(),
      meet: cols[idx['meet']].replace(/^"|"$/g,'').trim(),
      venue: cols[idx['venue']].replace(/^"|"$/g,'').trim(),
      course: cols[idx['course']].replace(/^"|"$/g,'').trim(),
      event: cols[idx['event']].replace(/^"|"$/g,'').trim(),
      time: cols[idx['time']].replace(/^"|"$/g,'').trim()
    }
    if(!isNaN(timeToSec(r.time))) newRecords.push(r)
  }
  if(newRecords.length === 0){ alert('有効なレコードが見つかりませんでした'); return }
  records = records.concat(newRecords)
  sortRecords(currentSort.key, currentSort.dir)
  save()
  populateSelects()
  render()
}

/* helpers */
function populateSelects(){
  goalEventSelect.innerHTML = eventSelect.innerHTML
  graphEventSelect.innerHTML = "<option>選択</option>"+eventSelect.innerHTML
}

/* UI wiring */
document.getElementById('saveBtn').addEventListener('click', addRecord)
document.getElementById('downloadCsvBtn').addEventListener('click', downloadCSV)
document.getElementById('importCsvBtn').addEventListener('click', ()=>{
  const f = csvUpload.files[0]
  if(!f){ alert('CSVファイルを選択してください'); return }
  importCSVFile(f)
})
document.getElementById('saveGoalBtn').addEventListener('click', saveGoal)
document.getElementById('clearRecordsBtn').addEventListener('click', clearAllRecords)
document.getElementById('clearAllBtn').addEventListener('click', clearAllData)
document.getElementById('undoBtn').addEventListener('click', undoClear)

window.deleteRecord = deleteRecord
window.editRecord = editRecord
window.deleteGoal = deleteGoal
window.toggleSort = function(key){
  const newDir = (currentSort.key===key && currentSort.dir==='asc') ? 'desc' : 'asc'
  sortRecords(key, newDir)
  renderTable()
}

load()

</script>

</body>
</html>
