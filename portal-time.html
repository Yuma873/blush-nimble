<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim Record</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:sans-serif;
background:#f4f6f8;
margin:0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
font-size:22px;
}

.container{
padding:20px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.stat{
font-size:24px;
font-weight:bold;
}

button{
padding:8px 14px;
border:none;
background:#3498db;
color:white;
border-radius:6px;
cursor:pointer;
}

input,select{
padding:6px;
margin:4px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:6px;
border-bottom:1px solid #ddd;
font-size:14px;
}

canvas{
max-height:300px;
}

</style>
</head>

<body>

<header>
Swim Record
</header>

<div class="container">

<div class="card">
<h3>目標タイム</h3>
<select id="goalEvent"></select>
<input id="goalTime" placeholder="例 25.50">
<button onclick="setGoal()">設定</button>
</div>

<div class="card grid" id="dashboard">
</div>

<div class="card">
<h3>記録追加</h3>

<input type="date" id="date">
<input placeholder="大会" id="meet">
<input placeholder="会場" id="venue">

<select id="course">
<option>SC</option>
<option>LC</option>
</select>

<select id="event"></select>

<input placeholder="タイム(秒)" id="time">

<button onclick="addRecord()">追加</button>

</div>

<div class="card">

<h3>CSV</h3>

<input type="file" id="csvFile">

<button onclick="importCSV()">CSV読込</button>

<button onclick="exportCSV()">CSV保存</button>

</div>

<div class="card">

<h3>記録</h3>

<table id="recordTable">
<thead>
<tr>
<th>日付</th>
<th>大会</th>
<th>会場</th>
<th>種目</th>
<th>タイム</th>
<th></th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<div class="card">
<h3>記録推移</h3>
<canvas id="timeChart"></canvas>
</div>

<div class="card">
<h3>FINAポイント推移</h3>
<canvas id="finaChart"></canvas>
</div>

<div class="card">
<h3>改善率</h3>
<canvas id="improveChart"></canvas>
</div>

<div class="card">
<h3>泳法別平均</h3>
<canvas id="styleChart"></canvas>
</div>

<div class="card">
<h3>シーズンベスト</h3>
<canvas id="seasonChart"></canvas>
</div>

</div>

<script>

const events=[
"50FR","100FR","200FR",
"50BA","100BA","200BA",
"50BR","100BR","200BR",
"50FL","100FL","200FL",
"200IM","400IM"
]

const finaBase={
"50FR":20.91,
"100FR":46.86,
"200FR":102.00,
"50BA":23.71,
"100BA":51.60,
"200BA":111.92,
"50BR":25.95,
"100BR":56.88,
"200BR":124.28,
"50FL":22.27,
"100FL":49.45,
"200FL":110.73,
"200IM":114.00,
"400IM":243.84
}

let records=JSON.parse(localStorage.getItem("swimRecords")||"[]")
let goals=JSON.parse(localStorage.getItem("swimGoals")||"{}")

function save(){
localStorage.setItem("swimRecords",JSON.stringify(records))
}

function saveGoals(){
localStorage.setItem("swimGoals",JSON.stringify(goals))
}

function populateEvents(){

events.forEach(e=>{
let opt=document.createElement("option")
opt.value=e
opt.text=e
event.appendChild(opt)

let opt2=document.createElement("option")
opt2.value=e
opt2.text=e
goalEvent.appendChild(opt2)
})

}

function addRecord(){

let r={
date:date.value,
meet:meet.value,
venue:venue.value,
course:course.value,
event:event.value,
time:parseFloat(time.value)
}

records.push(r)

save()

render()

}

function deleteRecord(i){

records.splice(i,1)

save()

render()

}

function render(){

let tbody=document.querySelector("#recordTable tbody")

tbody.innerHTML=""

records.forEach((r,i)=>{

let tr=document.createElement("tr")

tr.innerHTML=`
<td>${r.date}</td>
<td>${r.meet}</td>
<td>${r.venue}</td>
<td>${r.event}</td>
<td>${r.time}</td>
<td><button onclick="deleteRecord(${i})">削除</button></td>
`

tbody.appendChild(tr)

})

dashboard()

charts()

}

function dashboard(){

let races=records.length

let meets=new Set(records.map(r=>r.meet)).size

let best=Math.min(...records.map(r=>r.time))

let avg=(records.reduce((a,b)=>a+b.time,0)/records.length||0).toFixed(2)

dashboard.innerHTML=`

<div class="card"><div>レース数</div><div class="stat">${races}</div></div>

<div class="card"><div>大会数</div><div class="stat">${meets}</div></div>

<div class="card"><div>平均タイム</div><div class="stat">${avg}</div></div>

<div class="card"><div>ベスト</div><div class="stat">${best||"-"}</div></div>

`

}

function fina(time,event){

let base=finaBase[event]

if(!base)return 0

return Math.round(1000*Math.pow(base/time,3))

}

function charts(){

let labels=records.map(r=>r.date)

let times=records.map(r=>r.time)

let finaPoints=records.map(r=>fina(r.time,r.event))

new Chart(timeChart,{
type:"line",
data:{
labels,
datasets:[
{
label:"タイム",
data:times
},
{
label:"目標",
data:labels.map(()=>goals[event.value]||null)
}
]
}
})

new Chart(finaChart,{
type:"line",
data:{
labels,
datasets:[{label:"FINA",data:finaPoints}]
}
})

let improve=[]

for(let i=1;i<times.length;i++){

improve.push(times[i-1]-times[i])

}

new Chart(improveChart,{
type:"bar",
data:{
labels:labels.slice(1),
datasets:[{label:"改善秒",data:improve}]
}
})

let style={FR:[],BA:[],BR:[],FL:[]}

records.forEach(r=>{

let s=r.event.slice(2)

style[s]?.push(r.time)

})

let avgStyle=Object.values(style).map(a=>a.reduce((x,y)=>x+y,0)/a.length)

new Chart(styleChart,{
type:"bar",
data:{
labels:Object.keys(style),
datasets:[{data:avgStyle}]
}
})

let year={}

records.forEach(r=>{

let y=r.date.slice(0,4)

if(!year[y]||year[y]>r.time)year[y]=r.time

})

new Chart(seasonChart,{
type:"bar",
data:{
labels:Object.keys(year),
datasets:[{data:Object.values(year)}]
}
})

}

function setGoal(){

goals[goalEvent.value]=parseFloat(goalTime.value)

saveGoals()

charts()

}

function exportCSV(){

let csv="date,meet,venue,course,event,time\n"

records.forEach(r=>{
csv+=`${r.date},${r.meet},${r.venue},${r.course},${r.event},${r.time}\n`
})

let blob=new Blob([csv])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="swim_records.csv"

a.click()

}

function importCSV(){

let file=csvFile.files[0]

let reader=new FileReader()

reader.onload=e=>{

let lines=e.target.result.split("\n").slice(1)

lines.forEach(l=>{

let [date,meet,venue,course,event,time]=l.split(",")

if(!date)return

records.push({
date,meet,venue,course,event,time:parseFloat(time)
})

})

save()

render()

}

reader.readAsText(file)

}

populateEvents()

render()

</script>

</body>
</html>
