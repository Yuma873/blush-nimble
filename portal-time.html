<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim Record Analyzer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#2c3e50;
color:white;
padding:15px;
font-size:20px;
}

section{
background:white;
margin:20px;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #ddd;
padding:6px;
text-align:center;
}

input,select{
padding:6px;
margin:4px;
}

button{
padding:6px 10px;
background:#1abc9c;
border:none;
color:white;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#16a085;
}

canvas{
max-width:100%;
}

</style>
</head>

<body>

<header>Swim Record Analyzer</header>

<section>

<h2>記録入力</h2>

<input type="date" id="date">
<input placeholder="大会名" id="meet">
<input placeholder="会場" id="venue">

<select id="course">
<option>LCM</option>
<option>SCM</option>
</select>

<select id="event">

<option>50m自由形</option>
<option>100m自由形</option>
<option>200m自由形</option>

<option>50m背泳ぎ</option>
<option>100m背泳ぎ</option>
<option>200m背泳ぎ</option>

<option>50m平泳ぎ</option>
<option>100m平泳ぎ</option>
<option>200m平泳ぎ</option>

<option>50mバタフライ</option>
<option>100mバタフライ</option>
<option>200mバタフライ</option>

</select>

<input placeholder="タイム" id="time">

<button onclick="addRecord()">追加</button>

</section>

<section>

<h2>CSV</h2>

<button onclick="saveCSV()">CSV保存</button>

<input type="file" id="csvFile" onchange="loadCSV(event)">

</section>

<section>

<h2>ベストタイム</h2>

<table id="bestTable"></table>

</section>

<section>

<h2>記録一覧</h2>

<table id="recordTable"></table>

</section>

<section>

<h2>目標達成率</h2>

<canvas id="goalGauge"></canvas>

</section>

<section>

<h2>記録推移</h2>

<canvas id="recordChart"></canvas>

</section>

<section>

<h2>FINAポイント推移</h2>

<canvas id="finaChart"></canvas>

</section>

<section>

<h2>改善率</h2>

<canvas id="improveChart"></canvas>

</section>

<section>

<h2>泳法別平均</h2>

<canvas id="strokeChart"></canvas>

</section>

<section>

<h2>シーズンベスト</h2>

<table id="seasonBest"></table>

</section>

<script>

let records=[]

function timeToSec(t){

if(t.includes(":")){

let p=t.split(":")
return Number(p[0])*60+Number(p[1])

}

return Number(t)

}

function secToTime(sec){

let m=Math.floor(sec/60)
let s=(sec%60).toFixed(2)

if(m>0)return m+":"+s
return s

}

function addRecord(){

let r={
date:date.value,
meet:meet.value,
venue:venue.value,
course:course.value,
event:event.value,
time:time.value
}

records.push(r)

renderAll()

}

function renderTable(){

let html="<tr><th>date</th><th>meet</th><th>venue</th><th>course</th><th>event</th><th>time</th></tr>"

records.forEach(r=>{

html+=`
<tr>
<td>${r.date}</td>
<td>${r.meet}</td>
<td>${r.venue}</td>
<td>${r.course}</td>
<td>${r.event}</td>
<td>${r.time}</td>
</tr>
`

})

recordTable.innerHTML=html

}

function renderBest(){

let best={}

records.forEach(r=>{

let sec=timeToSec(r.time)

if(!best[r.event]||sec<best[r.event]){

best[r.event]=sec

}

})

let html="<tr><th>種目</th><th>BEST</th></tr>"

Object.keys(best).sort().forEach(e=>{

html+=`
<tr>
<td>${e}</td>
<td>${secToTime(best[e])}</td>
</tr>
`

})

bestTable.innerHTML=html

}

function renderRecordChart(){

let arr=[...records].sort((a,b)=>new Date(a.date)-new Date(b.date))

let labels=arr.map(r=>r.date)
let data=arr.map(r=>timeToSec(r.time))

new Chart(recordChart,{
type:"line",
data:{
labels:labels,
datasets:[{label:"タイム",data:data}]
}
})

}

function renderImprove(){

let map={}

records.forEach(r=>{

if(!map[r.event])map[r.event]=[]

map[r.event].push(r)

})

let labels=[]
let data=[]

for(let e in map){

let arr=map[e].sort((a,b)=>new Date(a.date)-new Date(b.date))

if(arr.length<2)continue

let first=timeToSec(arr[0].time)
let last=timeToSec(arr[arr.length-1].time)

let improve=(first-last)/first*100

labels.push(e)
data.push(improve.toFixed(1))

}

new Chart(improveChart,{
type:"bar",
data:{
labels:labels,
datasets:[{label:"改善率%",data:data}]
}
})

}

function renderStroke(){

let map={}

records.forEach(r=>{

let stroke=r.event.replace(/[0-9]/g,"")

let sec=timeToSec(r.time)

if(!map[stroke])map[stroke]=[]

map[stroke].push(sec)

})

let labels=[]
let data=[]

for(let s in map){

let avg=map[s].reduce((a,b)=>a+b)/map[s].length

labels.push(s)
data.push(avg)

}

new Chart(strokeChart,{
type:"bar",
data:{labels:labels,datasets:[{label:"平均秒",data:data}]}
})

}

function renderSeasonBest(){

let map={}

records.forEach(r=>{

let y=new Date(r.date).getFullYear()

let key=y+"_"+r.event

let sec=timeToSec(r.time)

if(!map[key]||sec<map[key]){

map[key]=sec

}

})

let html="<tr><th>年</th><th>種目</th><th>SB</th></tr>"

for(let k in map){

let p=k.split("_")

html+=`
<tr>
<td>${p[0]}</td>
<td>${p[1]}</td>
<td>${secToTime(map[k])}</td>
</tr>
`

}

seasonBest.innerHTML=html

}

function finaPoint(time){

let base=50
return Math.round(1000*(base/time))

}

function renderFINA(){

let arr=[...records].sort((a,b)=>new Date(a.date)-new Date(b.date))

let labels=[]
let data=[]

arr.forEach(r=>{

labels.push(r.date)
data.push(finaPoint(timeToSec(r.time)))

})

new Chart(finaChart,{
type:"line",
data:{labels:labels,datasets:[{label:"FINAポイント",data:data}]}
})

}

function saveCSV(){

let csv="date,meet,venue,course,event,time\n"

records.forEach(r=>{

csv+=`${r.date},${r.meet},${r.venue},${r.course},${r.event},${r.time}\n`

})

let blob=new Blob([csv],{type:"text/csv"})

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)
a.download="swim_records.csv"
a.click()

}

function loadCSV(e){

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

let lines=reader.result.split("\n").slice(1)

records=[]

lines.forEach(l=>{

let c=l.split(",")

if(c.length<6)return

records.push({

date:c[0],
meet:c[1],
venue:c[2],
course:c[3],
event:c[4],
time:c[5]

})

})

renderAll()

}

reader.readAsText(file)

}

function renderAll(){

renderTable()

renderBest()

renderRecordChart()

renderImprove()

renderStroke()

renderSeasonBest()

renderFINA()

}

</script>

</body>
</html>
