<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim Record Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:sans-serif;
background:#eef2f6;
margin:0;
}

header{
background:#2c3e50;
color:white;
padding:16px;
font-size:20px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

h3{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#f0f4f8;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:center;
}

input,select{
padding:6px;
margin:3px;
}

button{
padding:6px 10px;
background:#1e73be;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
opacity:0.85;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}

.stat{
background:#f4f6f9;
padding:10px;
border-radius:8px;
}

.goalGood{color:green;font-weight:bold;}
.goalBad{color:red;}

</style>
</head>

<body>

<header>競泳タイム管理ダッシュボード</header>

<div class="container">

<div class="card">
<h3>ダッシュボード</h3>
<div class="stats" id="stats"></div>
</div>

<div class="card">
<h3>記録入力</h3>

<input id="date" type="date">
<input id="meet" placeholder="大会名">

<select id="event">

<option>50m自由形</option>
<option>100m自由形</option>
<option>200m自由形</option>
<option>400m自由形</option>

<option>50m背泳ぎ</option>
<option>100m背泳ぎ</option>
<option>200m背泳ぎ</option>

<option>50m平泳ぎ</option>
<option>100m平泳ぎ</option>
<option>200m平泳ぎ</option>

<option>50mバタフライ</option>
<option>100mバタフライ</option>
<option>200mバタフライ</option>

<option>200m個人メドレー</option>
<option>400m個人メドレー</option>

</select>

<select id="course">
<option>短水路</option>
<option>長水路</option>
</select>

<input id="time" placeholder="タイム">

<button onclick="addRecord()">保存</button>

</div>


<div class="card">
<h3>目標タイム</h3>

<select id="goalEvent"></select>
<input id="goalTime" placeholder="目標">

<button onclick="saveGoal()">保存</button>

<table id="goalTable"></table>

</div>


<div class="card">
<h3>記録推移</h3>

<select id="graphEvent" onchange="renderGraph()"></select>

<canvas id="chart" height="120"></canvas>

</div>


<div class="card">
<h3>ベストタイム</h3>
<table id="bestTable"></table>
</div>


<div class="card">
<h3>記録一覧</h3>
<table id="recordTable"></table>
</div>


<div class="card">
<h3>CSV</h3>

<input type="file" onchange="uploadCSV(event)">
<button onclick="downloadCSV()">CSVダウンロード</button>

</div>

</div>


<script>

const events=[

"50m自由形","100m自由形","200m自由形","400m自由形",
"50m背泳ぎ","100m背泳ぎ","200m背泳ぎ",
"50m平泳ぎ","100m平泳ぎ","200m平泳ぎ",
"50mバタフライ","100mバタフライ","200mバタフライ",
"200m個人メドレー","400m個人メドレー"

]

let records=JSON.parse(localStorage.getItem("swimRecords")||"[]")
let goals=JSON.parse(localStorage.getItem("swimGoals")||"{}")

let chart

function save(){

localStorage.setItem("swimRecords",JSON.stringify(records))
localStorage.setItem("swimGoals",JSON.stringify(goals))

}

function timeToSec(t){

if(!t)return 0

if(t.includes(":")){

let p=t.split(":")
return parseFloat(p[0])*60+parseFloat(p[1])

}

return parseFloat(t)

}

function secToTime(sec){

let m=Math.floor(sec/60)
let s=(sec%60).toFixed(2)

if(m==0)return s

return m+":"+s.padStart(5,"0")

}


function addRecord(){

records.push({

date:date.value,
meet:meet.value,
event:event.value,
course:course.value,
time:time.value

})

save()
render()

}

function deleteRecord(i){

records.splice(i,1)

save()
render()

}

function renderDashboard(){

let races=records.length

let meets=new Set(records.map(r=>r.meet)).size

stats.innerHTML=`

<div class="stat">レース数<br><b>${races}</b></div>
<div class="stat">大会数<br><b>${meets}</b></div>

`

}


function renderTable(){

let html="<tr><th>日付</th><th>大会</th><th>種目</th><th>タイム</th><th></th></tr>"

records.forEach((r,i)=>{

html+=`

<tr>

<td>${r.date}</td>
<td>${r.meet}</td>
<td>${r.event}</td>
<td>${r.time}</td>

<td>

<button onclick="deleteRecord(${i})">削除</button>

</td>

</tr>

`

})

recordTable.innerHTML=html

}


function renderBest(){

let map={}

records.forEach(r=>{

let sec=timeToSec(r.time)

if(!map[r.event]||sec<map[r.event]){

map[r.event]=sec

}

})

let html="<tr><th>種目</th><th>ベスト</th></tr>"

Object.keys(map).forEach(e=>{

html+=`

<tr>

<td>${e}</td>
<td>${secToTime(map[e])}</td>

</tr>

`

})

bestTable.innerHTML=html

}


function renderGoals(){

let html="<tr><th>種目</th><th>目標</th><th>ベスト</th><th>残り秒</th><th>達成率</th></tr>"

Object.keys(goals).forEach(e=>{

let goal=timeToSec(goals[e])

let list=records.filter(r=>r.event==e)

if(!list.length)return

let best=Math.min(...list.map(r=>timeToSec(r.time)))

let remain=(best-goal).toFixed(2)

let rate=((goal/best)*100).toFixed(1)

let color=best<=goal?"goalGood":"goalBad"

html+=`

<tr>

<td>${e}</td>
<td>${goals[e]}</td>
<td>${secToTime(best)}</td>
<td class="${color}">${remain}</td>
<td>${rate}%</td>

</tr>

`

})

goalTable.innerHTML=html

}


function renderGraph(){

let ev=graphEvent.value

let data=records

.filter(r=>r.event==ev)

.sort((a,b)=>new Date(a.date)-new Date(b.date))

if(!data.length)return

let labels=data.map(r=>r.date)

let times=data.map(r=>timeToSec(r.time))

let goalSec=timeToSec(goals[ev])

let goalLine=labels.map(()=>goalSec)

if(chart)chart.destroy()

chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{

labels:labels,

datasets:[

{label:"タイム",data:times},

{label:"目標",data:goalLine,borderDash:[6,6]}

]

}

})

}


function saveGoal(){

goals[goalEvent.value]=goalTime.value

save()
render()

}


function downloadCSV(){

let rows=["date,meet,event,course,time"]

records.forEach(r=>{

rows.push(`${r.date},${r.meet},${r.event},${r.course},${r.time}`)

})

let blob=new Blob([rows.join("\n")])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="swim_records.csv"

a.click()

}


function uploadCSV(e){

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

let rows=reader.result.split("\n").slice(1)

rows.forEach(r=>{

let c=r.split(",")

if(c.length<5)return

records.push({

date:c[0],
meet:c[1],
event:c[2],
course:c[3],
time:c[4]

})

})

save()
render()

}

reader.readAsText(file)

}


function init(){

events.forEach(e=>{

graphEvent.add(new Option(e,e))
goalEvent.add(new Option(e,e))

})

render()

}


function render(){

renderDashboard()
renderTable()
renderBest()
renderGoals()
renderGraph()

}

init()

</script>

</body>
</html>
