<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スクールバス発車案内（登校便）</title>
<style>
body{
  margin:0;
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;
  background:#eef2f7;
}
.header{
  background:#1e3a8a;
  color:white;
  padding:20px 40px;
  font-size:28px;
  display:flex;
  justify-content:space-between;
}
.main-card{
  background:white;
  margin:20px 30px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
}
.bus{
  border-radius:16px;
  color:white;
  padding:20px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.bus .info{
  display:flex;
  flex-direction:column;
}
.bus .stops{
  margin-top:6px;
  background:#ef4444;
  padding:4px 8px;
  border-radius:6px;
  font-size:14px;
}
.bus .eta{
  background:#fbbf24;
  color:#1e293b;
  padding:6px 10px;
  border-radius:6px;
  font-size:16px;
}
.bus .note{
  margin-top:4px;
  background:#f97316;
  padding:4px 6px;
  border-radius:6px;
  font-size:14px;
}

.next-small{
  border-radius:14px;
  color:white;
  padding:14px;
  margin-top:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.next-small .info{display:flex;flex-direction:column;}
.next-small .stops{margin-top:4px;background:#ef4444;padding:2px 6px;border-radius:6px;font-size:12px;}
.next-small .eta{background:#fbbf24;color:#1e293b;padding:2px 6px;border-radius:6px;font-size:14px;}
.next-small .note{margin-top:2px;background:#f97316;padding:2px 4px;border-radius:6px;font-size:12px;}

.alert{
  animation:blink 1s infinite;
}
@keyframes blink{
  50%{opacity:0.3;}
}
</style>
</head>
<body>

<div class="header">
  <div>スクールバス発車案内（登校便）</div>
  <div id="clock"></div>
</div>

<div class="main-card">
  <div id="dateDisplay" style="margin-bottom:10px;"></div>
  <div id="nextBuses"></div>
</div>

<script>
// 固定時刻表（平塚→学校）＋到着時刻予想（分）＋途中停留所＋備考＋ステータス
let scheduleTemplate=[
 {time:"6:50",car:"10号車",stops:["崇善","西友","ブックオフ","大住"],eta:25,status:"ok", note:"後期生専用"},
 {time:"7:15",car:"1号車",stops:["崇善","西友","ブックオフ","大住"],eta:30,status:"ok", note:"通常便"},
 {time:"7:25",car:"2号車",stops:["崇善","西友","ブックオフ"],eta:40,status:"extra", note:"臨時便"},
 {time:"7:30",car:"4号車",stops:[],eta:40,status:"ok", note:"直行"},
 {time:"7:35",car:"7号車",stops:[],eta:35,status:"ok", note:"直行"},
 {time:"7:40",car:"8号車",stops:[],eta:30,status:"ok", note:"直行"},
 {time:"7:45",car:"9号車",stops:["崇善","西友","ブックオフ","大住"],eta:35,status:"cancel", note:"運休"},
 {time:"7:50",car:"3号車",stops:[],eta:35,status:"ok", note:"直行"}
];

function getScheduleForDate(date){
  return scheduleTemplate.map(b=>({...b,date:new Date(date)}));
}

let schedule=getScheduleForDate(new Date());

function updateBoard(){
  const now=new Date();
  document.getElementById("clock").textContent=now.toLocaleTimeString();
  document.getElementById("dateDisplay").textContent=now.toLocaleDateString();

  let future=schedule.filter(b=>{
    const [h,m]=b.time.split(":").map(Number);
    const bt=new Date(b.date);
    bt.setHours(h);
    bt.setMinutes(m);
    return bt>=now; // 発車後は消える
  });

  if(future.length===0){
    const nextDay=new Date();
    nextDay.setDate(now.getDate()+1);
    schedule=getScheduleForDate(nextDay);
    future=schedule;
  }

  const container=document.getElementById("nextBuses");
  container.innerHTML="";

  future.slice(0,3).forEach((b,index)=>{
    const [h,m]=b.time.split(":").map(Number);
    const bt=new Date(b.date);
    bt.setHours(h);
    bt.setMinutes(m);

    const arrival=new Date(bt.getTime()+b.eta*60000);
    const arrivalStr=
      arrival.getHours().toString().padStart(2,'0')+":"+
      arrival.getMinutes().toString().padStart(2,'0');

    const diff=(bt-now)/60000;

    let box=document.createElement("div");

    if(index===0){
      box.className="bus";
      box.style.background=
        b.status==="cancel"?"#dc2626":
        b.status==="extra"?"#f59e0b":"#16a34a";
    }else{
      box.className="next-small";
      box.style.background=
        b.status==="cancel"?"#dc2626":
        b.status==="extra"?"#f59e0b":"#2563eb";
    }

    if(diff<=1) box.classList.add("alert");

    const stopsHTML=(b.stops && b.stops.length>0)?`<div class="stops">途中停留所: ${b.stops.join(", ")}</div>`:"";
    const noteHTML=b.note?`<div class="note">備考: ${b.note}</div>`:"";

    box.innerHTML=`
      <div class="info">
        <div style="font-size:${index===0?'50px':'28px'};font-weight:bold;">${b.time}</div>
        <div>${b.status==="cancel"?"運休":
               b.status==="extra"?"臨時便":"学校行き"}</div>
        <div>${b.car}</div>
        ${stopsHTML}
        ${noteHTML}
      </div>
      <div class="eta">到着 ${arrivalStr}</div>
    `;

    container.appendChild(box);
  });
}

updateBoard();
setInterval(updateBoard,1000);
</script>
</body>
</html>
