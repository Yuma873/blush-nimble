<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>スクールバス発車案内 管理強化版</title>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --primary:#0f4bd8; --accent:#2563eb;
  --ok:#16a34a; --warn:#f59e0b; --danger:#dc2626; --text:#0f172a;
  --muted:#475569; --glass:rgba(255,255,255,0.6); --radius:12px; --gap:12px;
  --max-width:1100px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;
  background:linear-gradient(180deg,var(--bg),#e6eef9);color:var(--text);
  -webkit-font-smoothing:antialiased;padding:20px;display:flex;justify-content:center;
}
.container{width:100%;max-width:var(--max-width)}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.title{background:var(--primary);color:#fff;padding:12px 16px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:10px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid rgba(15,23,42,0.06);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:#fff;border:none}
.small{padding:6px 8px;font-size:14px}
.main-card{background:var(--card);padding:16px;border-radius:14px;box-shadow:0 10px 30px rgba(16,24,40,0.06);margin-bottom:14px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
.clock{font-weight:700;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{padding:8px;border-radius:8px;border:1px solid rgba(15,23,42,0.08);min-width:180px}

/* list */
.list{display:flex;flex-direction:column;gap:12px}
.bus{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:#fff;border:1px solid rgba(15,23,42,0.04)}
.bus.primary{box-shadow:0 6px 18px rgba(16,24,40,0.04)}
.info{display:flex;gap:12px;align-items:flex-start}
.time{font-size:44px;font-weight:900;min-width:130px;color:var(--text)}
.metaInfo{display:flex;flex-direction:column;gap:6px;min-width:260px}
.car{font-weight:700;color:var(--muted)}
.statusRow{display:flex;gap:6px;align-items:center}
.badge{display:inline-block;padding:6px 8px;border-radius:8px;font-weight:700;color:#fff;font-size:13px}
.badge.ok{background:var(--ok)}
.badge.extra{background:var(--warn);color:#1f2937}
.badge.cancel{background:var(--danger)}
.stops{font-size:14px;color:var(--muted)}
.note{font-size:13px;color:#92400e}

/* right */
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.eta{background:var(--glass);padding:8px 12px;border-radius:10px;font-weight:800;color:var(--text)}
.arrival{font-size:14px;color:var(--muted)}

/* inline edit */
.editable{background:transparent;border:none;padding:4px;border-radius:6px;font-weight:700}
.editable:focus{outline:2px solid rgba(37,99,235,0.18);background:#fff}

/* admin */
.admin-panel{margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid rgba(15,23,42,0.03)}
.form-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.input,select,textarea{padding:8px;border-radius:8px;border:1px solid rgba(15,23,42,0.08);min-width:160px}
.notice-list{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.notice-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;background:#fff;border:1px solid rgba(15,23,42,0.04)}
.small-muted{font-size:13px;color:var(--muted)}
.hidden{display:none}

/* log */
.log-panel{margin-top:12px;padding:10px;border-radius:8px;background:#fff;border:1px solid rgba(15,23,42,0.04);max-height:160px;overflow:auto;font-size:13px}

/* print */
@media print{
  body{background:white;padding:0}
  .header,.controls,.admin-panel,.btn{display:none}
  .bus{page-break-inside:avoid}
}

/* responsive */
@media (max-width:720px){
  .time{font-size:32px;min-width:90px}
  .meta{flex-direction:column;align-items:flex-start;gap:8px}
  .right{align-items:flex-start}
}
</style>
</head>
<body>
<div class="container" id="app">
  <header class="header" role="banner">
    <div class="title" aria-hidden="false">スクールバス発車案内 管理強化版</div>
    <div class="controls" role="region" aria-label="操作">
      <div id="clock" class="clock" aria-live="polite">--:--:--</div>
      <div class="toolbar">
        <input id="search" class="search" placeholder="便名・停留所で検索" aria-label="検索">
        <select id="timeFilter" class="input" aria-label="時間帯フィルタ">
          <option value="all">全時間帯</option>
          <option value="early">6:00〜7:00</option>
          <option value="morning">7:00〜8:00</option>
        </select>
        <button id="toggleAdmin" class="btn small" aria-pressed="false">管理画面</button>
        <button id="undoBtn" class="btn small">Undo</button>
        <button id="refreshBtn" class="btn small">更新</button>
        <label style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="darkMode"> ダーク
        </label>
      </div>
    </div>
  </header>

  <main class="main-card" role="main">
    <div class="meta">
      <div>
        <div id="dateDisplay" class="small-muted" aria-live="polite">--/--/--</div>
        <div id="noticeArea" style="margin-top:6px"></div>
      </div>
      <div class="small-muted">次の発車: <span id="nextSummary">--</span></div>
    </div>

    <section id="list" class="list" aria-live="polite" aria-label="発車一覧"></section>

    <section id="adminPanel" class="admin-panel hidden" aria-hidden="true" aria-label="管理パネル">
      <h3 style="margin:0 0 8px 0">管理パネル</h3>

      <div class="form-row">
        <label class="small-muted">便を選択</label>
        <select id="selectBus" class="input"></select>
        <label class="small-muted">ステータス</label>
        <select id="selectStatus" class="input">
          <option value="ok">通常便</option>
          <option value="extra">臨時便</option>
          <option value="cancel">運休</option>
        </select>
        <button id="applyStatusBtn" class="btn">適用</button>
      </div>

      <div style="margin-top:8px">
        <div class="small-muted" style="margin-bottom:6px">お知らせを追加</div>
        <div class="form-row">
          <input id="noticeTitle" class="input" placeholder="タイトル">
          <input id="noticeWhen" class="input" placeholder="表示期間（例: 2026-03-25 〜 2026-03-26）">
          <textarea id="noticeBody" class="input" placeholder="本文" style="min-width:260px;min-height:56px"></textarea>
          <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="pinNotice"> ピン</label>
          <button id="addNoticeBtn" class="btn primary">追加</button>
        </div>
        <div id="noticeList" class="notice-list" style="margin-top:8px"></div>
      </div>

      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <button id="saveBtn" class="btn">保存</button>
        <button id="resetBtn" class="btn">初期化</button>
        <div class="small-muted">変更は保存で永続化されます</div>
      </div>

      <div style="margin-top:12px">
        <div class="small-muted">変更履歴</div>
        <div id="logPanel" class="log-panel" aria-live="polite"></div>
      </div>
    </section>
  </main>
</div>

<script>
/* ===== データ ===== */
const defaultTemplate = [
  {id:1,time:"6:50",car:"10号車",stops:["崇善","西友","ブックオフ","大住"],eta:25,status:"ok", note:"後期生専用"},
  {id:2,time:"7:15",car:"1号車",stops:["崇善","西友","ブックオフ","大住"],eta:30,status:"ok", note:"通常便"},
  {id:3,time:"7:25",car:"2号車",stops:["崇善","西友","ブックオフ"],eta:40,status:"extra", note:"臨時便"},
  {id:4,time:"7:30",car:"4号車",stops:[],eta:40,status:"ok", note:"直行"},
  {id:5,time:"7:35",car:"7号車",stops:[],eta:35,status:"ok", note:"直行"},
  {id:6,time:"7:40",car:"8号車",stops:[],eta:30,status:"ok", note:"直行"},
  {id:7,time:"7:45",car:"9号車",stops:["崇善","西友","ブックオフ","大住"],eta:35,status:"cancel", note:"運休"},
  {id:8,time:"7:50",car:"3号車",stops:[],eta:35,status:"ok", note:"直行"}
];

const STORAGE_KEY = 'schoolbus_v3';
let schedule = [];
let notices = [];
let undoStack = [];
let log = [];

/* ===== DOM ===== */
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('dateDisplay');
const listEl = document.getElementById('list');
const nextSummaryEl = document.getElementById('nextSummary');
const toggleAdminBtn = document.getElementById('toggleAdmin');
const adminPanel = document.getElementById('adminPanel');
const selectBus = document.getElementById('selectBus');
const selectStatus = document.getElementById('selectStatus');
const applyStatusBtn = document.getElementById('applyStatusBtn');
const saveBtn = document.getElementById('saveBtn');
const resetBtn = document.getElementById('resetBtn');
const refreshBtn = document.getElementById('refreshBtn');
const searchEl = document.getElementById('search');
const timeFilterEl = document.getElementById('timeFilter');
const undoBtn = document.getElementById('undoBtn');
const logPanel = document.getElementById('logPanel');
const noticeListEl = document.getElementById('noticeList');
const noticeArea = document.getElementById('noticeArea');
const darkModeEl = document.getElementById('darkMode');

/* ===== 初期化と永続化 ===== */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      schedule = parsed.schedule || JSON.parse(JSON.stringify(defaultTemplate));
      notices = parsed.notices || [];
      log = parsed.log || [];
    }else{
      schedule = JSON.parse(JSON.stringify(defaultTemplate));
      notices = [];
      log = [];
    }
  }catch(e){
    schedule = JSON.parse(JSON.stringify(defaultTemplate));
    notices = [];
    log = [];
  }
}
function saveState(){
  const payload = {schedule, notices, log};
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  pushLog('保存', 'データを保存しました');
  alert('保存しました');
}

/* ===== ユーティリティ ===== */
function pad(n){return n.toString().padStart(2,'0')}
function nowStr(){ return new Date().toLocaleString(); }
function pushUndo(snapshot, label){
  undoStack.push({snapshot, label, time: Date.now()});
  if(undoStack.length > 20) undoStack.shift();
}
function pushLog(action, detail){
  log.unshift({time: nowStr(), action, detail});
  if(log.length > 200) log.pop();
  renderLog();
}

/* ===== レンダリング ===== */
function updateClock(){
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString();
  dateEl.textContent = now.toLocaleDateString();
}
function getFutureBuses(){
  const now = new Date();
  let future = schedule.filter(b => {
    const [h,m] = b.time.split(':').map(Number);
    const bt = new Date(); bt.setHours(h, m, 0, 0);
    return bt >= now;
  });
  if(future.length === 0) future = schedule;
  return future;
}
function renderNotices(){
  // pinned first, then active by when (simple contains check)
  const pinned = notices.filter(n => n.pin);
  const others = notices.filter(n => !n.pin);
  const html = [];
  pinned.concat(others).forEach(n => {
    const el = document.createElement('div');
    el.style.padding='8px';
    el.style.borderRadius='8px';
    el.style.background='#fff';
    el.style.marginBottom='6px';
    el.innerHTML = `<div style="font-weight:700">${escapeHtml(n.title)}</div>
      <div class="small-muted">${escapeHtml(n.when||'')}</div>
      <div style="margin-top:6px">${escapeHtml(n.body)}</div>`;
    noticeArea.appendChild(el);
  });
}
function renderLog(){
  logPanel.innerHTML = '';
  if(log.length === 0){ logPanel.textContent = '変更履歴はありません'; return; }
  log.forEach(l => {
    const d = document.createElement('div');
    d.style.padding='6px 4px';
    d.style.borderBottom='1px solid rgba(15,23,42,0.03)';
    d.innerHTML = `<div style="font-weight:700">${escapeHtml(l.action)}</div><div class="small-muted">${escapeHtml(l.time)}</div><div style="margin-top:4px">${escapeHtml(l.detail)}</div>`;
    logPanel.appendChild(d);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderList(){
  listEl.innerHTML = '';
  noticeArea.innerHTML = '';
  renderNotices();

  const now = new Date();
  const future = getFutureBuses();
  const q = searchEl.value.trim().toLowerCase();
  const tf = timeFilterEl.value;

  const filtered = future.filter(b => {
    if(q){
      const hay = (b.car + ' ' + (b.stops||[]).join(' ') + ' ' + (b.note||'') + ' ' + b.time).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(tf === 'early'){
      const [h] = b.time.split(':').map(Number); return h >=6 && h <7;
    }
    if(tf === 'morning'){
      const [h] = b.time.split(':').map(Number); return h >=7 && h <8;
    }
    return true;
  });

  filtered.slice(0, 12).forEach((b, idx) => {
    const [h,m] = b.time.split(':').map(Number);
    const bt = new Date(); bt.setHours(h, m, 0, 0);
    const arrival = new Date(bt.getTime() + b.eta * 60000);
    const arrivalStr = pad(arrival.getHours()) + ':' + pad(arrival.getMinutes());
    const diffMin = Math.round((bt - now) / 60000);

    const card = document.createElement('article');
    card.className = 'bus' + (idx===0 ? ' primary' : '');
    card.setAttribute('role','article');
    card.setAttribute('aria-label', `${b.time} 発 ${b.car} ${b.status}`);

    const statusClass = b.status === 'cancel' ? 'cancel' : (b.status === 'extra' ? 'extra' : 'ok');

    // build inner HTML with inline-editable fields
    card.innerHTML = `
      <div class="info">
        <div>
          <input class="editable time-edit" data-id="${b.id}" value="${escapeHtml(b.time)}" aria-label="発車時刻 ${b.car}">
        </div>
        <div class="metaInfo">
          <div style="display:flex;gap:8px;align-items:center">
            <div class="car">${escapeHtml(b.car)}</div>
            <div class="statusRow">
              <button class="btn status-btn" data-id="${b.id}" data-status="ok">通常</button>
              <button class="btn status-btn" data-id="${b.id}" data-status="extra">臨時</button>
              <button class="btn status-btn" data-id="${b.id}" data-status="cancel">運休</button>
            </div>
          </div>
          <div style="margin-top:6px">
            <input class="editable note-edit" data-id="${b.id}" value="${escapeHtml(b.note||'')}" aria-label="備考 ${b.car}">
          </div>
          <div class="stops" style="margin-top:6px">${b.stops && b.stops.length ? '途中: ' + escapeHtml(b.stops.join(' / ')) : ''}</div>
        </div>
      </div>
      <div class="right">
        <div class="eta">到着 ${arrivalStr}</div>
        <div class="arrival">発車まで ${diffMin} 分</div>
      </div>
    `;

    // highlight active status button
    setTimeout(()=>{ // after DOM inserted
      const btns = card.querySelectorAll('.status-btn');
      btns.forEach(btn=>{
        btn.classList.toggle('primary', btn.dataset.status === b.status);
      });
    },0);

    // attach event listeners for inline edits and status buttons
    card.querySelectorAll('.status-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const id = Number(btn.dataset.id);
        const newStatus = btn.dataset.status;
        const before = JSON.parse(JSON.stringify(schedule));
        pushUndo(before, `ステータス変更 ${id}`);
        const item = schedule.find(s=>s.id===id);
        if(item){ item.status = newStatus; pushLog('ステータス変更', `${item.time} ${item.car} → ${newStatus}`); renderList(); }
      });
    });
    card.querySelector('.time-edit').addEventListener('change', (e)=>{
      const id = Number(e.target.dataset.id);
      const newVal = e.target.value.trim();
      if(!/^\d{1,2}:\d{2}$/.test(newVal)){ alert('時刻はHH:MM形式で入力してください'); e.target.value = schedule.find(s=>s.id===id).time; return; }
      const before = JSON.parse(JSON.stringify(schedule));
      pushUndo(before, `時刻編集 ${id}`);
      const item = schedule.find(s=>s.id===id);
      if(item){ item.time = newVal; pushLog('時刻編集', `${item.car} を ${newVal} に変更`); renderList(); }
    });
    card.querySelector('.note-edit').addEventListener('change', (e)=>{
      const id = Number(e.target.dataset.id);
      const newVal = e.target.value.trim();
      const before = JSON.parse(JSON.stringify(schedule));
      pushUndo(before, `備考編集 ${id}`);
      const item = schedule.find(s=>s.id===id);
      if(item){ item.note = newVal; pushLog('備考編集', `${item.car} の備考を更新`); renderList(); }
    });

    listEl.appendChild(card);
  });

  // next summary
  if(filtered.length > 0){
    const next = filtered[0];
    nextSummaryEl.textContent = `${next.time} ${next.car} ${next.status === 'cancel' ? '運休' : next.status === 'extra' ? '臨時' : '通常'}`;
  }else{
    nextSummaryEl.textContent = '該当なし';
  }

  populateBusSelect();
}

/* ===== 管理操作 ===== */
function populateBusSelect(){
  selectBus.innerHTML = '';
  schedule.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.id;
    opt.textContent = `${b.time} ${b.car} (${b.status})`;
    selectBus.appendChild(opt);
  });
}
applyStatusBtn.addEventListener('click', () => {
  const id = Number(selectBus.value);
  const newStatus = selectStatus.value;
  const before = JSON.parse(JSON.stringify(schedule));
  pushUndo(before, `ステータス適用 ${id}`);
  const item = schedule.find(s => s.id === id);
  if(item){
    item.status = newStatus;
    pushLog('ステータス適用', `${item.time} ${item.car} → ${newStatus}`);
    renderList();
    alert('ステータスを更新しました（保存は別途）');
  }
});

/* ===== お知らせ管理 ===== */
function renderNoticeList(){
  noticeListEl.innerHTML = '';
  if(notices.length === 0){ noticeListEl.innerHTML = '<div class="small-muted">お知らせはありません</div>'; return; }
  notices.forEach((n, idx) => {
    const el = document.createElement('div');
    el.className = 'notice-item';
    el.innerHTML = `<div>
        <div style="font-weight:700">${escapeHtml(n.title)} ${n.pin ? '📌' : ''}</div>
        <div class="small-muted">${escapeHtml(n.when||'')}</div>
        <div style="margin-top:6px">${escapeHtml(n.body)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <div class="small-muted">ID:${n.id}</div>
        <div style="display:flex;gap:6px">
          <button class="btn" data-action="edit" data-idx="${idx}">編集</button>
          <button class="btn" data-action="delete" data-idx="${idx}">削除</button>
        </div>
      </div>`;
    noticeListEl.appendChild(el);
  });
}
document.getElementById('addNoticeBtn').addEventListener('click', ()=>{
  const title = document.getElementById('noticeTitle').value.trim();
  const when = document.getElementById('noticeWhen').value.trim();
  const body = document.getElementById('noticeBody').value.trim();
  const pin = document.getElementById('pinNotice').checked;
  if(!title || !body){ alert('タイトルと本文を入力してください'); return; }
  const id = Date.now();
  notices.unshift({id, title, when, body, pin});
  pushLog('お知らせ追加', title);
  renderNoticeList();
  renderList();
  document.getElementById('noticeTitle').value = document.getElementById('noticeWhen').value = document.getElementById('noticeBody').value = '';
  document.getElementById('pinNotice').checked = false;
});
noticeListEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const action = btn.dataset.action;
  const idx = Number(btn.dataset.idx);
  if(action === 'delete'){
    if(confirm('このお知らせを削除しますか？')){
      const removed = notices.splice(idx,1)[0];
      pushLog('お知らせ削除', removed.title);
      renderNoticeList();
      renderList();
    }
  }else if(action === 'edit'){
    const n = notices[idx];
    const newTitle = prompt('タイトルを編集', n.title);
    if(newTitle === null) return;
    const newWhen = prompt('表示期間を編集', n.when || '');
    if(newWhen === null) return;
    const newBody = prompt('本文を編集', n.body);
    if(newBody === null) return;
    notices[idx] = {...n, title:newTitle.trim(), when:newWhen.trim(), body:newBody.trim()};
    pushLog('お知らせ編集', newTitle);
    renderNoticeList();
    renderList();
  }
});

/* ===== Undo ===== */
undoBtn.addEventListener('click', ()=>{
  if(undoStack.length === 0){ alert('取り消せる操作がありません'); return; }
  const last = undoStack.pop();
  schedule = JSON.parse(JSON.stringify(last.snapshot));
  pushLog('Undo', last.label);
  renderList();
});

/* ===== 保存とリセット ===== */
saveBtn.addEventListener('click', saveState);
resetBtn.addEventListener('click', ()=>{
  if(!confirm('初期状態に戻しますか？ 保存していない変更は失われます')) return;
  schedule = JSON.parse(JSON.stringify(defaultTemplate));
  notices = [];
  log = [];
  saveState();
  renderList();
});

/* ===== UI制御 ===== */
toggleAdminBtn.addEventListener('click', ()=>{
  const visible = adminPanel.classList.toggle('hidden');
  adminPanel.setAttribute('aria-hidden', String(visible));
  toggleAdminBtn.setAttribute('aria-pressed', String(!visible));
  toggleAdminBtn.textContent = visible ? '管理画面' : '管理画面を閉じる';
});
refreshBtn.addEventListener('click', renderList);
searchEl.addEventListener('input', renderList);
timeFilterEl.addEventListener('change', renderList);
darkModeEl.addEventListener('change', e => document.body.classList.toggle('dark', e.target.checked));

/* ===== キーボードショートカット ===== */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'r' || e.key === 'R') renderList();
  if(e.key === 'u' || e.key === 'U') undoBtn.click();
  if(e.key === 'a' || e.key === 'A') toggleAdminBtn.click();
});

/* ===== 初期処理 ===== */
function init(){
  loadState();
  updateClock();
  renderNoticeList();
  renderList();
  renderLog();
  setInterval(updateClock,1000);
}
init();
</script>
