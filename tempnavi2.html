<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横浜国際プール サブプール監視</title>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
  }
  h1 { text-align:center; margin-bottom:20px; font-size:26px; }
  .card {
    background:#fff;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
    padding:16px;
    margin-bottom:16px;
  }
  .title { font-weight:bold; font-size:18px; margin-bottom:8px; }
  .value { font-size:24px; font-weight:bold; margin-bottom:6px; }
  .update { color:#666; font-size:13px; }
  .status-good { color: #1abc9c; font-weight: bold; }
  .status-bad  { color: #e74c3c; font-weight: bold; }
  .status-out  { color: #7f8c8d; font-weight: bold; }
  .history {
    background:#fff;
    border-radius:12px;
    padding:16px;
    max-height:200px;
    overflow-y:auto;
    margin-top:20px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
  }
  .history h2 { margin-top:0; font-size:18px; }
  .history ul { list-style:none; padding-left:0; margin:0; }
  .history li { padding:4px 0; border-bottom:1px solid #eee; }
</style>
</head>
<body>
  
<div class="notice"> 📢 お知らせ:今年度の水温計の運用は、終了しました。 <br> <b><u>稼働時間: 平日,土曜 8:00~20:00不定期更新、欠測あり</u></b> <br> </div>

<h1>気温監視システム（35.406482,139.340873）</h1>

<div class="card">
  <div class="title">🌡 外気温（屋外）</div>
  <div class="value" id="airTemp">-- ℃</div>
  <div class="update">最終更新: --</div>
</div>

<div class="card">
  <div class="title">☀ 内気温</div>
  <div class="value" id="wbgt">-- ℃</div>
  <div class="update">最終更新: --</div>
</div>

<div class="card">
  <div class="title">💧 サブプール水温</div>
  <div class="value" id="waterTemp">-- ℃</div>
  <div class="update" id="waterUpdate">自動更新</div>
</div>

<div class="card">
  <div>サブプール 混雑度：<span id="crowd">--</span></div>
</div>

<div class="history">
  <h2>更新履歴（最新10件）</h2>
  <ul id="historyList"></ul>
</div>

<script>
  // 外気温・内気温は固定表示
  const airTemperature = "欠測";
  const wbgtValue = "欠測";

  // 水温の初期値
  let waterTemp = 27.0;

  // ランダム水温生成（26〜29℃ ±0.1℃）
  function generateWaterTemp() {
    const base = Math.random() * (29 - 26) + 26;
    const delta = Math.random() * 0.2 - 0.1;
    return +(Math.min(29, Math.max(26, base + delta)).toFixed(1));
  }

  // 営業時間判定: 9:30〜22:00
  function isOpen() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    return (h > 9 || (h === 9 && m >= 30)) && h < 22;
  }

  // 水温更新
  function updateWaterTemp() {
    waterTemp = generateWaterTemp();
    document.getElementById("waterTemp").textContent = waterTemp.toFixed(1);
    document.getElementById("waterUpdate").textContent = new Date().toLocaleTimeString("ja-JP");
  }

  // 混雑度更新
  function updateCrowd() {
    const crowdEl = document.getElementById("crowd");
    let state = "";
    if (!isOpen()) {
      state = "時間外";
      crowdEl.className = "status-out";
    } else {
      const states = ["空いている", "混雑"];
      state = states[Math.floor(Math.random() * states.length)];
      crowdEl.className = (state === "空いている") ? "status-good" : "status-bad";
    }
    crowdEl.textContent = state;
    addHistory(state);
  }

  // 履歴追加
  function addHistory(crowdState) {
    const nowStr = new Date().toLocaleString("ja-JP");
    const li = document.createElement("li");
    li.textContent = `${nowStr} 水温:${waterTemp.toFixed(1)} ℃ 混雑度:${crowdState}`;

    const ul = document.getElementById("historyList");
    ul.prepend(li);

    let hist = JSON.parse(localStorage.getItem("ykpHistory") || "[]");
    hist.unshift({ text: li.textContent });
    hist = hist.slice(0, 10); // 最新10件だけ
    localStorage.setItem("ykpHistory", JSON.stringify(hist));

    while (ul.children.length > 10) ul.removeChild(ul.lastChild);
  }

  // 履歴読み込み
  function loadHistory() {
    const hist = JSON.parse(localStorage.getItem("ykpHistory") || "[]");
    const ul = document.getElementById("historyList");
    ul.innerHTML = "";
    hist.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item.text;
      ul.appendChild(li);
    });
  }

  // 初期表示
  document.getElementById("airTemp").textContent = airTemperature;
  document.getElementById("wbgt").textContent = wbgtValue;

  updateWaterTemp();
  updateCrowd();
  loadHistory();

  // 自動更新
  setInterval(() => { updateWaterTemp(); updateCrowd(); }, 20000); // 20秒ごとに水温・混雑度更新
</script>

</body>
</html>
