<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横浜国際プール サブプール監視</title>
<style>
  body { font-family: Arial, sans-serif; background:#f5f5f5; padding:20px; }
  h1 { text-align:center; margin-bottom:20px; }
  .card { background:#fff; padding:16px; border-radius:12px; margin-bottom:16px; box-shadow:0 2px 6px rgba(0,0,0,0.15); }
  .value { font-size:24px; font-weight:bold; }
  .status-good { color: #1abc9c; font-weight: bold; }
  .status-bad  { color: #e74c3c; font-weight: bold; }
  .status-out  { color: #7f8c8d; font-weight: bold; }
  .history { background:#fff; border-radius:12px; padding:16px; max-height:200px; overflow-y:auto; margin-top:20px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
  .history h2 { margin-top:0; font-size:18px; }
  .history ul { list-style:none; padding-left:0; margin:0; }
  .history li { padding:4px 0; border-bottom:1px solid #eee; }
</style>
</head>
<body>

<h1>横浜国際プール サブプール監視パネル</h1>

<div class="card">
  <div>🌡 外気温（屋外）: <span id="airTemp">--</span> ℃</div>
</div>

<div class="card">
  <div>☀ 内気温（室温）: <span id="wbgt">--</span> ℃</div>
</div>

<div class="card">
  <div>💧 サブプール水温: <span id="waterTemp">--</span> ℃</div>
</div>

<div class="card">
  <div>サブプール 混雑度: <span id="crowd">--</span></div>
</div>

<div class="history">
  <h2>更新履歴（最新10件）</h2>
  <ul id="historyList"></ul>
</div>

<script>
  // 外気温・内気温は固定表示
  const airTemperature = "欠測";
  const wbgtValue = "欠測";

  // 水温初期値
  let waterTemp = 27.0;

  function format(val) {
    return (val === "欠測" || isNaN(val)) ? String(val) : val.toFixed(1);
  }

  // ±0.1℃ の範囲で変動
  function updateWaterTemp() {
    const delta = (Math.random() * 0.2 - 0.1); // -0.1〜+0.1
    waterTemp = Math.min(29, Math.max(26, +(waterTemp + delta).toFixed(1)));
    document.getElementById("waterTemp").textContent = format(waterTemp);
  }

  // 営業時間判定: 9:30〜22:00
  function isOpen() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    return (h > 9 || (h === 9 && m >= 30)) && h < 22;
  }

  // 混雑度更新
  function updateCrowd() {
    const crowdEl = document.getElementById("crowd");
    let state = "";
    if (!isOpen()) {
      state = "時間外";
      crowdEl.className = "status-out";
    } else {
      const states = ["空いている", "混雑"];
      state = states[Math.floor(Math.random() * states.length)];
      crowdEl.className = (state === "空いている") ? "status-good" : "status-bad";
    }
    crowdEl.textContent = state;
    addHistory(state);
  }

  // 履歴管理
  function addHistory(crowdState) {
    const nowStr = new Date().toLocaleString("ja-JP");
    const li = document.createElement("li");
    li.textContent = `${nowStr} 水温:${format(waterTemp)} ℃ 混雑度:${crowdState}`;

    const ul = document.getElementById("historyList");
    ul.prepend(li);

    // ローカルストレージ保存
    let hist = JSON.parse(localStorage.getItem("ykpHistory") || "[]");
    hist.unshift({ text: li.textContent });
    hist = hist.slice(0, 10);
    localStorage.setItem("ykpHistory", JSON.stringify(hist));

    while (ul.children.length > 10) ul.removeChild(ul.lastChild);
  }

  function loadHistory() {
    const hist = JSON.parse(localStorage.getItem("ykpHistory") || "[]");
    const ul = document.getElementById("historyList");
    ul.innerHTML = "";
    hist.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item.text;
      ul.appendChild(li);
    });
  }

  // 初回表示
  document.getElementById("airTemp").textContent = airTemperature;
  document.getElementById("wbgt").textContent = wbgtValue;

  updateWaterTemp();
  updateCrowd();
  loadHistory();

  // 水温更新: 10秒ごと
  setInterval(updateWaterTemp, 10000);
  // 混雑度更新: 20秒ごと
  setInterval(updateCrowd, 20000);

</script>

</body>
</html>
