      body {

      main {
        flex: 1;

        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        font-size: 1.8em;
        margin-bottom: 15px;
        color: #2c3e50;
      }
      .iframe-container {
        flex: 1;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 1em;
        background-color: #1abc9c;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        align-self: flex-start;
      }

      .ticker-wrap {
        width: 100%;
        overflow: hidden;
        background-color: #2c3e50;
        color: white;
        padding: 8px 0;
        position: fixed;
        bottom: 0;
        left: 0;
        z-index: 9999;
      }

      .ticker {
        display: inline-block;
        white-space: nowrap;
        animation: tickerScroll 25s linear infinite;
        padding-left: 100%;
      }

      @keyframes tickerScroll {
        from {
          transform: translateX(0%);
        }
        to {
          transform: translateX(-100%);
        }
      }
    </style>
