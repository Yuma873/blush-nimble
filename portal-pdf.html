<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポータルサイト - PDFプレビュー</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      background-color: #f5f5f5;
      height: 100vh;
      overflow: hidden;
    }

    nav {
      width: 220px;
      background-color: #2c3e50;
      color: white;
      padding: 10px;
      box-sizing: border-box;
    }

    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px;
      margin: 8px 0;
      background-color: #34495e;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #1abc9c;
    }

    nav img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    main {
      flex: 1;
      padding: 20px 30px 70px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .pdf-viewer-section {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .pdf-viewer-section header {
      font-size: 1.5em;
      margin-bottom: 20px;
      color: #34495e;
      border-bottom: 2px solid #1abc9c;
      padding-bottom: 8px;
    }

    select {
      padding: 10px;
      font-size: 1em;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
      max-width: 400px;
    }

    .iframe-container {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      height: 80vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      background-color: #2c3e50;
      color: white;
      padding: 8px 0;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 9999;
    }

    .ticker {
      display: inline-block;
      white-space: nowrap;
      animation: tickerScroll 25s linear infinite;
      padding-left: 100%;
    }

    @keyframes tickerScroll {
      from {
        transform: translateX(0%);
      }
      to {
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>
  <nav>
    <img
      src="https://t4.ftcdn.net/jpg/00/83/86/63/360_F_83866376_1bnVFhX0uPIfuZ1ZSYlfhCsIlHOVPt6G.jpg"
      alt="メニュー画像"
    />
    <a href="portal.html">🏠 トップ</a>
    <a href="portal-news.html">📰 お知らせ</a>
    <a href="portal-tool.html">🛠 ツール</a>
    <a href="portal-renraku.html">📢 掲示板連絡</a>
    <a href="portal-umekomi.html">🧰水泳関連 ツールポータル</a>
    <a href="portal-tenki.html">⛅️今後の天気【プール練の参考に】</a>
    <a href="portal-pdf.html">📁ファイル一覧</a>
    <a href="https://yuma873.github.io/blush-nimble/index.html" style="display: inline-block; padding: 10px 20px; background-color: #f44336; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">🚪ログアウト</a>
  </nav>

  <main>
    <section class="pdf-viewer-section">
      <header>📄 資料プレビュー</header>
      <label for="pdfSelector">表示するPDFを選択:</label>
      <select id="pdfSelector">
        <option value="http://isa.php.xdomain.jp/htdocs/?action=common_download_main&upload_id=705">0727 市総体 要項</option>
        <option value="https://www.dropbox.com/scl/fi/zo8oxjmrg0713wlsyaajg/r-_cropped-1.pdf?rlkey=hbq1tc5a1ncdf7xdipy0r9hn9&st=a1mh6389&dl=1">0727 市総体 R＋個人一覧</option>
        <option value="https://www.dropbox.com/scl/fi/aay4on67k7sgscx83b3i8/0712.pdf?rlkey=9r9mxq1iouhpha3vdkhewz30p&st=ltac07gb&dl=1">0712 市大会 要項</option>
        <option value="https://www.dropbox.com/scl/fi/w7idxe9yihiu457c9ays8/0705.pdf?rlkey=3zrwdmdr0o3hdpfbp7pomhulc&st=jrdrau3w&dl=1">0705 中ブロック交流会 要項</option>
        <option value="https://www.dropbox.com/scl/fi/i1my5z7e4bq0vlpwkezyc/r.pdf?rlkey=oeobsw8bl1e8ibtbftbqgww8k&st=25uof3sg&dl=1">0705 中ブロック交流会 R＋個人一覧</option>
      </select>

      <div class="iframe-container">
        <iframe id="pdfViewer" src="http://isa.php.xdomain.jp/htdocs/?action=common_download_main&upload_id=705"></iframe>
      </div>
    </section>
  </main>

  <div class="ticker-wrap">
    <div class="ticker">こちらはテロップ表示です。必要な情報をここに表示できます。</div>
  </div>

  <script>
    const pdfSelector = document.getElementById('pdfSelector');
    const pdfViewer = document.getElementById('pdfViewer');

    pdfSelector.addEventListener('change', function () {
      pdfViewer.src = this.value;
    });
  </script>
</body>
</html>
