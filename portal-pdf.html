<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポータルサイト - PDFプレビュー</title>
      <link rel="shortcut icon" href="favicon4.png" type="image/png">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      background-color: #f5f5f5;
      height: 100vh;
      overflow: hidden;
    }

    nav {
      width: 220px;
      background-color: #2c3e50;
      color: white;
      padding: 10px;
      box-sizing: border-box;
    }

    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px;
      margin: 8px 0;
      background-color: #34495e;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #1abc9c;
    }

    nav img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    main {
      flex: 1;
      padding: 20px 30px 70px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .pdf-viewer-section {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .pdf-viewer-section header {
      font-size: 1.5em;
      margin-bottom: 20px;
      color: #34495e;
      border-bottom: 2px solid #1abc9c;
      padding-bottom: 8px;
    }

    select {
      padding: 10px;
      font-size: 1em;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
      max-width: 400px;
    }

    .iframe-container {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      height: 80vh;
      margin-bottom: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .fallback-link {
      margin-top: 10px;
      font-size: 0.95em;
      color: #555;
    }

    .fallback-link a {
      color: #1abc9c;
      font-weight: bold;
      text-decoration: none;
    }

    .fallback-link a:hover {
      text-decoration: underline;
    }

    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      background-color: #2c3e50;
      color: white;
      padding: 8px 0;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 9999;
    }

    .ticker {
      display: inline-block;
      white-space: nowrap;
      animation: tickerScroll 25s linear infinite;
      padding-left: 100%;
    }

    @keyframes tickerScroll {
      from {
        transform: translateX(0%);
      }
      to {
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>

  </nav>

  <main>

      <select id="pdfSelector">

        <option value="https://www.dropbox.com/scl/fi/8isg5hhbrf558rtnaoj81/25.pdf?rlkey=0tqfh9j7bdb17rh08sdzbqjl8&st=46xzijaw&raw=1">【後期】夏季記録会</option>

      <div class="iframe-container">

    </section>
  </main>

  <div class="ticker-wrap">
    <div class="ticker">PDF VIEWER等の拡張機能を利用している場合は、<b><u>開くことができない場合があります。</u></b>拡張機能を利用していない状態で閲覧するか、選択したうえで新しいタブで開いてください。</div>
  </div>

  <script>
    const pdfSelector = document.getElementById('pdfSelector');
    const pdfViewer = document.getElementById('pdfViewer');
    const openInNewTab = document.getElementById('openInNewTab');

    pdfSelector.addEventListener('change', function () {
      const selectedUrl = this.value;
      pdfViewer.src = selectedUrl;
      openInNewTab.href = selectedUrl;
    });
  </script>
</body>
</html>
