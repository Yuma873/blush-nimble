<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポータルサイト - PDFプレビュー</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      background-color: #f5f5f5;
      height: 100vh;
      overflow: hidden;
    }

    nav {
      width: 220px;
      background-color: #2c3e50;
      color: white;
      padding: 10px;
      box-sizing: border-box;
    }

    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px;
      margin: 8px 0;
      background-color: #34495e;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #1abc9c;
    }

    nav img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    main {
      flex: 1;
      padding: 20px 30px 70px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .pdf-viewer-section {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .pdf-viewer-section header {
      font-size: 1.5em;
      margin-bottom: 20px;
      color: #34495e;
      border-bottom: 2px solid #1abc9c;
      padding-bottom: 8px;
    }

    select {
      padding: 10px;
      font-size: 1em;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
      max-width: 400px;
    }

    .iframe-container {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      height: 80vh;
      margin-bottom: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .fallback-link {
      margin-top: 10px;
      font-size: 0.95em;
      color: #555;
    }

    .fallback-link a {
      color: #1abc9c;
      font-weight: bold;
      text-decoration: none;
    }

    .fallback-link a:hover {
      text-decoration: underline;
    }

    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      background-color: #2c3e50;
      color: white;
      padding: 8px 0;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 9999;
    }

    .ticker {
      display: inline-block;
      white-space: nowrap;
      animation: tickerScroll 25s linear infinite;
      padding-left: 100%;
    }

    @keyframes tickerScroll {
      from {
        transform: translateX(0%);
      }
      to {
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>
  <nav>
    <img
      src="https://t4.ftcdn.net/jpg/00/83/86/63/360_F_83866376_1bnVFhX0uPIfuZ1ZSYlfhCsIlHOVPt6G.jpg"
      alt="メニュー画像"
    />
    <a href="portal.html">🏠 トップ</a>
    <a href="portal-news.html">📰 お知らせ</a>
    <a href="portal-tool.html">🛠 ツール</a>
    <a href="portal-renraku.html">📢 掲示板連絡</a>
    <a href="portal-umekomi.html">🧰水泳関連 ツールポータル</a>
    <a href="portal-tenki.html">⛅️今後の天気【プール練の参考に】</a>
    <a href="portal-pdf.html">📁ファイル一覧</a>
    <a href="https://yuma873.github.io/blush-nimble/index.html" style="display: inline-block; padding: 10px 20px; background-color: #f44336; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">🚪ログアウト</a>
  </nav>

  <main>
    <section class="pdf-viewer-section">
      <header>📄 資料プレビュー</header>
      <label for="pdfSelector">表示するPDFを選択:</label>
      <select id="pdfSelector">
        <option value="https://www.dropbox.com/scl/fi/ajutn0gawu1xda0vb5g1n/0813-14.pdf?rlkey=1hvx6uv51aoiyox5ogbbrf9af&st=if1kst89&raw=1"> 0813-14県総体要項</option>
        <option value="https://www.dropbox.com/scl/fi/g6epj1d4uer1jr7xhk145/0802.pdf?rlkey=wrhb85cojynnern7mh3vxtay5&st=hgxre7za&raw=1">0802中ブロック要項</option>
        <option value="https://www.dropbox.com/scl/fi/088jkcwd4aayrivgv4w9e/0727.pdf?rlkey=8cvwfcsypmoxn9f6i2rblw7iy&st=k9njwy4y&raw=1">0727市総体要項</option>
        <option value="https://www.dropbox.com/scl/fi/lb2f2d7b4hyfawrg03teu/0727.pdf?rlkey=szix8pe24ji3z60gr7ie252kd&st=dw06q67a&raw=1">0727競技順序</option>
        <option value="https://www.dropbox.com/scl/fi/tvoq5m4xsegy4kz50l521/0727.pdf?rlkey=7f6kv35ur04cgm65d667o35a5&st=n94m9kmx&raw=1">0727二次要項</option>
        <option value="https://www.dropbox.com/scl/fi/ik09wzysaiu0bcujsronx/0727-scan.pdf?rlkey=68kdo8muc2k27b5kvk0xn82pt&st=0dr89pf8&raw=1">0727結果</option>
        <option value="https://www.dropbox.com/scl/fi/aay4on67k7sgscx83b3i8/0712.pdf?rlkey=9r9mxq1iouhpha3vdkhewz30p&st=ltac07gb&raw=1">0712市大会要項</option>
        <option value="https://www.dropbox.com/scl/fi/jvl91qoqtvunf8gwbewzz/0712.pdf?rlkey=e5g4qrbulvt0ty91a7mp4nt1g&st=fczrt2as&raw=1">0712結果</option>
        <option value="https://www.dropbox.com/scl/fi/w7idxe9yihiu457c9ays8/0705.pdf?rlkey=3zrwdmdr0o3hdpfbp7pomhulc&st=jrdrau3w&raw=1">0705中ブロック交流会要項</option>
      </select>

      <div class="iframe-container">
        <iframe id="pdfViewer" src="https://www.dropbox.com/scl/fi/ajutn0gawu1xda0vb5g1n/0813-14.pdf?rlkey=1hvx6uv51aoiyox5ogbbrf9af&st=if1kst89&raw=1"></iframe>
      </div>

      <p class="fallback-link">
        表示されない場合は <a id="openInNewTab" href="https://www.dropbox.com/scl/fi/ajutn0gawu1xda0vb5g1n/0813-14.pdf?rlkey=1hvx6uv51aoiyox5ogbbrf9af&st=if1kst89&raw=1" target="_blank" rel="noopener">こちら</a> をクリックして開いてください。
      </p>
    </section>
  </main>

  <div class="ticker-wrap">
    <div class="ticker">PDF VIEWER等の拡張機能を利用している場合は、<b><u>開くことができない場合があります。</u></b>拡張機能を利用していない状態で閲覧してください。</div>
  </div>

  <script>
    const pdfSelector = document.getElementById('pdfSelector');
    const pdfViewer = document.getElementById('pdfViewer');
    const openInNewTab = document.getElementById('openInNewTab');

    pdfSelector.addEventListener('change', function () {
      const selectedUrl = this.value;
      pdfViewer.src = selectedUrl;
      openInNewTab.href = selectedUrl;
    });
  </script>
</body>
</html>
