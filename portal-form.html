<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大会アンケート</title>
  <link rel="shortcut icon" href="favicon3.png" type="image/png">

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
      display: flex;
      min-height: 100vh;
    }

    /* ===== サイドナビ ===== */
    nav {
      width: 240px;
      background-color: #2c3e50;
      color: white;
      padding: 15px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      z-index: 1000;
      box-sizing: border-box;
    }

    nav video {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px;
      margin: 6px 0;
      background-color: #34495e;
      border-radius: 6px;
      text-align: center;
      transition: 0.3s;
      font-weight: 500;
    }

    nav a:hover {
      background-color: #1abc9c;
    }

    nav img {
      display: block;
      margin: 8px auto;
      border-radius: 6px;
    }

    /* ===== メイン部分 ===== */
    main {
      flex: 1;
      padding: 30px;
      margin-left: 260px;
      box-sizing: border-box;
    }

    header h1 {
      font-size: 1.6em;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      font-size: 1.1em;
    }

    select {
      padding: 10px;
      font-size: 1.1em;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 25px;
      width: 100%;
    }

    .section-card, .event-info, .form-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 25px;
      animation: fadeIn 0.4s ease-in-out;
    }

    .event-info, .form-container {
      display: none;
    }

    .event-info h2 {
      margin-top: 0;
      color: #1abc9c;
      border-bottom: 2px solid #1abc9c;
      padding-bottom: 5px;
    }

    .event-info p {
      line-height: 1.8;
      font-size: 1.05em;
      margin: 6px 0;
    }

    .event-info span {
      font-weight: bold;
      margin-right: 5px;
    }

    .special-link {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      background-color: #1abc9c;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .special-link:hover {
      background-color: #16a085;
    }

    iframe {
      width: 100%;
      height: 70vh;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* ===== スマホ対応 ===== */
    @media(max-width: 768px) {
      body {
        flex-direction: column;
      }

      nav {
        width: 100%;
        height: auto;
        position: relative;
      }

      main {
        margin-left: 0;
        padding: 15px;
      }

      iframe {
        height: 60vh;
      }
    }
  </style>
</head>

<body>

  <!-- ===== 左ナビ（トップと同じ構成） ===== -->
  <nav>
    <!-- 🎬 ランダム動画 -->
    <video id="randomVideo" autoplay muted loop playsinline></video>

    <!-- 🏠 メニュー群 -->
    <a href="portal.html">🏠 トップ</a>
    <a href="portal-news.html">📰 お知らせ</a>
    <a href="portal-tool.html">🛠 ツール</a>
    <a href="portal-renraku.html">📢 掲示板連絡</a>
    <a href="portal-pdf.html">📁 ファイル一覧</a>
    <a href="portal-next.html">🏆 次回大会 特設ページ</a>

    <!-- 🌊 プール開館情報 -->
    <a href="https://www.r326.com/b/main.aspx?g=MI50b22j293fUk0231" target="_blank">
      <img src="botan.png" alt="プール開館情報" width="120">
    </a>

    <!-- 📅 プール予約 -->
    <a href="portal-reserve.html" target="_blank">
      <img src="https://reserva.be/reserva/images/btn_reserve_2.png" alt="プール予約" width="120">
    </a>

    <!-- ⛺️ 冬合宿 -->
    <a href="2025-wintercamp.html">⛺️ 2025年度冬合宿</a>

    <!-- 🚪 ログアウト -->
    <a href="https://yuma873.github.io/blush-nimble/index.html"
       style="display:inline-block; padding:10px 20px; background-color:#f44336; color:white; text-decoration:none; border-radius:5px; font-weight:bold;">
      🚪 ログアウト
    </a>
  </nav>

  <!-- ===== メインコンテンツ ===== -->
  <main>
    <header>
      <h1>大会アンケート</h1>
    </header>

    <section class="section-card">
      <label for="eventSelect">🎯 大会を選択してください：</label>
      <select id="eventSelect">
        <option value="">-- 大会を選択 --</option>
                
    <div id="info-0401" class="event-info">
      <h2>春季記録会</h2>
       <p><span>📅 日付:</span>-</p>
      <p><span>📍 場所:</span>平塚総合公園温水プール</p>
      <p><span>⏰ 集合時間:</span>未定</p>
      <p><span>⏳ 回答期限:</span>回答受付前</p>
      <a href="portal.html" target="_blank" class="special-link">👉 大会特設ページへ</a>
    </div>

    <div id="form-1116" class="form-container">
      <h3>📋 アンケートフォーム</h3>
      <iframe src="https://ssl.form-mailer.jp/fms/65ea0748868518"></iframe>
    </div>
    <div id="form-1123" class="form-container">
      <h3>📋 アンケートフォーム</h3>
      <iframe src="https://ssl.form-mailer.jp/fms/92d4614e868521"></iframe>
    </div>
  </main>

  <!-- 🎬 ランダム動画スクリプト -->
  <script>
    const videos = [
      "video1.mp4", "video2.mp4", "video3.mp4", "video5.mp4",
      "V1.mp4", "V2.mp4", "V3.mp4", "V4.mp4", "V5.mp4",
      "V6.mp4", "V7.mp4", "V8.mp4", "V9.mp4", "V10.mp4"
    ];
    const randomVideo = videos[Math.floor(Math.random() * videos.length)];
    document.getElementById("randomVideo").src = randomVideo;
  </script>

  <!-- セレクト切り替えスクリプト -->
  <script>
    const select = document.getElementById("eventSelect");
    select.addEventListener("change", () => {
      document.querySelectorAll(".event-info, .form-container").forEach(e => e.style.display = "none");
      const val = select.value;
      if (val) {
        document.getElementById("info-" + val).style.display = "block";
        const form = document.getElementById("form-" + val);
        if (form) form.style.display = "block";
      }
    });
  </script>

</body>
</html>
