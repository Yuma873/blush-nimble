<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool Monitor Pro v10 (Auto)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --safe: #28a745; --danger: #dc3545; --warn: #f39c12; --extreme: #9b59b6; --gray: #6c757d; --dark: #1a252f;
      --bg: #f4f7f6;
    }
    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #liveClock { font-size: 18px; font-weight: bold; font-family: monospace; }
    
    .header { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
    #judgeCard { text-align: center; padding: 30px 15px; border-radius: 15px; font-weight: bold; font-size: 32px; margin-bottom: 15px; border-bottom: 6px solid rgba(0,0,0,0.1); }
    
    /* 判定色 */
    .st-safe { background: #fff; color: var(--safe); border: 3px solid var(--safe); }
    .st-warn { background: #fff; color: var(--warn); border: 3px solid var(--warn); }
    .st-danger { background: #fff; color: var(--danger); border: 3px solid var(--danger); }
    .st-extreme { background: #fff; color: var(--extreme); border: 3px solid var(--extreme); }
    .st-loading { background: #eee; color: var(--gray); border: 3px solid var(--gray); }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
    .card { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .label { font-size: 11px; color: var(--gray); font-weight: bold; margin-bottom: 4px; }
    .value { font-size: 22px; font-weight: bold; }
    .status-text { font-size: 11px; font-weight: bold; margin-top: 4px; }

    .info-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid var(--gray); }
    .box-title { font-size: 12px; font-weight: bold; color: var(--gray); display: block; margin-bottom: 5px; }
    
    .btn-update { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; }
    .btn-update:active { background: #2980b9; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div id="liveClock">00:00:00</div>
    <button class="btn-update" onclick="fetchWeatherData()">📊 データを最新に更新</button>
  </div>

  <div class="header">
    <div style="font-size: 18px; font-weight: bold;">Pool Monitor <span style="color:var(--warn)">AUTO</span></div>
    <div id="locationLabel" style="font-size: 11px; opacity: 0.8;">📍 取得地点: 神奈川県茅ヶ崎市付近</div>
  </div>

  <div id="judgeCard" class="st-loading">データ取得中...</div>

  <div class="grid">
    <div class="card">
      <div class="label">🌡 気温</div>
      <div class="value" id="airVal">--</div>
      <div class="status-text" id="airStatus">-</div>
    </div>
    <div class="card">
      <div class="label">💧 水温(手入力)</div>
      <div class="value" id="waterVal">26.0</div> <!-- 水温はAPIで取れないので固定or手入力想定 -->
      <div class="status-text">基準 22.0℃</div>
    </div>
    <div class="card">
      <div class="label">🔥 暑さ指数(推定)</div>
      <div class="value" id="wbgtVal">--</div>
      <div class="status-text" id="wbgtStatus">-</div>
    </div>
    <div class="card">
      <div class="label">☀️ 紫外線(UV)</div>
      <div class="value" id="uvVal">--</div>
      <div class="status-text" id="uvStatus">-</div>
    </div>
  </div>

  <div class="info-box" id="adviceBox">
    <span class="box-title">🚩 自動判定アドバイス</span>
    <span id="adviceContent">気象データを読み込んでいます...</span>
  </div>
</div>

<script>
  // 地点設定（茅ヶ崎市付近）
  const LAT = 35.33;
  const LON = 139.40;

  function updateClock() {
    const now = new Date();
    document.getElementById("liveClock").textContent = now.toLocaleTimeString('ja-JP', { hour12: false });
  }
  setInterval(updateClock, 1000);

  // 気象データの自動取得
  async function fetchWeatherData() {
    const card = document.getElementById("judgeCard");
    card.textContent = "更新中...";
    card.className = "st-loading";

    try {
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,uv_index&timezone=Asia%2FTokyo`);
      const data = await response.json();
      
      const temp = data.current.temperature_2m;
      const humidity = data.current.relative_humidity_2m;
      const uv = data.current.uv_index;
      
      // WBGTの簡易計算（気温と湿度から算出する簡易式）
      const wbgt = (0.735 * temp) + (0.0374 * humidity) + (0.294 * 0.6) - 4.06; // 簡易近似式
      
      updateUI(temp, wbgt.toFixed(1), uv);
    } catch (error) {
      card.textContent = "取得エラー";
      console.error(error);
    }
  }

  function updateUI(air, wbgt, uv) {
    document.getElementById("airVal").textContent = air + "℃";
    document.getElementById("wbgtVal").textContent = wbgt;
    document.getElementById("uvVal").textContent = uv;

    const water = parseFloat(document.getElementById("waterVal").textContent);
    const card = document.getElementById("judgeCard");
    const advice = document.getElementById("adviceContent");
    const adviceBox = document.getElementById("adviceBox");

    let status = "safe";
    let title = "✅ 入泳可能";
    let msg = "気象条件は良好です。";

    // WBGT判定
    if (wbgt >= 31) { status = "extreme"; title = "🚫 運動中止"; msg = "危険な暑さです。水泳も控えてください。"; }
    else if (wbgt >= 28) { status = "danger"; title = "⚠ 厳重警戒"; msg = "熱中症の危険が高いです。"; }
    else if (wbgt >= 25) { status = "warn"; title = "⚠ 警戒"; msg = "こまめな水分補給を。"; }

    // 水温チェック（手入力想定の数値と合算）
    if (water < 22.0) { status = "danger"; title = "🚫 水温不足"; msg = "水温が低すぎます。"; }

    // UV判定
    const uvS = document.getElementById("uvStatus");
    if (uv >= 8) { uvS.textContent = "極めて強"; uvS.style.color = "var(--extreme)"; }
    else if (uv >= 6) { uvS.textContent = "強い"; uvS.style.color = "var(--danger)"; }
    else { uvS.textContent = "普通"; uvS.style.color = "var(--safe)"; }

    card.textContent = title;
    card.className = "st-" + status;
    advice.innerHTML = msg;
    adviceBox.style.borderLeftColor = `var(--${status})`;
  }

  // 初回読み込み
  fetchWeatherData();
  updateClock();
</script>
</body>
</html>
