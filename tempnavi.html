<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠隔監視システム</title>
<style>
body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}
h1 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 26px;
}
.card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  padding: 16px;
  margin-bottom: 16px;
}
.title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 8px;
}
.value {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 6px;
}
.update {
  color: #666;
  font-size: 13px;
}
.result {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  padding: 16px;
  border-radius: 12px;
  margin-top: 20px;
}
.safe {
  background: #e6f9ec;
  color: #0b7a33;
  border: 2px solid #0b7a33;
}
.danger {
  background: #ffeaea;
  color: #a60000;
  border: 2px solid #a60000;
}
.detail {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  background: #fafafa;
  font-size: 15px;
  line-height: 1.5;
  border-left: 4px solid #ccc;
}
.blinking {
  animation: blink 1s infinite;
}
@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 1; }
}
.history {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  max-height: 200px;
  overflow-y: auto;
  margin-top: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.history h2 {
  margin-top: 0;
  font-size: 18px;
}
.history ul {
  list-style: none;
  padding-left: 0;
  margin: 0;
}
.history li {
  padding: 4px 0;
  border-bottom: 1px solid #eee;
}
.danger-value.blinking {
  color: #a60000;
}
</style>
</head>
<body>
<h1>気温監視システム（35.406482,139.340873）</h1>

<div class="card">
  <div class="title">🌡 気温</div>
  <div class="value" id="airTemp">-- ℃</div>
  <div class="update" id="airUpdate">最終更新: --</div>
</div>

<div class="card">
  <div class="title">💧 水温</div>
  <div class="value" id="waterTemp">-- ℃</div>
  <div class="update" id="waterUpdate">最終更新: --</div>
</div>

<div class="card">
  <div class="title">☀ WBGT</div>
  <div class="value" id="wbgt">-- </div>
  <div class="update" id="wbgtUpdate">最終更新: --</div>
</div>

<div id="judge" class="result blinking">判定中...</div>
<div id="detail" class="detail">詳細はここに表示されます。</div>

<div class="history">
  <h2>判定履歴</h2>
  <ul id="historyList"></ul>
</div>

<script>
const airTemperature = 26.4;
const waterTemperature = 22.5;
const wbgtValue = 31.2;

let lastValues = {air:null, water:null, wbgt:null};

function judgeSwimming(air, water, wbgt) {
  if (water <= 20) return {text:"🚫 危険", safe:false, detail:"水温が規定に満ちていません。利用不可です。"};
  if (air+water <= 50) return {text:"🚫 危険", safe:false, detail:"気温・水温が規定に満ちていません。利用を避けてください。"};
  if (wbgt >= 35) return {text:"⚠ 厳重注意", safe:false, detail:"熱中症リスクが極めて高いです。"};
  return {text:"✅ 安全", safe:true, detail:"条件は問題ありません。"};
}

function showPending() {
  ["airTemp","waterTemp","wbgt"].forEach(id=>{
    document.getElementById(id).textContent="-- ℃";
    document.getElementById(id).className="value blinking";
  });
  document.getElementById("judge").textContent="判定中...";
  document.getElementById("judge").className="result blinking";
  document.getElementById("detail").textContent="データ取得中です...";
  ["airUpdate","waterUpdate","wbgtUpdate"].forEach(id=>document.getElementById(id).textContent="最終更新: --");
}

function addHistory(name,value) {
  const last = lastValues[name];
  if(last !== value) {
    const li = document.createElement("li");
    li.textContent = `${new Date().toLocaleTimeString()} ${name}: ${value} ℃`;
    document.getElementById("historyList").prepend(li);
  }
  lastValues[name]=value;
}

function showResult() {
  const now = new Date().toLocaleString("ja-JP");

  document.getElementById("airTemp").textContent = airTemperature + " ℃";
  document.getElementById("airUpdate").textContent = "最終更新: " + now;

  document.getElementById("waterTemp").textContent = waterTemperature + " ℃";
  document.getElementById("waterUpdate").textContent = "最終更新: " + now;

  document.getElementById("wbgt").textContent = wbgtValue + " ℃";
  document.getElementById("wbgtUpdate").textContent = "最終更新: " + now;

  const result = judgeSwimming(airTemperature, waterTemperature, wbgtValue);

  const judgeElem = document.getElementById("judge");
  judgeElem.textContent=result.text;
  judgeElem.className="result "+(result.safe?"safe":"danger");

  const detailElem=document.getElementById("detail");
  detailElem.textContent=result.detail;

  // 危険値赤点滅
  if(!result.safe){
    if(waterTemperature<=20) document.getElementById("waterTemp").classList.add("danger-value","blinking");
    if(airTemperature+waterTemperature<=50) {
      document.getElementById("airTemp").classList.add("danger-value","blinking");
      document.getElementById("waterTemp").classList.add("danger-value","blinking");
    }
    if(wbgtValue>=35) document.getElementById("wbgt").classList.add("danger-value","blinking");
  }

  // 履歴追加
  addHistory("気温",airTemperature);
  addHistory("水温",waterTemperature);
  addHistory("WBGT",wbgtValue);
}

function cycle(){
  showPending();
  setTimeout(showResult,10000);
}

cycle();
setInterval(cycle,30000);
</script>
</body>
</html>
