<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Yahoo を埋め込む（iframe）</title>
  <style>
    body, html { height:100%; margin:0; }
    iframe { width:100%; height:100vh; border:0; }
    .blocked { padding:20px; text-align:center; color:#c00; }
  </style>
</head>
<body>
  <iframe id="yahooFrame" src="https://www.yahoo.co.jp" title="Yahoo"></iframe>

  <noscript class="blocked">JavaScriptが無効です。リンクを開いてください： <a href="https://www.yahoo.co.jp" target="_blank">Yahoo</a></noscript>

  <script>
    // iframeが読み込めない（ブロックされる）場合の簡単な検出と代替表示
    const f = document.getElementById('yahooFrame');
    f.addEventListener('load', () => {
      try {
        // クロスオリジンだとアクセスできないのでエラーが出る場合がある
        const doc = f.contentDocument || f.contentWindow.document;
        // 正常に読めたら何もしない
      } catch (e) {
        // ブロックされている可能性が高い → 代替UIを表示
        const div = document.createElement('div');
        div.className = 'blocked';
        div.innerHTML = 'このページは埋め込みが許可されていないため表示できません。<br>' +
                        '<a href="https://www.yahoo.co.jp" target="_blank" rel="noopener">新しいタブでYahooを開く</a>';
        document.body.innerHTML = '';
        document.body.appendChild(div);
      }
    });
  </script>
</body>
</html>
