<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ワニワニパニック タイマー</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      padding-top: 40px;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    h1 {
      margin-bottom: 10px;
    }
    #countdown {
      font-size: 2em;
      margin: 10px 0;
    }
    #timer {
      font-size: 80px;
      font-weight: bold;
      color: #ff4500;
      margin: 30px 0;
      transition: all 0.3s ease;
    }
    #score {
      font-size: 2em;
      margin: 20px 0;
    }
    button {
      margin: 10px;
      font-size: 1.2em;
      padding: 10px 25px;
      border-radius: 10px;
      border: 2px solid #4682b4;
      cursor: pointer;
    }
    #startBtn {
      background-color: #98fb98;
    }
    #startBtn:hover {
      background-color: #7fffd4;
    }
    #resetBtn {
      background-color: #add8e6;
    }
    #resetBtn:hover {
      background-color: #87cefa;
    }
  </style>
</head>
<body>

  <h1>🐊 ワニワニパニック！</h1>
  <div id="countdown">スタート待ち</div>
  <div id="timer">30</div>
  <div id="score">スコア：0</div>

  <div>
    <button id="startBtn">▶️ スタート</button>
    <button id="resetBtn">🔁 リセット</button>
  </div>

  <!-- 効果音 -->
  <audio id="hitSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
  <audio id="startSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
  <audio id="endSound" src="https://actions.google.com/sounds/v1/cartoon/concussive_hit_guitar_boing.ogg"></audio>

  <script>
    let countdownTime = 5;
    let gameTime = 30;
    let score = 0;
    let countdownTimer;
    let gameTimer;
    let isPlaying = false;

    const countdownDisplay = document.getElementById("countdown");
    const timerDisplay = document.getElementById("timer");
    const scoreDisplay = document.getElementById("score");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");

    const hitSound = document.getElementById("hitSound");
    const startSound = document.getElementById("startSound");
    const endSound = document.getElementById("endSound");

    // ===== カウントダウン開始 =====
    function startCountdown() {
      startBtn.disabled = true;
      countdownTime = 5;
      countdownDisplay.textContent = `スタートまで：${countdownTime}`;
      timerDisplay.textContent = "30";
      timerDisplay.style.fontSize = "80px";
      countdownTimer = setInterval(() => {
        countdownTime--;
        countdownDisplay.textContent = `スタートまで：${countdownTime}`;
        if (countdownTime <= 0) {
          clearInterval(countdownTimer);
          countdownDisplay.textContent = "スタート！";
          startSound.play();
          startGame();
        }
      }, 1000);
    }

    // ===== ゲーム開始 =====
    function startGame() {
      isPlaying = true;
      gameTime = 30;
      timerDisplay.textContent = gameTime;
      gameTimer = setInterval(() => {
        gameTime--;
        timerDisplay.textContent = gameTime;
        if (gameTime <= 0) {
          clearInterval(gameTimer);
          countdownDisplay.textContent = "終了！";
          timerDisplay.textContent = "終了！";
          timerDisplay.style.fontSize = "120px";
          timerDisplay.style.color = "#ff0000";
          endSound.play();
          isPlaying = false;
          startBtn.disabled = false;
        }
      }, 1000);
    }

    // ===== タップでスコア加算 =====
    document.body.addEventListener("click", () => {
      if (isPlaying) {
        score++;
        scoreDisplay.textContent = `スコア：${score}`;
        hitSound.currentTime = 0;
        hitSound.play();
      }
    });

    // ===== スタートボタン =====
    startBtn.addEventListener("click", () => {
      if (!isPlaying) {
        score = 0;
        scoreDisplay.textContent = `スコア：0`;
        countdownDisplay.textContent = "カウントダウン開始！";
        timerDisplay.style.color = "#ff4500";
        timerDisplay.style.fontSize = "80px";
        startCountdown();
      }
    });

    // ===== リセットボタン =====
    resetBtn.addEventListener("click", () => {
      clearInterval(countdownTimer);
      clearInterval(gameTimer);
      countdownTime = 5;
      gameTime = 30;
      score = 0;
      isPlaying = false;
      countdownDisplay.textContent = "スタート待ち";
      timerDisplay.textContent = "30";
      timerDisplay.style.fontSize = "80px";
      timerDisplay.style.color = "#ff4500";
      scoreDisplay.textContent = "スコア：0";
      startBtn.disabled = false;
    });
  </script>
</body>
</html>
