<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乗換案内 - 駅情報表示</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
  h1 { color: #2c3e50; text-align: center; }
  .station-card { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  select { padding: 8px; font-size: 1em; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background-color: #1abc9c; color: white; }
</style>
</head>
<body>

<h1>茅ヶ崎駅から行く駅情報</h1>

<div class="station-card">
  <label for="stationSelect">到着駅を選んでください:</label>
  <select id="stationSelect">
    <option value="">--選択--</option>
    <option value="平塚">平塚</option>
    <option value="伊勢原">伊勢原</option>
    <option value="北山田">北山田</option>
    <option value="上溝">上溝</option>
  </select>

  <div id="stationInfo"></div>
</div>

<script>
  const apiKey = "PzxlDEoV2yLKdq9T9Vfecv2f"; // 路線図フリープランキー
  const stationSelect = document.getElementById("stationSelect");
  const stationInfoDiv = document.getElementById("stationInfo");

  stationSelect.addEventListener("change", async () => {
    const stationName = stationSelect.value;
    if (!stationName) {
      stationInfoDiv.innerHTML = "";
      return;
    }

    try {
      const url = `https://rmap.ekispert.jp/v1/json/station/light?key=${apiKey}&name=${encodeURIComponent(stationName)}`;
      const res = await fetch(url);
      const data = await res.json();

      if (!data.result || data.result.length === 0) {
        stationInfoDiv.innerHTML = "<p>駅情報が見つかりませんでした。</p>";
        return;
      }

      const station = data.result[0];
      let html = `<table>
        <tr><th>駅名</th><td>${station.name}</td></tr>
        <tr><th>駅コード</th><td>${station.code}</td></tr>
        <tr><th>路線名</th><td>${station.line ? station.line.name : "なし"}</td></tr>
        <tr><th>所在地</th><td>${station.prefecture || ""} ${station.city || ""}</td></tr>
      </table>`;

      stationInfoDiv.innerHTML = html;

    } catch(err) {
      console.error(err);
      stationInfoDiv.innerHTML = "<p>駅情報の取得に失敗しました。</p>";
    }
  });
</script>

</body>
</html>
