<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>School Timetable</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f3f5fa;
    color: #333;
  }
  header {
    background: #4f6df5;
    color: #fff;
    padding: 16px 24px;
    font-size: 20px;
    font-weight: bold;
  }
  main {
    max-width: 900px;
    margin: auto;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  h2 {
    margin-top: 0;
    font-size: 18px;
    border-left: 4px solid #4f6df5;
    padding-left: 8px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 14px;
    background: #e5e8ff;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab.active {
    background: #4f6df5;
    color: #fff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    border: 1px solid #e0e3ef;
    padding: 8px;
    text-align: center;
  }
  th {
    background: #eef1ff;
  }
  .subject {
    padding: 6px;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
  }

  /* 科目カラー */
  .国語 { background: #e74c3c; }
  .数学 { background: #3498db; }
  .英語 { background: #2ecc71; }
  .理科 { background: #9b59b6; }
  .社会 { background: #e67e22; }
  .情報 { background: #16a085; }
  .体育 { background: #f1c40f; color:#000; }
  .その他 { background: #7f8c8d; }

  .mode-btn {
    padding: 10px;
    background: #ff7f50;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    margin-bottom: 10px;
  }
  #shortBtn {
    background: #6a5acd;
  }
</style>
</head>
<body>

<header>School Timetable</header>

<main>

  <!-- モード切り替え -->
  <button id="holidayBtn" class="mode-btn" onclick="toggleHoliday()">長期休みモード：OFF</button>
  <button id="shortBtn" class="mode-btn" onclick="toggleShort()">40分授業モード：OFF</button>

  <!-- 次の授業まで -->
  <div class="card">
    <h2>次の授業まで</h2>
    <div id="countdown">計算中...</div>
  </div>

  <!-- 今日の授業 -->
  <div class="card">
    <h2>今日の授業</h2>
    <div id="today"></div>
  </div>

  <!-- チャイム時間 -->
  <div class="card">
    <h2>チャイム時間</h2>
    <div id="chime"></div>
  </div>

  <!-- 時間割 -->
  <div class="card" id="timetableCard">
    <h2>時間割</h2>

    <div class="tabs">
      <div class="tab active" onclick="showDay('月', this)">月</div>
      <div class="tab" onclick="showDay('火', this)">火</div>
      <div class="tab" onclick="showDay('水', this)">水</div>
      <div class="tab" onclick="showDay('木', this)">木</div>
      <div class="tab" onclick="showDay('金', this)">金</div>
      <div class="tab" onclick="showDay('土', this)">土</div>
    </div>

    <table id="timetable"></table>
  </div>

</main>

<script>
/* -------------------------
   モード管理
------------------------- */
let holiday = false;
let shortMode = false;

function toggleHoliday() {
  holiday = !holiday;
  document.getElementById("holidayBtn").innerText =
    `長期休みモード：${holiday ? "ON" : "OFF"}`;
  renderToday();
  document.getElementById("timetableCard").style.display =
    holiday ? "none" : "block";
}

function toggleShort() {
  shortMode = !shortMode;
  document.getElementById("shortBtn").innerText =
    `40分授業モード：${shortMode ? "ON" : "OFF"}`;
  renderChime();
}

/* -------------------------
   固定時間割データ（月〜土）
   [科目, 教室]
------------------------- */
const timetable = {
  "月": [
    ["国語", "101"],
    ["数学", "202"],
    ["英語", "303"],
    ["社会", "204"],
    ["理科", "401"],
    ["体育", "体育館"]
  ],
  "火": [
    ["数学", "202"],
    ["英語", "303"],
    ["国語", "101"],
    ["理科", "401"],
    ["社会", "204"],
    ["情報", "PC室"]
  ],
  "水": [
    ["英語", "303"],
    ["国語", "101"],
    ["数学", "202"],
    ["体育", "体育館"],
    ["理科", "401"],
    ["社会", "204"]
  ],
  "木": [
    ["理科", "401"],
    ["社会", "204"],
    ["英語", "303"],
    ["国語", "101"],
    ["数学", "202"],
    ["情報", "PC室"]
  ],
  "金": [
    ["社会", "204"],
    ["理科", "401"],
    ["体育", "体育館"],
    ["数学", "202"],
    ["英語", "303"],
    ["国語", "101"]
  ],
  "土": [
    ["数学", "202"],
    ["英語", "303"],
    ["国語", "101"],
    ["理科", "401"]
  ]
};

/* -------------------------
   チャイム時間（通常）
------------------------- */
const chimeTimes = {
  weekday: [
    ["1限", "08:40 - 09:30"],
    ["2限", "09:40 - 10:30"],
    ["3限", "10:40 - 11:30"],
    ["4限", "11:40 - 12:30"],
    ["5限", "13:20 - 14:10"],
    ["6限", "14:20 - 15:10"]
  ],
  saturday: [
    ["1限", "08:40 - 09:30"],
    ["2限", "09:40 - 10:30"],
    ["3限", "10:40 - 11:30"],
    ["4限", "11:40 - 12:30"]
  ]
};

/* -------------------------
   チャイム時間（40分授業）
   4限→5限の休みは50分のまま
------------------------- */
const chimeTimesShort = {
  weekday: [
    ["1限", "08:40 - 09:20"],
    ["2限", "09:30 - 10:10"],
    ["3限", "10:20 - 11:00"],
    ["4限", "11:10 - 11:50"],
    // 11:50〜12:40 が 50分休み
    ["5限", "12:40 - 13:20"],
    ["6限", "13:30 - 14:10"]
  ],
  saturday: [
    ["1限", "08:40 - 09:20"],
    ["2限", "09:30 - 10:10"],
    ["3限", "10:20 - 11:00"],
    ["4限", "11:10 - 11:50"]
  ]
};

function renderChime() {
  const div = document.getElementById("chime");
  const date = new Date();
  const day = date.getDay(); // 0=日,6=土

  const list = (day === 6)
    ? (shortMode ? chimeTimesShort.saturday : chimeTimes.saturday)
    : (shortMode ? chimeTimesShort.weekday : chimeTimes.weekday);

  let html = "";
  list.forEach(t => {
    html += `${t[0]}：${t[1]}<br>`;
  });

  div.innerHTML = html;
}
renderChime();

/* -------------------------
   今日の授業を表示
------------------------- */
function renderToday() {
  const todayDiv = document.getElementById("today");
  const date = new Date();
  const week = ["日","月","火","水","木","金","土"];
  const day = week[date.getDay()];

  let html = `<strong>${date.toLocaleDateString("ja-JP")}（${day}）</strong><br><br>`;

  if (holiday) {
    html += "長期休み中のため授業はありません";
  } else if (day === "日") {
    html += "今日は授業がありません";
  } else {
    timetable[day].forEach((item, i) => {
      const [subj, room] = item;
      html += `${i+1}限：<span class="subject ${subj}">${subj}</span>（${room}）<br>`;
    });
  }

  todayDiv.innerHTML = html;
}
renderToday();

/* -------------------------
   曜日タブ切り替え
------------------------- */
function showDay(day, el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");

  const table = document.getElementById("timetable");
  let html = `
    <tr><th>時限</th><th>科目</th><th>教室</th></tr>
  `;
  timetable[day].forEach((item, i) => {
    const [subj, room] = item;
    html += `
      <tr>
        <td>${i+1}</td>
        <td><span class="subject ${subj}">${subj}</span></td>
        <td>${room}</td>
      </tr>
    `;
  });
  table.innerHTML = html;
}
showDay("月", document.querySelector(".tab"));

/* -------------------------
   次の授業までのカウントダウン
------------------------- */
function getTodayScheduleTimes() {
  const date = new Date();
  const day = date.getDay(); // 0=日,6=土

  if (holiday || day === 0) return [];

  const list = (day === 6)
    ? (shortMode ? chimeTimesShort.saturday : chimeTimes.saturday)
    : (shortMode ? chimeTimesShort.weekday : chimeTimes.weekday);

  return list.map(period => {
    const [label, timeRange] = period;
    const [start, end] = timeRange.split(" - ");

    const startDate = new Date();
    const [sh, sm] = start.split(":").map(Number);
    startDate.setHours(sh, sm, 0, 0);

    return { label, start: startDate };
  });
}

function updateCountdown() {
  const countdownDiv = document.getElementById("countdown");

  if (holiday) {
    countdownDiv.innerHTML = "長期休み中のため授業はありません";
    return;
  }

  const now = new Date();
  const schedule = getTodayScheduleTimes();

  if (schedule.length === 0) {
    countdownDiv.innerHTML = "今日は授業がありません";
    return;
  }

  const next = schedule.find(p => p.start > now);

  if (!next) {
    countdownDiv.innerHTML = "本日の授業はすべて終了しました";
    return;
  }

  const diff = next.start - now;
  const h = Math.floor(diff / 1000 / 60 / 60);
  const m = Math.floor((diff / 1000 / 60) % 60);
  const s = Math.floor((diff / 1000) % 60);

  countdownDiv.innerHTML =
    `${next.label} まで残り <strong>${h}時間 ${m}分 ${s}秒</strong>`;
}

setInterval(updateCountdown, 1000);
updateCountdown();

/* -------------------------
   チャイム音（開始・終了）
------------------------- */
const chimeStart = new Audio("start.mp3");
const chimeEnd = new Audio("end.mp3");
let lastPlayed = "";

function formatHM(date) {
  return String(date.getHours()).padStart(2, "0") + ":" +
         String(date.getMinutes()).padStart(2, "0");
}

function checkChime() {
  if (holiday) return;

  const now = new Date();
  const nowHM = formatHM(now);

  const date = new Date();
  const day = date.getDay(); // 0=日,6=土

  const list = (day === 6)
    ? (shortMode ? chimeTimesShort.saturday : chimeTimes.saturday)
    : (shortMode ? chimeTimesShort.weekday : chimeTimes.weekday);

  for (const period of list) {
    const [label, timeRange] = period;
    const [start, end] = timeRange.split(" - ");

    if (nowHM === start && lastPlayed !== start) {
      chimeStart.play();
      lastPlayed = start;
    }

    if (nowHM === end && lastPlayed !== end) {
      chimeEnd.play();
      lastPlayed = end;
    }
  }
}

setInterval(checkChime, 1000);
</script>

</body>
</html>
