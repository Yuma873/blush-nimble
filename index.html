<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ログイン</title>
<link rel="shortcut icon" href="favicon.png" type="image/png">

<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #005bac, #0081cc);
  font-family: "Segoe UI", sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.login-container {
  background: white;
  padding: 40px 30px;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  max-width: 380px;
  width: 100%;
  animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(-10px); }
  to { opacity:1; transform:translateY(0); }
}

h2 {
  margin-bottom: 20px;
  text-align: center;
  color: #005bac;
  font-size: 24px;
}

label {
  display: block;
  margin: 12px 0 6px;
  color: #333;
  font-size: 14px;
}

input[type="text"],
input[type="password"] {
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  box-sizing:border-box;
  font-size:14px;
}

input:focus {
  border-color:#005bac;
  outline:none;
}

.toggle {
  margin:10px 0;
  font-size:13px;
}

.warn {
  font-size:12px;
  color:#888;
}

.error-message {
  color:red;
  margin-top:10px;
  text-align:center;
  font-size:13px;
}

#strength-bar {
  height:8px;
  border-radius:4px;
  margin-top:5px;
  width:0;
  transition:width 0.3s, background-color 0.3s;
}

.last-device {
  font-size:12px;
  color:#555;
  margin-top:8px;
  padding:6px;
  background:#f0f0f0;
  border-radius:6px;
}

button {
  margin-top:20px;
  width:100%;
  padding:12px;
  font-size:16px;
  border:none;
  background-color:#005bac;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

button:hover { background-color:#00488c; }
button:disabled { background-color:#999; }

#admin-login-btn {
  position:fixed;
  top:12px;
  right:12px;
  padding:6px 12px;
  font-size:12px;
  border:none;
  border-radius:6px;
  background-color:#d93025;
  color:white;
  cursor:pointer;
  z-index:10000;
}

/* ログイン中ポップアップ */
.loading {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  color:white;
}

.loading .spinner {
  width:50px;
  height:50px;
  border:5px solid #ccc;
  border-top:5px solid #fff;
  border-radius:50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform:rotate(0deg); }
  100% { transform:rotate(360deg); }
}
</style>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>

<div class="login-container">
  <h2>ログイン</h2>

  <label>ユーザーID</label>
  <input type="text" id="username">

  <label>パスワード</label>
  <input type="password" id="password">
  <div id="strength-bar"></div>

  <div class="toggle">
    <input type="checkbox" onclick="togglePassword()"> パスワードを表示
  </div>

  <div class="last-device" id="last-device">前回ログイン情報はありません</div>

  <div class="g-recaptcha" data-sitekey="6Lc8t_grAAAAAFDGM9M6R1weWRC47R1m-JMwVJ8g"></div>

  <button id="login-btn">ログイン</button>
  <div class="error-message" id="error-msg"></div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>ログインしています...</p>
</div>

<button id="admin-login-btn" onclick="location.href='kanri.html'">管理アカウント</button>

<script>
function togglePassword(){
  const p = document.getElementById("password");
  p.type = p.type === "password" ? "text" : "password";
}

document.addEventListener("contextmenu", e => e.preventDefault());
document.getElementById("password").addEventListener("paste", e => e.preventDefault());

const bar = document.getElementById("strength-bar");
document.getElementById("password").addEventListener("input", e => {
  let s = 0;
  const v = e.target.value;
  if(v.length>=8) s++;
  if(/[A-Z]/.test(v)) s++;
  if(/[a-z]/.test(v)) s++;
  if(/[0-9]/.test(v)) s++;
  if(/[^A-Za-z0-9]/.test(v)) s++;
  bar.style.width = (s/5*100)+"%";
  bar.style.background = s<=2?"red":s<=4?"orange":"green";
});

const last = localStorage.getItem("lastDeviceInfo");
if(last) document.getElementById("last-device").textContent = "前回: "+last;

const users = [{name:"oshiki",password:"Oshiki",link:"portal.html"}];

document.getElementById("login-btn").onclick = () => {
  const u = username.value.trim();
  const p = password.value.trim();
  if(!u||!p) return errorMsg.textContent="未入力です";

  if(grecaptcha.getResponse().length===0)
    return errorMsg.textContent="reCAPTCHAを完了してください";

  const user = users.find(x=>x.name===u && x.password===p);
  if(!user) return errorMsg.textContent="認証失敗";

  loading.style.display="flex";

  let info = navigator.userAgent+" / "+new Date().toLocaleString();
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      info += ` / ${pos.coords.latitude.toFixed(3)},${pos.coords.longitude.toFixed(3)}`;
      localStorage.setItem("lastDeviceInfo",info);
    },()=>localStorage.setItem("lastDeviceInfo",info));
  }

  setTimeout(()=>location.href=user.link,1500);
};
</script>
</body>
</html>
