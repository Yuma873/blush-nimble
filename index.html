<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 400px;
    }

    h2 {
      margin-bottom: 24px;
      color: #333;
      text-align: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background-color: #1abc9c;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .login-button:hover {
      background-color: #16a085;
    }

    .error {
      color: red;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>ログインページ</h2>
    <input type="text" id="username" placeholder="ログインID" />
    <input type="password" id="password" placeholder="パスワード" />
    <button class="login-button" onclick="login()">ログイン</button>
    <p class="error" id="errorMsg">ログインIDまたはパスワードが間違っています</p>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      // 管理者ログイン情報（必要に応じて変更）
      const adminId = "admin";
      const adminPass = "adminpass";

      if (username === adminId && password === adminPass) {
        // 管理者の場合のリダイレクト
        window.location.href = "https://github.com/Yuma873/blush-nimble";
      } else if (username && password) {
        // 一般ユーザー向け仮動作（適宜処理を追加）
        alert("一般ユーザーとしてログインしました。");
        // ここに一般ユーザー用のページへの遷移など追加できます
      } else {
        // 入力不足やエラー表示
        document.getElementById("errorMsg").style.display = "block";
      }
    }
  </script>
</body>
</html>
