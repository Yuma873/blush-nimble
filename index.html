<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />          
<title>ログイン</title>
<link rel="shortcut icon" href="favicon.png" type="image/png">

<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #005bac, #0081cc);
  font-family: "Segoe UI", sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.login-container {
  background: white;
  padding: 40px 30px;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  max-width: 380px;
  width: 100%;
  animation: fadeIn 0.6s ease-in-out;
  position: relative;
}
@keyframes fadeIn {
  from {opacity:0; transform:translateY(-10px);}
  to {opacity:1; transform:translateY(0);}
}
h2 {
  margin-bottom: 20px;
  text-align: center;
  color: #005bac;
  font-size: 24px;
}
label {
  display: block;
  margin: 12px 0 6px;
  color: #333;
  font-size: 14px;
}
input[type="text"], input[type="password"] {
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  box-sizing:border-box;
  font-size:14px;
  transition:border-color 0.3s;
}
input:focus {
  border-color:#005bac;
  outline:none;
}
.input-error {
  border-color:red !important;
}
.toggle {
  margin:10px 0;
  font-size:13px;
}
.toggle input {
  margin-right:5px;
}
.warn {
  font-size:12px;
  color:#888;
}
.error-message {
  color:red;
  margin-top:10px;
  text-align:center;
  font-size:13px;
}
#caps-warning {
  color:red;
  font-size:12px;
  display:none;
}
#strength-bar {
  height:8px;
  border-radius:4px;
  margin-top:5px;
  transition:width 0.3s, background-color 0.3s;
  width:0;
}
.last-device {
  font-size:12px;
  color:#555;
  margin-top:6px;
  padding:6px;
  background:#f0f0f0;
  border-radius:6px;
}
button {
  margin-top:20px;
  width:100%;
  padding:12px;
  font-size:16px;
  border:none;
  background-color:#005bac;
  color:white;
  border-radius:6px;
  cursor:pointer;
  transition: background-color 0.3s;
}
button:hover:enabled {
  background-color:#00488c;
}
button:disabled {
  background-color:#999 !important;
  cursor:not-allowed;
}
#admin-login-btn {
  position:fixed;
  top:12px;
  right:12px;
  padding:6px 12px;
  font-size:12px;
  border:none;
  border-radius:6px;
  background-color:#d93025;
  color:white;
  cursor:pointer;
  opacity:0.9;
  transition:background-color 0.3s, opacity 0.3s;
  z-index:10000;
}
#admin-login-btn:hover {
  background-color:#a52714;
  opacity:1;
}
.loading {
  display:none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index: 9999;
  flex-direction: column;
  color:white;
}
.loading .spinner {
  width:50px;
  height:50px;
  border:5px solid #ccc;
  border-top:5px solid #fff;
  border-radius:50%;
  animation: spin 1s linear infinite;
}
.loading p {
  margin-top:10px;
  font-size:16px;
  text-align:center;
}
@keyframes spin {
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
</style>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>

<div class="login-container">
  <h2></h2>

  <label for="username">ユーザーID</label>
  <input type="text" id="username" placeholder="userID" />

  <label for="password">パスワード</label>
  <input type="password" id="password" placeholder="password" />
  <div id="strength-bar"></div>

  <div id="caps-warning">Caps Lock が有効です</div>

  <div class="toggle">
    <input type="checkbox" id="showpass" onclick="togglePassword()" />
    <label for="showpass">パスワードを表示</label>
    <div class="warn">※共用のパソコン等ではチェックを入れないでください。</div>
  </div>

  <div class="last-device" id="last-device">前回ログイン情報はありません</div>

  <div class="g-recaptcha"
       data-sitekey="6Lc8t_grAAAAAFDGM9M6R1weWRC47R1m-JMwVJ8g"
       data-callback="recaptchaCallback"></div>
  <div class="warn">認証を完了させてからログインボタンを押してください</div>

  <button id="login-btn" disabled>ログイン</button>

  <div style="text-align:right; margin-top:10px;">
    <a href="system.html" style="color:#005bac; font-weight:bold; text-decoration:none;">サーバー稼働状況 ▶</a>
  </div>

  <div class="error-message" id="error-msg"></div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>ログインしています...</p>
  <p>*この読み込みは時間がかかる場合があります</p>
</div>

<div style="margin-top: 25px; text-align: center;">
<nobr>
<table border="0" cellspacing="0" cellpadding="0">
<tbody>
<tr>
<td>
<a href="https://ctr.stylemap.co.jp/">
<img src="https://www.f-counter.net/ani1/66/1763895419/" alt="アクセスカウンター">
</a>
</td>
<td>
<a href="https://ctr.stylemap.co.jp/">
<img src="https://www.f-counter.net/ani2/66/1763895419/" alt="アクセスカウンター">
</a>
</td>
</tr>
</tbody>
</table>
</nobr>
</div>

<button id="admin-login-btn" type="button">管理アカウントでログイン</button>

<script>
/* ===== 設定 ===== */
const MAX_FAIL = 3;
const LOCK_TIME = 2 * 60 * 1000;

/* ===== 管理 ===== */
document.getElementById("admin-login-btn").addEventListener("click", function() {
  window.location.href = "https://yuma873.github.io/blush-nimble/kanri.html";
});

/* ===== 表示切替 ===== */
function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = document.getElementById("showpass").checked ? "text" : "password";
}

/* ===== CapsLock ===== */
const capsWarning = document.getElementById("caps-warning");
document.getElementById("password").addEventListener("keyup", e=>{
  capsWarning.style.display = e.getModifierState("CapsLock") ? "block" : "none";
});

/* ===== 強度 ===== */
const passwordInput = document.getElementById("password");
const strengthBar = document.getElementById("strength-bar");
passwordInput.addEventListener('input', () => {
  const val = passwordInput.value;
  let strength = 0;
  if(val.length >= 8) strength++;
  if(/[A-Z]/.test(val)) strength++;
  if(/[a-z]/.test(val)) strength++;
  if(/[0-9]/.test(val)) strength++;
  if(/[^A-Za-z0-9]/.test(val)) strength++;
  const percent = (strength / 5) * 100;
  strengthBar.style.width = percent + "%";
  if(strength <= 2) strengthBar.style.backgroundColor = "red";
  else if(strength <= 4) strengthBar.style.backgroundColor = "orange";
  else strengthBar.style.backgroundColor = "green";
});

/* ===== 前回端末 ===== */
const lastDevice = document.getElementById("last-device");
const prevInfo = localStorage.getItem("lastDeviceInfo");
if (prevInfo) lastDevice.textContent = `前回ログイン端末: ${prevInfo}`;

/* ===== ユーザー（完全一致） ===== */
const users = [
  { name: "oshiki", password: "Oshiki", link: "https://yuma873.github.io/blush-nimble/portal.html" },
  { name: "osk", password: "Oshiki", link: "https://yuma873.github.io/blush-nimble/portal-tool.html" },
  { name: "Jsuwkmlsi917Iwk19072", password: "Oshiki", link: "https://yuma873.github.io/blush-nimble/toppage.html" }
];

/* ===== reCAPTCHA ===== */
function recaptchaCallback() {
  document.getElementById("login-btn").disabled = false;
}

/* ===== ロックカウント ===== */
function checkLock(){
  const until = localStorage.getItem("lockUntil");
  if(!until) return;
  const remain = until - Date.now();
  if(remain <= 0){
    localStorage.removeItem("lockUntil");
    localStorage.removeItem("failCount");
    document.getElementById("error-msg").textContent="";
    document.getElementById("login-btn").disabled=false;
  }else{
    document.getElementById("login-btn").disabled=true;
    document.getElementById("error-msg").textContent =
      `ログインは ${Math.ceil(remain/1000)} 秒後に再試行できます`;
  }
}
setInterval(checkLock,1000);
checkLock();

/* ===== ログイン ===== */
document.getElementById("login-btn").addEventListener("click", handleLogin);

function handleLogin() {
  const loginBtn = document.getElementById("login-btn");
  const errorMsg = document.getElementById("error-msg");
  const loading = document.getElementById("loading");

  const name = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  document.getElementById("username").classList.remove("input-error");
  document.getElementById("password").classList.remove("input-error");

  if (!name || !pass) {
    errorMsg.textContent = "ユーザー名とパスワードを入力してください。";
    document.getElementById("username").classList.add("input-error");
    document.getElementById("password").classList.add("input-error");
    return;
  }

  const user = users.find(u => u.name === name && u.password === pass);
  if (!user) {
    let fail = Number(localStorage.getItem("failCount") || 0) + 1;
    localStorage.setItem("failCount", fail);
    if (fail >= MAX_FAIL) {
      localStorage.setItem("lockUntil", Date.now() + LOCK_TIME);
    }
    errorMsg.textContent = `ユーザーIDまたはパスワードが異なります。`;
    document.getElementById("username").classList.add("input-error");
    document.getElementById("password").classList.add("input-error");
    return;
  }

  localStorage.removeItem("failCount");
  localStorage.removeItem("lockUntil");

  loading.style.display = "flex";
  loginBtn.disabled = true;

  setTimeout(() => {
    loading.style.display = "none";
    window.location.href = user.link;
  }, 1500);
}
</script>

</body>
</html>
