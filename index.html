<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ログイン</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #005bac, #0081cc);
      font-family: "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding-bottom: 40px; /* 下のテロップ分の余白 */
    }

    .login-container {
      background: white;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      max-width: 380px;
      width: 100%;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #005bac;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #333;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #005bac;
      outline: none;
    }

    .toggle {
      margin: 10px 0;
      font-size: 13px;
    }

    .toggle input {
      margin-right: 5px;
    }

    .warn {
      font-size: 12px;
      color: #888;
    }

    .error-message {
      color: red;
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      background-color: #005bac;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover:not(:disabled) {
      background-color: #00488c;
    }

    button:disabled {
      background-color: #888 !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .loading {
      display: none;
      margin-top: 20px;
      text-align: center;
      color: #005bac;
      font-size: 14px;
    }

    .spinner {
      margin: 10px auto;
      width: 30px;
      height: 30px;
      border: 4px solid #ccc;
      border-top: 4px solid #005bac;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }

    #admin-login-btn {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      font-size: 12px;
      border: none;
      border-radius: 0 0 6px 6px;
      background-color: #e53935;
      color: white;
      cursor: pointer;
      opacity: 0.9;
      transition: opacity 0.3s;
      z-index: 10000;
    }
    #admin-login-btn:hover:not(:disabled) {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>ログイン</h2>
    <label for="username">ユーザー名</label>
    <input type="text" id="username" placeholder="例: username" />

    <label for="password">パスワード</label>
    <input type="password" id="password" placeholder="例: password" />

    <div class="toggle">
      <input type="checkbox" id="showpass" onclick="togglePassword()" />
      <label for="showpass">パスワードを表示</label>
      <div class="warn">※共用のパソコン等ではチェックを入れないでください。</div>
    </div>

    <button onclick="handleLogin()">ログイン</button>

    <div class="error-message" id="error-msg"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      ログインしています...*この読み込みは時間がかかる場合があります
    </div>
  </div>

  <button id="admin-login-btn" type="button" aria-label="管理アカウントでログイン">管理アカウントでログイン</button>

  <div class="ticker-wrapper">
    <div class="ticker">
      <span>📢 お知らせ：メンテナンスは毎週水曜 18:00～実施予定です。ご協力お願いします。</span>
    </div>
  </div>

  <script>
    const users = [
      { name: "oshiki", password: "Oshiki", link: "https://yuma873.github.io/blush-nimble/portal.html" },
      { name: "guest", password: "guest123", link: "https://yuma873.github.io/blush-nimble/portal.html" }
    ];

    const loginLimit = 3;
    let attempts = loginLimit;

    document.getElementById("username").focus();

    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = document.getElementById("showpass").checked ? "text" : "password";
    }

    function handleLogin() {
      const userField = document.getElementById("username");
      const passField = document.getElementById("password");
      const errorMsg = document.getElementById("error-msg");
      const loading = document.getElementById("loading");

      const name = userField.value.trim();
      const pass = passField.value.trim();

      errorMsg.textContent = "";
      if (!name || !pass) {
        errorMsg.textContent = "ユーザー名とパスワードを入力してください。";
        return;
      }

      const user = users.find(u => u.name === name && u.password === pass);
      if (!user) {
        attempts--;
        errorMsg.textContent = `認証失敗（残り${attempts}回）`;
        if (attempts <= 0) {
          errorMsg.textContent = "ログイン失敗が続いたため、操作をロックしました。";
          document.querySelector("button").disabled = true;
        }
        return;
      }

      // 成功
      loading.style.display = "block";
      setTimeout(() => {
        window.location.href = user.link;
      }, 1500);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });


    // 管理アカウントボタンの制御（火曜22:00～23:00メンテナンス時間で無効化）
    const adminLoginBtn = document.getElementById("admin-login-btn");

    function checkMaintenanceTime() {
      const now = new Date();
      const day = now.getDay();    // 0=日曜, 1=月曜, 2=火曜, ...
      const hour = now.getHours();

      // 火曜（2）の22時〜23時のみ無効にする
      if (day === 2 && hour === 22) {
        adminLoginBtn.disabled = true;
        adminLoginBtn.title = "メンテナンス時間のため利用できません";
        adminLoginBtn.style.opacity = "0.6";
        adminLoginBtn.style.cursor = "not-allowed";
      } else {
        adminLoginBtn.disabled = false;
        adminLoginBtn.title = "";
        adminLoginBtn.style.opacity = "0.9";
        adminLoginBtn.style.cursor = "pointer";
      }
    }

    // ページ読み込み時にチェック
    checkMaintenanceTime();
    // 1分ごとにチェックし続ける（長時間開いたままでも対応）
    setInterval(checkMaintenanceTime, 60 * 1000);

    // 管理アカウントボタンのクリックイベント
    adminLoginBtn.addEventListener("click", () => {
      if (!adminLoginBtn.disabled) {
        window.location.href = "https://yuma873.github.io/blush-nimble/kanri.html";
      }
    });
  </script>

  <style>
    .ticker-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffeb3b;
      color: #222;
      font-size: 14px;
      padding: 6px 0;
      overflow: hidden;
      z-index: 9999;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
    }

    .ticker {
      display: inline-block;
      white-space: nowrap;
      animation: scroll-left 20s linear infinite;
      padding-left: 100%;
    }

    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>

</body>
</html>
