    /* ===== 起動時広告（小さめ） ===== */
.ad-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 20000;
}

.ad-box {
  position: relative;
  width: 90%;
  max-width: 500px;   /* ← 大きさ制限 */
  background: white;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  padding: 10px;
  animation: fadeIn 0.3s ease;
}

.ad-box img {
  width: 100%;
  border-radius: 8px;
}

.ad-close {
  position: absolute;
  top: -10px;
  right: -10px;
  background: #e74c3c;
  color: white;
  border: none;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 16px;
  cursor: pointer;
}

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
      display: flex;
      min-height: 100vh;
    }
    nav {
      width: 240px;
      background-color: #2c3e50;
      color: white;
      padding: 15px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      z-index: 1000;
      box-sizing: border-box;
    }
    nav video {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px;
      margin: 6px 0;
      background-color: #34495e;
      border-radius: 6px;
      text-align: center;
      transition: 0.3s;
      font-weight: 500;
    }
    nav a:hover { background-color: #1abc9c; }
    nav img { display: block; margin: 8px auto; border-radius: 6px; }

    main {
      flex: 1;
      padding: 30px;
      margin-left: 260px;
      box-sizing: border-box;
    }
    header {
      font-size: 1.6em;
      margin-bottom: 15px;
      color: #2c3e50;
      font-weight: bold;
    }
    section {
      margin-bottom: 40px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      animation: fadeIn 0.4s ease-in-out;
    }
    .update-time {
      font-size: 0.9em;
      color: #777;
      text-align: right;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #1abc9c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background-color: #16a085; }

    iframe {
      width: 100%;
      height: 780px;
      border: none;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px #ddd;
    }

    @keyframes fadeIn {
      from { opacity:0; transform:translateY(10px); }
      to { opacity:1; transform:translateY(0); }
    }

    @media(max-width:768px){
      body { flex-direction:column; }
      nav { width:100%; height:auto; position:relative; }
      main { margin-left:0; padding:15px; }
    }

    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      background-color: #2c3e50;
      color: white;
      padding: 8px 0;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 9999;
    }
    .ticker {
      display: inline-block;
      white-space: nowrap;
      animation: tickerScroll 25s linear infinite;
      padding-left: 100%;
    }
    @keyframes tickerScroll {
      from { transform:translateX(0%); }
      to { transform:translateX(-100%); }
    }
  </style>
</head>

<!-- ⏳ カウントダウン -->
<script>
  const events = [
    { name: "春季記録会(24-25)", date: "2026-05-24" },
    { name: "夏季記録会", date: "2026-06-15" },
    { name: "県高校総体(20-22)", date: "2026-06-20" },
    { name: "北相地区大会", date: "2026-07-28" },
    { name: "北相地区新人", date: "2026-09-13" },
    { name: "県新人(27-28)", date: "2026-09-27" }
  ];

  const today = new Date();
  const list = document.getElementById("countdown-list");

  events.forEach(e => {
    const d = Math.ceil((new Date(e.date) - today) / (1000*60*60*24));
    let color = "#666";
    if (d <= 7) color = "red";
    else if (d <= 30) color = "orange";
    else if (d <= 50) color = "goldenrod";

    const li = document.createElement("li");
    li.innerHTML =
      d > 60
        ? `<span style="color:#aaa;">${e.name}：あと ${d}日</span>`
        : `${e.name}：あと <strong style="color:${color}">${d}日</strong>`;
    list.appendChild(li);
  });

</script>
