<section>
  <header>⏳ 大会カウントダウン (2025年日程／2026年度版登録済み)</header>
  <ul id="countdown-list"></ul>
</section>

<script>
const events = [
  { name: "春季記録会(24-25)", date: "2026-05-24" },
  { name: "夏季記録会", date: "2026-06-15" },
  { name: "県高校総体(20-22)", date: "2026-06-20" },
  { name: "北相地区大会", date: "2026-07-28" },
  { name: "北相地区新人", date: "2026-09-13" },
  { name: "県新人(27-28)", date: "2026-09-27" }
];

const today = new Date();
const list = document.getElementById("countdown-list");

events.forEach((e) => {
  const d = Math.ceil((new Date(e.date) - today) / (1000 * 60 * 60 * 24));
  let c = "#666";
  if (d <= 7) c = "red";
  else if (d <= 30) c = "orange";
  else if (d <= 50) c = "goldenrod";

  const li = document.createElement("li");
  if (d > 60) {
    li.innerHTML = `<span style="color:#aaa; font-size:0.9em;">${e.name}：あと ${d}日</span>`;
  } else {
    li.innerHTML = `${e.name}：あと <strong style="color:${c}">${d}日</strong>`;
  }
  list.appendChild(li);
});
</script>
