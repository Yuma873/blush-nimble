<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ポータルサイト - カレンダー</title>
<link rel="shortcut icon" href="favicon2.png" type="image/png">

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    display: flex;
    background-color: #f5f5f5;
    height: 100vh;
    overflow: hidden;
  }

  /* 左ナビ固定 */
  nav {
    width: 240px;
    background-color: #2c3e50;
    color: white;
    padding: 10px;
    box-sizing: border-box;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    overflow-y: auto;
    z-index: 1000;
  }

  nav video {
    width: 100%;
    border-radius: 5px;
    margin-bottom: 10px;
  }

  nav a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 8px 12px;
    margin: 4px 0;
    background-color: #34495e;
    border-radius: 6px;
    text-align: center;
  }

  nav a:hover {
    background-color: #1abc9c;
  }

  main {
    flex: 1;
    padding: 15px;
    margin-left: 240px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }

  /* カレンダー */
  .calendar-nav { display: flex; justify-content: space-between; max-width: 700px; margin-bottom: 10px; }
  .calendar-nav button { padding: 5px 10px; font-size: 16px; cursor: pointer; }
  table.calendar { border-collapse: collapse; width: 100%; max-width: 700px; }
  table.calendar th, table.calendar td { border: 1px solid #ccc; width: 14.28%; text-align: left; vertical-align: top; padding: 5px; height: 100px; position: relative; }
  table.calendar th { background-color: #2c3e50; color: white; }
  td.today { border: 2px solid #1abc9c; }
  td.saturday { background-color: #f0f8ff; }
  td.sunday { background-color: #fff0f0; }

  /* 予定表示 */
  .events-wrapper {
    max-height: 90px;
    overflow-y: auto;
  }
  .event {
    padding: 2px 4px;
    margin: 2px 0;
    border-radius: 3px;
    color: white;
    font-size: 12px;
    display: block;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tournament { background-color: red; }
  .practice { background-color: blue; }
  .school { background-color: green; }
  .other { background-color: orange; }

  /* 凡例 */
  .legend { display: flex; gap: 8px; margin-top: 10px; font-size: 0.8em; }
  .legend div { display: flex; align-items: center; gap: 3px; }
  .legend span { width: 12px; height: 12px; display: inline-block; border-radius: 3px; }

  /* ポップアップ */
  #popup {
    display: none;
    position: fixed;
    background: white;
    border: 2px solid #333;
    padding: 8px;
    border-radius: 5px;
    z-index: 1000;
    max-width: 200px;
    word-wrap: break-word;
    font-size: 14px;
  }

  /* スマホ対応 */
  @media (max-width: 768px) {
    nav {
      width: 100%;
      height: auto;
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
    }
    nav a { display: inline-block; margin: 4px; font-size: 0.9em; }
    nav video { display: none; }
    main { margin-left: 0; margin-top: 150px; height: calc(100vh - 150px); }
  }
</style>
</head>
<body>

<nav>
  <video id="randomVideo" autoplay loop muted playsinline></video>
  <a href="portal.html">🏠 トップ</a>
  <a href="portal-news.html">📰 お知らせ</a>
  <a href="portal-tool.html">🛠 ツール</a>
  <a href="portal-renraku.html">📢 掲示板連絡</a>
  <a href="portal-pdf.html">📁ファイル一覧</a>
  <a href="portal-20251123.html">🏆次回大会 特設ページ(11/23)</a>
  <a href="https://www.r326.com/b/main.aspx?g=MI50b22j293fUk0231" target="_blank"><img src="botan.png" alt="プール開館情報" width="120"></a>
  <a href="https://www.r326.com/b/main.aspx?g=IIu0c8qZ2933SZW001" target="_blank"><img src="https://reserva.be/reserva/images/btn_reserve_2.png" alt="プール予約" width="120"></a>
  <a href="2025-wintercamp.html">⛺️ 2025年度冬合宿</a>
  <a href="https://yuma873.github.io/blush-nimble/index.html" style="display: inline-block; padding: 10px 20px; background-color: #f44336; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">🚪ログアウト</a>
</nav>

<main>
  <div class="calendar-nav">
    <button id="prev-month">&lt; 前月</button>
    <button id="today-btn">今日に戻る</button>
    <button id="next-month">次月 &gt;</button>
  </div>

  <h2 id="month-year"></h2>

  <table class="calendar">
    <thead>
      <tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr>
    </thead>
    <tbody id="calendar-body"></tbody>
  </table>

  <div class="legend">
    <div><span class="tournament"></span> 大会</div>
    <div><span class="practice"></span> 部活</div>
    <div><span class="school"></span> 学校行事</div>
    <div><span class="other"></span> その他</div>
  </div>
</main>

<div id="popup"></div>

<script>
// --- ランダム動画 ---
const videos = ["video1.mp4","video2.mp4","video3.mp4","video5.mp4","V1.mp4","V2.mp4","V3.mp4","V4.mp4","V5.mp4","V6.mp4","V7.mp4","V8.mp4","V9.mp4","V10.mp4"];
document.getElementById("randomVideo").src = videos[Math.floor(Math.random()*videos.length)];

// --- 予定設定 ---
const events = [
  { date: '2025-10-07', time: '14:00~16:00', name: '水泳部練習', type: 'practice', location: '体育館' },
  { date: '2025-10-07', time: '16:30~18:00', name: 'ミーティング', type: 'other', location: '会議室' },
  { date: '2025-10-10', time: '9:00~12:00', name: '大会：市大会', type: 'tournament', location: '市民プール' },
  { date: '2025-10-15', time: '13:00~15:00', name: '文化祭準備', type: 'school', location: '学校グラウンド' },
  { date: '2025-10-20', time: '10:00~12:00', name: '部活練習', type: 'practice', location: '体育館' },
];

let currentDate = new Date();
function zeroPad(n){ return n.toString().padStart(2,'0'); }

function generateCalendar(dateObj){
  const year = dateObj.getFullYear();
  const month = dateObj.getMonth();
  const today = new Date();
  document.getElementById('month-year').textContent = `${year}年 ${month+1}月`;

  const firstDay = new Date(year,month,1).getDay();
  const lastDate = new Date(year,month+1,0).getDate();
  const calendarBody = document.getElementById('calendar-body');
  calendarBody.innerHTML='';

  let row = document.createElement('tr');
  for(let i=0;i<firstDay;i++) row.appendChild(document.createElement('td'));

  for(let day=1;day<=lastDate;day++){
    if((firstDay+day-1)%7===0 && day!==1){ calendarBody.appendChild(row); row=document.createElement('tr'); }
    const cell=document.createElement('td');
    const cellDateStr=`${year}-${zeroPad(month+1)}-${zeroPad(day)}`;
    cell.dataset.date=cellDateStr;
    cell.innerHTML=`<strong>${day}</strong><br><div class="events-wrapper"></div>`;
    
    const dayOfWeek=(firstDay+day-1)%7;
    if(dayOfWeek===0) cell.classList.add('sunday');
    if(dayOfWeek===6) cell.classList.add('saturday');
    if(day===today.getDate() && month===today.getMonth() && year===today.getFullYear()) cell.classList.add('today');

    const wrapper = cell.querySelector('.events-wrapper');
    events.filter(ev=>ev.date===cellDateStr).forEach(ev=>{
      const div=document.createElement('span');
      div.className=`event ${ev.type}`;
      div.textContent=`${ev.time} ${ev.name}`;
      div.addEventListener('click',e=>showPopup(e,ev));
      wrapper.appendChild(div);
    });

    row.appendChild(cell);
  }

  while(row.children.length<7) row.appendChild(document.createElement('td'));
  calendarBody.appendChild(row);
}

// --- ポップアップ ---
const popup=document.getElementById('popup');
function showPopup(e,ev){
  popup.style.display='block';
  let left=e.pageX+10;
  let top=e.pageY+10;
  if(left+210>window.innerWidth) left=window.innerWidth-220;
  if(top+120>window.innerHeight) top=window.innerHeight-130;
  popup.style.left=left+'px';
  popup.style.top=top+'px';
  popup.innerHTML=`<strong>${ev.name}</strong><br>${ev.time}<br>場所: ${ev.location}`;
}

document.addEventListener('click',e=>{
  if(!e.target.classList.contains('event')) popup.style.display='none';
});

// --- ナビゲーション ---
document.getElementById('prev-month').addEventListener('click',()=>{ currentDate.setMonth(currentDate.getMonth()-1); generateCalendar(currentDate); });
document.getElementById('next-month').addEventListener('click',()=>{ currentDate.setMonth(currentDate.getMonth()+1); generateCalendar(currentDate); });
document.getElementById('today-btn').addEventListener('click',()=>{ currentDate=new Date(); generateCalendar(currentDate); });

generateCalendar(currentDate);
</script>

</body>
</html>
