<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポータルサイト - カレンダー</title>
<link rel="shortcut icon" href="favicon2.png" type="image/png">
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  display: flex;
  background-color: #f5f5f5;
  height: 100vh;
  overflow: hidden;
}

/* 左ナビ固定 */
nav {
  width: 230px;
  background-color: #2c3e50;
  color: white;
  padding: 10px;
  box-sizing: border-box;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 1000;
}

nav video { width: 100%; border-radius: 8px; margin-bottom: 10px; }
nav a {
  display: block;
  color: white;
  text-decoration: none;
  padding: 10px;
  margin: 5px 0;
  background-color: #34495e;
  border-radius: 6px;
  text-align: center;
  transition: 0.3s;
}
nav a:hover { background-color: #1abc9c; }

main {
  flex: 1;
  margin-left: 230px;
  padding: 15px;
  overflow: auto;
}

.calendar-nav {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}
.calendar-nav button {
  padding: 6px 12px;
  font-size: 16px;
  cursor: pointer;
}

table.calendar {
  border-collapse: collapse;
  width: 100%;
}

table.calendar th, table.calendar td {
  border: 1px solid #ccc;
  width: 14.28%;
  text-align: left;
  vertical-align: top;
  padding: 4px;
  height: 120px;
  position: relative;
  box-sizing: border-box;
  background-color: #fff;
}

table.calendar th {
  background-color: #2c3e50;
  color: white;
}

td.saturday { background-color: #f0f8ff; }
td.sunday { background-color: #fff0f0; }
td.today { border: 2px solid #1abc9c; }

/* イベント */
.event {
  padding: 2px 4px;
  margin: 2px 0;
  border-radius: 4px;
  color: white;
  font-size: 12px;
  display: block;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tournament { background-color: red; }
.practice { background-color: blue; }
.school { background-color: green; }
.other { background-color: orange; }

/* 凡例 */
.legend {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  font-size: 14px;
}
.legend div {
  display: flex;
  align-items: center;
  gap: 5px;
}
.legend span {
  width: 12px;
  height: 12px;
  display: inline-block;
  border-radius: 3px;
}

/* ポップアップ */
#popup {
  display: none;
  position: fixed;
  background: white;
  border: 2px solid #333;
  padding: 8px;
  border-radius: 5px;
  z-index: 1000;
  max-width: 200px;
  word-wrap: break-word;
  font-size: 14px;
}

/* スマホ対応 */
@media(max-width:768px){
  nav{ width:100%; height:auto; display:flex; overflow-x:auto; white-space:nowrap; }
  nav a{ display:inline-block; margin:4px; font-size:0.9em; }
  nav video{ display:none; }
  main{ margin-left:0; margin-top:150px; height:calc(100vh-150px); }
  table.calendar th, table.calendar td{ height:100px; }
}
</style>
</head>
<body>

<nav>
  <video id="randomVideo" autoplay loop muted playsinline style="width:100%; border-radius:5px; margin-bottom:10px;"></video>
  <a href="https://yuma873.github.io/blush-nimble/toppage.html">トップ</a>
  <a href="https://yuma873.github.io/blush-nimble/index.html" style="display:inline-block;padding:10px 20px;background-color:#f44336;color:white;text-decoration:none;border-radius:5px;font-weight:bold;">ログアウト</a>
</nav>

<main>
<div class="calendar-nav">
  <button id="prev-month">&lt; 前月</button>
  <button id="today-btn">今日に戻る</button>
  <button id="next-month">次月 &gt;</button>
</div>

<h2 id="month-year"></h2>

<table class="calendar">
<thead>
<tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr>
</thead>
<tbody id="calendar-body"></tbody>
</table>

<div class="legend">
  <div><span class="tournament"></span> 大会</div>
  <div><span class="practice"></span> 部活</div>
  <div><span class="school"></span> 学校行事</div>
  <div><span class="other"></span> その他</div>
</div>

<div id="popup"></div>
</main>

<script>
// ランダム動画
const videos=["video1.mp4","video2.mp4","video3.mp4","video5.mp4","V1.mp4","V2.mp4","V3.mp4","V4.mp4","V5.mp4","V6.mp4","V7.mp4","V8.mp4","V9.mp4","V10.mp4"];
document.getElementById("randomVideo").src=videos[Math.floor(Math.random()*videos.length)];

// --- 予定設定 ---
const events=[
  { date:'2025-10-02', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'Jホール' },
    { date:'2025-10-07', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'3Fフィットネスルーム' },
    { date:'2025-10-09', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'Jホール' },
  { date:'2025-10-11', time:'13:30~15:10(SB15:30)', name:'通常活動', type:'practice', location:'Jホール' },
  { date:'2025-10-14', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'3Fフィットネスルーム' },
    { date:'2025-10-16', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'Jホール' },
  { date:'2025-10-21', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'3Fフィットネスルーム' },
  { date:'2025-10-23', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'Jホール' },
  { date:'2025-10-25', time:'13:30~15:10(SB15:30)', name:'通常活動', type:'practice', location:'Jホール' },
  { date:'2025-10-28', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'3Fフィットネスルーム' },
  { date:'2025-10-30', time:'16:00~17:15(SB17:45)', name:'通常活動', type:'practice', location:'Jホール' },
    { date:'2025-11-16', time:'09:00~11:30(集合8:45)', name:'プール練習', type:'practice', location:'伊勢原スイミングクラブ' },

  { date:'2025-11-23', time:'8:00~15:00', name:'大会：湘南スイムミート', type:'tournament', location:'平塚総合公園温水プール(短)' },
  { date:'2025-10-15', time:'8:25~15:00', name:'探究発表会(校内)', type:'school', location:'各教室等' },  
  { date:'2025-10-18', time:'8:25~15:00', name:'探究発表会(一般)', type:'school', location:'各教室等' },
  { date:'2025-10-22', time:'16:00', name:'完全下校', type:'school', location:'--' },
  { date:'2025-10-24', time:'16:00', name:'完全下校', type:'school', location:'--' },
{ date:'2025-10-24', time:'14:20~15:30', name:'漢検', type:'school', location:'HR教室' },
  { date:'2025-11-06', time:'8:25~15:30', name:'自修祭準備', type:'school', location:'HR教室' },
    { date:'2025-11-07', time:'8:25~15:30', name:'自修祭準備', type:'school', location:'HR教室' },
    { date:'2025-11-08', time:'8:25~15:30', name:'自修祭', type:'school', location:'HR教室' },
    { date:'2025-11-09', time:'8:25~15:30', name:'自修祭', type:'school', location:'HR教室' },
    { date:'2025-11-10', time:'All', name:'休校', type:'school', location:'--' },
      { date:'2025-11-11', time:'8:25~15:30', name:'片付け・臨時', type:'school', location:'--' },



];

let currentDate=new Date();
function zeroPad(n){return n.toString().padStart(2,'0');}

function generateCalendar(dateObj){
  const year=dateObj.getFullYear();
  const month=dateObj.getMonth();
  const today=new Date();

  document.getElementById('month-year').textContent=`${year}年 ${month+1}月`;
  const firstDay=new Date(year,month,1).getDay();
  const lastDate=new Date(year,month+1,0).getDate();
  const calendarBody=document.getElementById('calendar-body');
  calendarBody.innerHTML='';

  let row=document.createElement('tr');
  for(let i=0;i<firstDay;i++){ row.appendChild(document.createElement('td')); }

  for(let day=1;day<=lastDate;day++){
    if((firstDay+day-1)%7===0 && day!==1){ calendarBody.appendChild(row); row=document.createElement('tr'); }

    const cell=document.createElement('td');
    const cellDateStr=`${year}-${zeroPad(month+1)}-${zeroPad(day)}`;
    cell.dataset.date=cellDateStr;
    cell.innerHTML=`<strong>${day}</strong><br>`;
    const dayOfWeek=(firstDay+day-1)%7;

    // 土日色付け
    if(dayOfWeek===0) cell.classList.add('sunday');
    if(dayOfWeek===6) cell.classList.add('saturday');

    // 今日強調
    if(day===today.getDate() && month===today.getMonth() && year===today.getFullYear()) cell.classList.add('today');

    // イベント表示用コンテナ
    const eventsContainer=document.createElement('div');
    eventsContainer.style.maxHeight='80px';
    eventsContainer.style.overflowY='auto';

    // イベント追加
    events.filter(ev=>ev.date===cellDateStr).forEach(ev=>{
      const div=document.createElement('span');
      div.className=`event ${ev.type}`;
      div.textContent=`${ev.time} ${ev.name}`;
      div.addEventListener('click',e=>showPopup(e,ev));
      eventsContainer.appendChild(div);
    });

    cell.appendChild(eventsContainer);
    row.appendChild(cell);
  }

  while(row.children.length<7){ row.appendChild(document.createElement('td')); }
  calendarBody.appendChild(row);
}

// ポップアップ
const popup=document.getElementById('popup');
function showPopup(e,ev){
  popup.style.display='block';
  let left=e.pageX+10;
  let top=e.pageY+10;
  if(left+210>window.innerWidth) left=window.innerWidth-220;
  if(top+120>window.innerHeight) top=window.innerHeight-130;
  popup.style.left=left+'px';
  popup.style.top=top+'px';
  popup.innerHTML=`<strong>${ev.name}</strong><br>${ev.time}<br>場所: ${ev.location}`;
}
document.addEventListener('click',e=>{ if(!e.target.classList.contains('event')) popup.style.display='none'; });

// ナビゲーション
document.getElementById('prev-month').addEventListener('click',()=>{ currentDate.setMonth(currentDate.getMonth()-1); generateCalendar(currentDate); });
document.getElementById('next-month').addEventListener('click',()=>{ currentDate.setMonth(currentDate.getMonth()+1); generateCalendar(currentDate); });
document.getElementById('today-btn').addEventListener('click',()=>{ currentDate=new Date(); generateCalendar(currentDate); });

generateCalendar(currentDate);
</script>

</body>
</html>
