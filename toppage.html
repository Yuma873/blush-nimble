<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>総合TOP</title>
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <meta name="description" content="総合TOPページ。メニュー表生成機やツールサイト、ポータルサイトへのリンク集です。">

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #2c3e50;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
        font-size: 2em;
      }

      ul {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }

      li {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 600px;
        padding: 20px 25px;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      li:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      h2 {
        margin: 0 0 10px 0;
        font-size: 1.4em;
        color: #2c3e50;
      }

      a {
        display: inline-block;
        color: #1abc9c;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.1em;
      }

      a::before {
        content: "🔗 ";
      }

      a:hover {
        text-decoration: underline;
      }

      @media screen and (max-width: 480px) {
        body {
          padding: 10px;
        }
        li {
          padding: 15px 18px;
        }
        h2 {
          font-size: 1.2em;
        }
        a {
          font-size: 1em;
        }
      }
    </style>
  </head>
  <body>

      <li>

      </li>
      <li>

      </li>
      <li>

      </li>
