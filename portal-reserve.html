<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポータルサイト - 予約</title>
<link rel="shortcut icon" href="favicon2.png" type="image/png">
<style>
:root {
  --bg-color: #f5f5f5;
  --text-color: #333;
  --nav-bg: #2c3e50;
  --accent: #1abc9c;
}

/* ダークモード */
body.dark {
  --bg-color: #1e1e1e;
  --text-color: #f0f0f0;
  --nav-bg: #111;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  margin: 0;
  display: flex;
  background-color: var(--bg-color);
  color: var(--text-color);
  height: 100vh;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* 左ナビ固定 */
nav {
  width: 230px;
  background-color: var(--nav-bg);
  color: white;
  padding: 10px;
  box-sizing: border-box;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 1000;
}
nav video { width: 100%; border-radius: 8px; margin-bottom: 10px; }
nav a {
  display: block;
  color: white;
  text-decoration: none;
  padding: 10px;
  margin: 5px 0;
  background-color: #34495e;
  border-radius: 6px;
  text-align: center;
  transition: 0.3s;
}
nav a:hover { background-color: var(--accent); }

main {
  flex: 1;
  margin-left: 230px;
  padding: 20px;
  overflow: auto;
  text-align: center;
}

h2 {
  color: var(--accent);
  margin-bottom: 10px;
}

/* ボタン */
button {
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  transition: 0.3s;
}
#goReservation {
  background-color: #888;
  color: white;
  cursor: not-allowed;
}
#goReservation:enabled {
  background-color: var(--accent);
  cursor: pointer;
}
#darkToggle {
  margin-top: 10px;
  background-color: var(--accent);
  color: white;
}

/* モーダル */
#modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 2000;
}
#modal .content {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 8px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}
body.dark #modal .content {
  background: #333;
  color: #fff;
}
.modal-buttons button {
  margin: 10px;
  padding: 8px 20px;
  border-radius: 5px;
}

/* スマホ対応 */
@media(max-width:768px){
  nav{ width:100%; height:auto; display:flex; overflow-x:auto; white-space:nowrap; }
  nav a{ display:inline-block; margin:4px; font-size:0.9em; }
  nav video{ display:none; }
  main{ margin-left:0; margin-top:150px; height:calc(100vh-150px); }
}
</style>
</head>
<body>

<!-- 🔐 パスワード保護 -->
<script>
const pass = prompt("アクセス用パスワードを入力してください：");
if (pass !== "portal2025") {
  alert("パスワードが違います。アクセスできません。");
  location.href = "https://yuma873.github.io/blush-nimble/index.html";
}
</script>

<nav>
  <video id="randomVideo" autoplay loop muted playsinline></video>
  <a href="https://yuma873.github.io/blush-nimble/toppage.html">トップ</a>
  <a href="https://yuma873.github.io/blush-nimble/index.html"
     style="display:inline-block;padding:10px 20px;background-color:#f44336;color:white;text-decoration:none;border-radius:5px;font-weight:bold;">
     ログアウト
  </a>
  <button id="darkToggle">🌗 ダークモード</button>
</nav>

<main>
  <h2>予約ページへ進む</h2>
  <p>以下の認証を完了すると、予約サイトにアクセスできます。</p>

  <!-- reCAPTCHA -->
  <div class="g-recaptcha"
       data-sitekey="6Lc8t_grAAAAAFDGM9M6R1weWRC47R1m-JMwVJ8g"
       data-callback="onRecaptchaSuccess"></div>

  <br>
  <button id="goReservation" disabled>予約ページへ</button>
</main>

<!-- モーダル -->
<div id="modal">
  <div class="content">
    <h3>確認</h3>
    <p>認証が完了しました。<br>予約ページを新しいタブで開きますが、よろしいですか？</p>
    <div class="modal-buttons">
      <button id="okBtn" style="background:#1abc9c;color:white;">OK</button>
      <button id="cancelBtn" style="background:#ccc;">キャンセル</button>
    </div>
  </div>
</div>

<!-- reCAPTCHAスクリプト -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<script>
// ✅ reCAPTCHA完了でボタン有効化
function onRecaptchaSuccess() {
  document.getElementById("goReservation").disabled = false;
  document.getElementById("goReservation").style.cursor = "pointer";
}

// ✅ モーダル確認
const modal = document.getElementById("modal");
document.getElementById("goReservation").addEventListener("click", function() {
  const response = grecaptcha.getResponse();
  if (response.length === 0) {
    alert("reCAPTCHAを完了してください。");
    return;
  }
  modal.style.display = "flex";
});
document.getElementById("okBtn").onclick = function() {
  window.open("https://www.r326.com/b/main.aspx?g=IIu0c8qZ2933SZW001", "_blank");
  modal.style.display = "none";
};
document.getElementById("cancelBtn").onclick = function() {
  modal.style.display = "none";
};

// 🌗 ダークモード切替
const darkToggle = document.getElementById("darkToggle");
darkToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark");
});

// 🎞️ ランダム動画
const videos = [
  "video1.mp4", "video2.mp4", "video3.mp4", "video5.mp4",
  "V1.mp4", "V2.mp4", "V3.mp4", "V4.mp4", "V5.mp4",
  "V6.mp4", "V7.mp4", "V8.mp4", "V9.mp4", "V10.mp4"
];
const randomIndex = Math.floor(Math.random() * videos.length);
document.getElementById("randomVideo").src = videos[randomIndex];
</script>

</body>
</html>
