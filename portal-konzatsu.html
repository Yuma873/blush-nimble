<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>混雑状況一覧</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
  }
  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    padding: 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .card h2 {
    margin: 0;
    padding: 10px;
    background: #2c3e50;
    color: #fff;
    font-size: 16px;
  }
  iframe {
    width: 100%;
    height: 450px;
    border: none;
  }
</style>
</head>
<body>

<div class="container">

  <div class="card">
    <h2>混雑状況（横浜サブ）</h2>
    <iframe src="https://smilego.jp/9c9e300"></iframe>
  </div>

  <div class="card">
    <h2>混雑状況（横浜メイン）</h2>
    <iframe src="https://smilego.jp/22dac1c"></iframe>
  </div>

  <div class="card">
    <h2>混雑状況（相模原）</h2>
    <iframe src="https://smilego.jp/6616bc5"></iframe>
  </div>

  <div class="card">
    <h2>混雑状況（平塚）</h2>
    <iframe src="https://smilego.jp/7df5d90"></iframe>
  </div>

</div>

</body>
</html>
