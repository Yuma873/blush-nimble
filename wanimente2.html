<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🐊 ワニワニパニック タイマー（メンテナンス中）</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      padding-top: 40px;
      height: 100vh;
      margin: 0;
      user-select: none;
      position: relative;
    }
    h1 {
      margin-bottom: 10px;
    }
    /* ゲーム部分を無効化・半透明化 */
    #countdown, #timer, #score, #achievement, #points, #finalPoints, #pointInput, #startBtn, #resetBtn {
      pointer-events: none;
      opacity: 0.3;
    }

    /* ===== メンテナンスオーバーレイ ===== */
    #maintenanceOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(240, 248, 255, 0.95);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #maintenanceOverlay h1 {
      font-size: 2.8em;
      color: #ff4500;
      margin-bottom: 20px;
    }
    #maintenanceOverlay p {
      font-size: 1.3em;
      color: #333;
    }
    #returnBtn {
      margin-top: 40px;
      font-size: 1.3em;
      padding: 15px 35px;
      border-radius: 10px;
      border: 2px solid #4682b4;
      background-color: #98fb98;
      cursor: pointer;
      transition: 0.3s;
      z-index: 2000; /* 🔥 ボタンだけ最前面に */
      pointer-events: auto; /* 🔥 クリック可能に戻す */
    }
    #returnBtn:hover {
      background-color: #7fffd4;
    }
  </style>
</head>
<body>

  <h1>🐊 点数集計・計時システム 2号機</h1>
  <p>このページはメンテナンスモードです。</p>
  <input id="pointInput" type="number" min="0" value="100" placeholder="ポイント入力">
  <div id="countdown">（メンテナンス中は操作できません）</div>
  <div id="timer">30</div>
  <div id="score">スコア：0</div>
  <div id="achievement">達成！🎉</div>
  <div id="points">現在のポイント：0</div>
  <div id="finalPoints"></div>

  <div>
    <button id="startBtn">▶️ スタート</button>
    <button id="resetBtn">🔁 リセット</button>
  </div>

  <!-- ===== メンテナンスオーバーレイ ===== -->
  <div id="maintenanceOverlay">
    <h1>⚙️ メンテナンス中です</h1>
    <p>現在、ゲーム休止中です。<br>復旧まで今しばらくお待ち下さい。</p>
    <button id="returnBtn" onclick="location.href='wani2.html'">🔁 Recovery</button>
  </div>

</body>
</html>
