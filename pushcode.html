<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PushCode 通知テスト</title>

<!-- PushCode 本体 -->
<script defer src="https://www.pushcode.jp/dist/js/pushcode.js"></script>
<script>
window.PushCodeInit = function() {
  try {
    if (PushCode && PushCode.isSupport()) {
      PushCode.init({
        domainToken: '6d20f79ae2615a8ced22db9f79bb01abfbbbe2fb5a2f558f1269ee6b21b3ce15',
        userid: '',
        serviceWorkerPath: '/blush-nimble/pushcode_sw.js', // GitHub Pages上のSW
        scopePath: '/blush-nimble/'
      });
      
      // DOMが完全にロードされてから許可枠を開く
      window.addEventListener('load', function() {
        PushCode.components.openSubscribeDialog();
      });
    }
  } catch (err) {
    console.error(err);
    if (PushCode) PushCode.sendError(err);
  }
};
</script>
</head>
<body>
<h1>PushCode 通知テスト</h1>
<p>このページにアクセスすると、通知許可枠が表示されます。</p>
</body>
</html>
